<meta charset="utf-8">
<title>Falling Sand</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200;300&family=Familjen+Grotesk:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="shared/lab.css">
<style>
  /* element ring: arc segments hugging the bedrock circle, like the rings on a watch face. Six elements across the
     top, the eraser and reset tucked into the bottom corners beside it. Hidden in the feed (lab-embed). */
  .sand-tools { position: absolute; inset: 0; z-index: 3; width: 100%; height: 100%; pointer-events: none; overflow: visible; --fs: 12.5px; }
  .sand-tools g { pointer-events: auto; cursor: pointer; outline: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .sand-tools path.seg { fill: color-mix(in srgb, var(--sw, var(--bg)) 30%, var(--bg)); stroke: var(--line); stroke-width: 1; transition: fill .15s, stroke .15s; }
  .sand-tools g:hover path.seg { stroke: var(--dim); }
  .sand-tools g:focus-visible path.seg { stroke: var(--ink); stroke-width: 1.5; }
  .sand-tools g[aria-pressed="true"] path.seg { fill: color-mix(in srgb, var(--sw) 88%, var(--bg)); stroke: var(--ink); }
  .sand-tools g.erase path.seg, .sand-tools g.reset path.seg { fill: color-mix(in srgb, var(--bg) 80%, transparent); }
  .sand-tools g.erase path.seg { stroke-dasharray: 3 3; stroke: var(--dim); }
  .sand-tools g.erase[aria-pressed="true"] path.seg { stroke: var(--ink); }
  /* reset is a hold: an ink trace runs round the button while it's held, and the button flashes when it fires */
  .sand-tools path.prog { fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round; stroke-dasharray: 1 1; stroke-dashoffset: 1; opacity: 0; pointer-events: none; transition: stroke-dashoffset .25s ease-out, opacity .25s; }
  .sand-tools g.holding path.prog { stroke-dashoffset: 0; opacity: 1; transition: stroke-dashoffset var(--hold) linear, opacity .1s; }
  .sand-tools g.holding path.seg { fill: color-mix(in srgb, var(--ink) 14%, var(--bg)); }
  .sand-tools g.fired path.seg { fill: var(--ink); transition: none; }
  .sand-tools g.fired text { fill: var(--bg); }
  .sand-tools text { font: 400 var(--fs) var(--mono); letter-spacing: .06em; text-transform: uppercase; fill: var(--ink); pointer-events: none; }
  .sand-tools g.light[aria-pressed="true"] text { fill: #111; }
  .sand-tools tspan.k { fill: var(--dim); }
  .sand-tools g[aria-pressed="true"] tspan.k { fill: inherit; fill-opacity: .55; }
  .sand-tools.compact tspan.k { display: none; }
  html.lab-embed .sand-tools { display: none; }
  .lab-hint { max-width: 36%; }
  .lab-stage > canvas { cursor: crosshair; }
</style>
<script type="module">
import { createLab } from './shared/lab.js';
import { LOGO_PIECES, fitLogo, logoPolygons } from './shared/logo.js';

// =====================================================================================
// Knobs that aren't sliders. Everything Scott might want to argue with lives up here.
// Sim time: 1 "sim second" = NOMINAL_HZ ticks. At the default 3 steps per frame and 60 fps,
// sim seconds are real seconds; the Speed slider speeds everything up together.
// =====================================================================================
const NOMINAL_HZ = 180;
const THAW_SPREAD = 1.6;   // sim s from the first cell of the mark released to the last
const BUD_WAIT = 7;        // bloom steps a bud stays closed (swelling green → colour) before it opens
const SAP_MAX = 12;        // water a root can hold for its plant
const ROOT_REACH = 3;      // radius, in cells, a root drinks from
const SEED_REACH = 2;      // a resting seed germinates when water is this close
const MAX_SWAY = 3;        // stems may wander this many cells left or right of their root
const LAVA_REACH = 2;      // lava looks this far sideways for somewhere lower (water uses the Spread slider)
const GROW_P = 0.028;      // chance per tick a stem tip grows (× Growth rate)
const BLOOM_P = 0.045;     // chance per tick a bud takes a bloom step (× Growth rate)
const DRINK_P = 0.07;      // chance per tick a root tries to drink (× Growth rate)
const FADE = 0.8;          // s crossfade back to the mark on reset
const QUIET_ACT = 3e-4;    // share of the box visibly changing per tick (smoothed) below which, with nothing burning, it starts to count as settled
const BUSY_ACT = 8e-4;     // ...and above which it's busy again; in between, a settling box keeps settling
const DRAIN_DEG = 15;       // the drain plug spans this much of the basin's bottom
const DRAIN_MAX = 8;        // s a drain may take before the box resets anyway
const RUN_CAP = 30;        // s after the thaw (plus the Settled for wait) before an auto reset even if it never goes quiet
const IDLE_RESET = 240;    // s with no input before an auto reset even if it never goes quiet
const HAND_IDLE = 20;      // s with no input before someone who touched it counts as gone: reset, back to the demo
const OUTLINE_GAP = 3;     // body outline: one dot every this many dot sizes
const FLOOR_PAD = 42;      // CSS px between the sandbox floor and the stage bottom (room for the HUD)

// ---- elements ----
const EMPTY = 0, WATER = 1, LAVA = 2, WOOD = 3, STONE = 4, ASH = 5, STEAM = 6, SMOKE = 7,
  FIRE = 8, SEED = 9, ROOT = 10, STEM = 11, LEAF = 12, TIP = 13, BUD = 14, PETAL = 15;
const NAMES = ['empty', 'water', 'lava', 'wood', 'stone', 'ash', 'steam', 'smoke', 'fire', 'seed', 'root', 'stem', 'leaf', 'tip', 'bud', 'petal'];
const table = (list, v = 1, fill = 0) => { const a = new Uint8Array(16).fill(fill); for (const t of list) a[t] = v; return a; };
// density decides who sinks through whom; 255 = fixed in place
const DENS = new Uint8Array(16).fill(255);
DENS[EMPTY] = 0; DENS[STEAM] = 0; DENS[SMOKE] = 0; DENS[WATER] = 2; DENS[LAVA] = 3; DENS[ASH] = 4; DENS[SEED] = 4; DENS[STONE] = 5;
const PLANT = table([SEED, ROOT, STEM, LEAF, TIP, BUD, PETAL]);   // burns
const FERTILE = table([WOOD, STONE, ASH]);                       // water resting on these can plant a seed (the floor counts too)
const SOFT = table([EMPTY, WATER, STEAM, SMOKE]);                // plants may grow into these
const THIN = table([STEM, LEAF, TIP, BUD, PETAL]);              // water threads through these without moving them

// ---- flowers: grown cell by cell from these patterns ----
// '*' is the bud (the top of the stem). Letters are roles: a petal, b petal shade, c centre, d centre dark, g green.
// Bloom order: green first, then outward from `start` ('origin' = cup opens upward from the stem, 'center' = unfurls).
const GREEN = [58, 150, 62];
const SPECIES = [
  { name: 'tulip', h: [11, 17], sway: 0.03, nLeaves: 2, leaf: [[1, 0], [1, -1], [2, -2], [2, -3]], origin: 'b', start: 'origin',
    rows: ['a.a.a', 'aabaa', 'abbba', '.b*b.'],
    variants: [{ a: [232, 36, 54], b: [170, 18, 40] }, { a: [255, 210, 44], b: [228, 150, 18] }, { a: [255, 124, 176], b: [214, 72, 136] }, { a: [164, 74, 214], b: [112, 42, 164] }] },
  { name: 'rose', h: [12, 18], sway: 0.07, nLeaves: 2, leaf: [[1, 0], [1, -1], [2, -1]], origin: 'g', start: 'center', spiral: true,
    rows: ['.aba.', 'abbaa', 'abcba', 'aabba', '.aaa.', 'g.*.g'],
    variants: [{ a: [200, 20, 46], b: [142, 8, 32], c: [92, 0, 22] }, { a: [240, 100, 142], b: [198, 58, 102], c: [150, 30, 72] }, { a: [244, 236, 228], b: [212, 200, 196], c: [180, 168, 166] }] },
  { name: 'daisy', h: [9, 16], sway: 0.06, nLeaves: 2, leaf: [[1, 0], [2, -1]], origin: 'g', start: 'center',
    rows: ['...a...', '.a.a.a.', '..ccc..', 'aacdcaa', '..ccc..', '.a.g.a.', '...*...'],
    variants: [{ a: [248, 248, 242], c: [255, 206, 32], d: [212, 138, 16] }, { a: [206, 176, 246], c: [255, 206, 32], d: [212, 138, 16] }] },
  { name: 'poppy', h: [10, 18], sway: 0.12, nLeaves: 1, leaf: [[1, 0], [2, -1]], origin: 'g', start: 'center',
    rows: ['.a.a.', 'aabaa', 'abdba', '.aaa.', '..*..'],
    variants: [{ a: [255, 70, 36], b: [212, 36, 24], d: [28, 18, 22] }, { a: [255, 150, 32], b: [238, 108, 18], d: [120, 60, 8] }] },
  { name: 'cornflower', h: [8, 14], sway: 0.12, nLeaves: 1, leaf: [[1, 0], [2, -1]], origin: 'g', start: 'center',
    rows: ['a.a.a', '.aba.', 'aabaa', '.bbb.', '..*..'],
    variants: [{ a: [78, 120, 255], b: [44, 64, 206] }, { a: [120, 176, 255], b: [66, 108, 230] }] },
  { name: 'lavender', h: [6, 11], sway: 0.0, nLeaves: 1, leaf: [[1, 0]], origin: 'g', start: 'origin', grey: true,
    rows: ['.a.', 'aba', '.a.', 'aba', '.b.', 'aba', '.g.', '.*.'],
    variants: [{ a: [178, 130, 238], b: [124, 88, 198] }] },
  { name: 'buttercup', h: [5, 10], sway: 0.15, nLeaves: 1, leaf: [[1, 0]], origin: 'g', start: 'origin',
    rows: ['a.a', 'aba', '.a.', '.*.'],
    variants: [{ a: [255, 228, 50], b: [236, 176, 0] }] },
  // water only: a seed that sprouts under water rises straight to the surface, lays a lily pad on it, and opens a
  // lotus a few cells above (h counts only the stem above the water)
  { name: 'lotus', water: true, h: [3, 4], sway: 0, nLeaves: 0, leaf: [], origin: 'b', start: 'origin',
    rows: ['...a...', 'a..a..a', '.a.b.a.', '.abcba.', 'aabcbaa', '.abbba.', '...*...'],
    variants: [{ a: [255, 170, 204], b: [236, 104, 156], c: [255, 214, 72] }, { a: [250, 246, 240], b: [240, 196, 214], c: [255, 214, 72] }] }
];
const LOTUS = SPECIES.findIndex(s => s.water);
const PAD_R = [4, 6];      // lily pad half-width, cells
const MIXES = {
  meadow: [3, 2, 3, 2, 2, 2, 2],
  garden: [3, 2, 3, 0, 0, 0, 0],
  wild:   [0, 0, 1, 3, 3, 2, 3]
};
SPECIES.forEach((s, k) => { if (!s.water) MIXES[s.name] = SPECIES.map((_, j) => j === k ? 1 : 0); });

// colour table for petals (aux of a PETAL cell indexes this)
const COLORS = [];
const cid = rgb => { COLORS.push(rgb); return COLORS.length - 1; };
for (const s of SPECIES) {
  let ox = 0, oy = 0;
  s.rows.forEach((r, y) => [...r].forEach((ch, x) => { if (ch === '*') { ox = x; oy = y; } }));
  const cells = [];
  s.rows.forEach((r, y) => [...r].forEach((ch, x) => { if (ch !== '.' && ch !== '*') cells.push({ dx: x - ox, dy: y - oy, role: ch }); }));
  let sx = 0, sy = 0;
  if (s.start === 'center') {
    const head = cells.filter(c => c.role !== 'g');
    sx = head.reduce((v, c) => v + c.dx, 0) / head.length; sy = head.reduce((v, c) => v + c.dy, 0) / head.length;
  }
  const key = c => {
    const r = Math.hypot(c.dx - sx, c.dy - sy), a = (Math.atan2(c.dy - sy, c.dx - sx) + Math.PI) / (2 * Math.PI);
    return (c.role === 'g' ? -100 : 0) + (s.spiral ? r + a : r + a * 0.01);
  };
  s.cells = cells.sort((p, q) => key(p) - key(q));
  s.cid = s.variants.map(v => {
    const m = {};
    for (const role of 'abcdg') m[role] = cid(role === 'g' ? GREEN : v[role] || v.a);
    return m;
  });
}

// =====================================================================================
const lab = createLab({
  number: '10',
  title: 'Falling Sand',
  blurb: 'The mark as a sandbox of lava, water and wood. Lava eats the wood, water and lava make stone and steam, and wet ground grows flowers.',
  teaches: 'A cellular automaton on Canvas 2D, writing raw pixels through ImageData, one pixel per grain. A seeded random number generator means each loop replays exactly until you paint on it.',
  hint: 'drag to paint · keys 1–7 pick · [ ] brush',
  feed: { touch: 'drag', hint: 'drag to paint' },
  palettes: [
    { key: 'nature', name: 'Nature', bg: '#000000', grid: '#17171d', ink: '#f4f4f6', colors: ['#2a74ea', '#8a5530', '#ff7a14', '#e8304a', '#3c9a40'] }
    // the materials keep their natural colors, so a vivid palette only tinted the backdrop; Bench (grey) and Nature it is
  ],
  defaultPalette: 'nature',
  params: {
    hSim:      { type: 'heading', label: 'Simulation' },
    speed:     { type: 'range', label: 'Steps per frame', min: 1, max: 8, step: 1, value: 2 },
    res:       { type: 'range', label: 'Cells across', min: 120, max: 320, step: 10, value: 200 },
    hold:      { type: 'range', label: 'Hold the mark before it thaws', min: 0, max: 8, step: 0.1, value: 2, unit: ' s' },
    seed:      { type: 'range', label: 'Random seed (each loop replays exactly)', min: 1, max: 99, step: 1, value: 1 },
    thaw:      { type: 'select', label: 'Thaw', value: 'melt', options: [['melt', 'Melt from the bottom'], ['top', 'Top down'], ['ripple', 'Ripple from center'], ['all', 'All at once']] },
    hLava:     { type: 'heading', label: 'Lava' },
    lavaFlow:  { type: 'range', label: 'Flow', min: 0.02, max: 1, step: 0.01, value: 0.02 },
    lavaCool:  { type: 'range', label: 'Cools to stone on its own', min: 0, max: 4, step: 0.05, value: 1 },
    // each wood cell takes a random time between these two to burn through
    biteMin:   { type: 'range', label: 'Burns through wood in, shortest', min: 1, max: 400, step: 1, value: 10, unit: ' ticks' },
    biteMax:   { type: 'range', label: 'Burns through wood in, longest', min: 1, max: 600, step: 1, value: 50, unit: ' ticks' },
    embers:    { type: 'range', label: 'Embers from burning wood', min: 0, max: 1, step: 0.05, value: 0.75 },
    emberCatch:{ type: 'range', label: 'Ember sets wood alight', min: 0, max: 1, step: 0.05, value: 0.7, when: P => P.embers > 0 },
    hFire:     { type: 'heading', label: 'Fire' },
    fireSpread:{ type: 'range', label: 'Spread chance', min: 0, max: 1, step: 0.05, value: 0.8 },
    burn:      { type: 'range', label: 'Burn time', min: 5, max: 300, step: 5, value: 90, unit: ' ticks' },
    ash:       { type: 'range', label: 'Ash left behind', min: 0, max: 1, step: 0.05, value: 0.1 },
    hWater:    { type: 'heading', label: 'Water' },
    spread:    { type: 'range', label: 'Spread', min: 1, max: 32, step: 1, value: 16, unit: ' cells' },
    condense:  { type: 'range', label: 'Steam condenses after', min: 0.5, max: 10, step: 0.1, value: 7, unit: ' s' },
    rainBack:  { type: 'range', label: 'Steam rains back', min: 0, max: 1, step: 0.05, value: 0.3 },
    hFlowers:  { type: 'heading', label: 'Flowers' },
    seeding:   { type: 'range', label: 'Seeding', min: 0, max: 3, step: 0.05, value: 1 },
    growth:    { type: 'range', label: 'Growth rate', min: 0.1, max: 4, step: 0.1, value: 2, unit: '×', when: P => P.seeding > 0 },
    tall:      { type: 'range', label: 'Height', min: 0.4, max: 2.5, step: 0.1, value: 0.7, unit: '×', when: P => P.seeding > 0 },
    spacing:   { type: 'range', label: 'Spacing', min: 2, max: 16, step: 1, value: 11, unit: ' cells', when: P => P.seeding > 0 },
    mix:       { type: 'select', label: 'Species', value: 'meadow', options: [['meadow', 'Meadow (all)'], ['garden', 'Garden: tulip, rose, daisy'], ['wild', 'Wildflowers'], ...SPECIES.filter(s => !s.water).map(s => [s.name, s.name[0].toUpperCase() + s.name.slice(1)])], when: P => P.seeding > 0 },
    lotus:     { type: 'toggle', label: 'Lily pads and lotus in water', value: true },
    hRock:     { type: 'heading', label: 'Bedrock' },
    ring:      { type: 'toggle', label: 'Bedrock round the mark', value: true },
    ringGap:   { type: 'range', label: 'Bedrock distance', min: 1, max: 3, step: 0.05, value: 1, unit: ' bars', when: P => P.ring },
    fossils:   { type: 'toggle', label: 'Fossils in the bedrock', value: true },
    hLoop:     { type: 'heading', label: 'Loop' },
    autoReset: { type: 'toggle', label: 'Auto reset when settled', value: true },
    quiet:     { type: 'range', label: 'Settled for', min: 2, max: 30, step: 1, value: 2, unit: ' s', when: P => P.autoReset },
    hLook:     { type: 'heading', label: 'Look' },
    outline:   { type: 'toggle', label: 'Body outline', value: true },
    shimmer:   { type: 'toggle', label: 'Shimmer', value: true },
    glow:      { type: 'toggle', label: 'Lava glow', value: true },
    hTools:    { type: 'heading', label: 'Brush' },
    brush:     { type: 'range', label: 'Brush radius', min: 1, max: 16, step: 1, value: 4, unit: ' cells' }
  },
  actions: [
    { label: 'Reset', primary: true, action: () => { startDrain(); touch(); } },
    { label: 'Rain', action: () => { rainT = 1.6; touch(); } },
    { label: 'Clear', action: () => { clearAll(); touch(); } }
  ]
});
const P = lab.params;

// ---- element palette on the stage ----
const TOOLS = [
  { key: 'water', el: WATER, label: 'Water', sw: '#2f7cf0', density: 0.55 },
  { key: 'lava', el: LAVA, label: 'Lava', sw: '#ff7a14', density: 0.55 },
  { key: 'wood', el: WOOD, label: 'Wood', sw: '#8a5530', density: 1 },
  { key: 'ash', el: ASH, label: 'Ash', sw: '#a3a19f', density: 0.45 },
  { key: 'seed', el: SEED, label: 'Seed', sw: '#b08a4a', density: 0.03 },
  { key: 'stone', el: STONE, label: 'Stone', sw: '#5b5a62', density: 0.45 },
  { key: 'erase', el: EMPTY, label: 'Eraser', sw: 'transparent', density: 1 }
];
let tool = TOOLS[0];
const SVGNS = 'http://www.w3.org/2000/svg', LIGHT = ['lava', 'ash', 'seed'];   // swatches light enough for dark text
const svgEl = (tag, attrs = {}) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
const toolBox = svgEl('svg', { class: 'sand-tools', role: 'group', 'aria-label': 'Paint element' });
lab.stage.appendChild(toolBox);
// one ring button: a rounded arc (or, in the bottom corners, a rounded triangle) with its label set along an arc.
// `hold` makes it fire only after being held that long, an ink trace running round its edge meanwhile.
const HOLD = 0.8;
function ringButton(label, key, cls, onPress, hold = 0) {
  const g = svgEl('g', { role: 'button', tabindex: 0, 'aria-label': hold ? `Hold to ${label.toLowerCase()}` : label, class: cls });
  const seg = svgEl('path', { class: 'seg' }), line = svgEl('path', { id: 'sand-arc-' + cls.split(' ')[0], fill: 'none' });
  const text = svgEl('text', { 'text-anchor': 'middle', 'dominant-baseline': 'central' }), tp = svgEl('textPath', { startOffset: '50%', href: '#' + line.id });
  tp.append(label);
  if (key) { const k = svgEl('tspan', { class: 'k', dx: 6 }); k.textContent = key; tp.append(k); }
  text.append(tp); g.append(line, seg, text);
  g.chars = label.length + (key ? 2 : 0);
  if (!hold) {
    g.addEventListener('click', onPress);
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onPress(); } });
  } else {
    const prog = svgEl('path', { class: 'prog', pathLength: 1 });
    g.append(prog); g.prog = prog; g.style.setProperty('--hold', hold + 's');
    let timer = 0;
    const start = () => {
      clearTimeout(timer); g.classList.add('holding');
      timer = setTimeout(() => {
        g.classList.remove('holding'); g.classList.add('fired');
        setTimeout(() => g.classList.remove('fired'), 260);
        onPress();
      }, hold * 1000);
    };
    const cancel = () => { clearTimeout(timer); g.classList.remove('holding'); };
    g.addEventListener('pointerdown', e => { if (e.button > 0) return; e.preventDefault(); try { g.setPointerCapture(e.pointerId); } catch (_) {} start(); });
    for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) g.addEventListener(ev, cancel);
    g.addEventListener('contextmenu', e => e.preventDefault());
    g.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && !e.repeat) { e.preventDefault(); start(); } });
    g.addEventListener('keyup', e => { if (e.key === 'Enter' || e.key === ' ') cancel(); });
    g.addEventListener('blur', cancel);
  }
  const P = (cx, cy, a, r) => (cx + r * Math.cos(a)).toFixed(2) + ' ' + (cy + r * Math.sin(a)).toFixed(2);
  const label_ = (cx, cy, r, a0, a1, flip) => line.setAttribute('d', flip
    ? `M${P(cx, cy, a1, r)} A${r} ${r} 0 0 0 ${P(cx, cy, a0, r)}` : `M${P(cx, cy, a0, r)} A${r} ${r} 0 0 1 ${P(cx, cy, a1, r)}`);
  // an arc: centre (cx, cy), centre-line radius rc, thickness th, from angle a0 to a1 (clockwise, radians); flip runs
  // the label anticlockwise so it reads upright along the bottom. Between a rounded rect and a stroked arc: an annular
  // sector whose corners round off by about 40% of its thickness.
  g.place = (cx, cy, rc, th, a0, a1, flip) => {
    const ri = rc - th / 2, ro = rc + th / 2, k = th * 0.42, Q = (a, r) => P(cx, cy, a, r);
    seg.setAttribute('d', `M${Q(a0 + k / ro, ro)} A${ro} ${ro} 0 0 1 ${Q(a1 - k / ro, ro)} Q${Q(a1, ro)} ${Q(a1, ro - k)}` +
      ` L${Q(a1, ri + k)} Q${Q(a1, ri)} ${Q(a1 - k / ri, ri)} A${ri} ${ri} 0 0 0 ${Q(a0 + k / ri, ri)} Q${Q(a0, ri)} ${Q(a0, ri + k)}` +
      ` L${Q(a0, ro - k)} Q${Q(a0, ro)} ${Q(a0 + k / ro, ro)} Z`);
    label_(cx, cy, rc, a0, a1, flip);
  };
  // a corner triangle: its inner side follows the ring (radius ri, from a0 to a1), the other two run out to a point
  // h beyond the ring at the middle angle. Base corners round by k, the point more softly.
  g.placeTri = (cx, cy, ri, h, a0, a1, k) => {
    const xy = (a, r) => [cx + r * Math.cos(a), cy + r * Math.sin(a)], f = v => v.map(n => n.toFixed(2)).join(' ');
    const B0 = xy(a0, ri), B1 = xy(a1, ri), A = xy((a0 + a1) / 2, ri + h), ka = Math.min(h * 0.3, k * 1.6);
    const along = (p, q, d) => { const l = Math.hypot(q[0] - p[0], q[1] - p[1]); return [p[0] + (q[0] - p[0]) * d / l, p[1] + (q[1] - p[1]) * d / l]; };
    const d = `M${f(xy(a0 + k / ri, ri))} A${ri} ${ri} 0 0 1 ${f(xy(a1 - k / ri, ri))} Q${f(B1)} ${f(along(B1, A, k))}` +

  L(WOOD, k => pack(...mix3(WOOD_RGB[0], WOOD_RGB[1], k)));
  L(STONE, k => pack(...mix3([54, 54, 62], [92, 90, 100], k)));
  // bedrock is a stepped ombre, ROCK_STEPS bands from light grey at the top to near black at the floor; fossils follow
  // it a little lighter
  for (let l = 0; l < ROCK_STEPS; l++) for (let s = 0; s < 8; s++) {
    const r = mix3(mix3([104, 103, 106], [30, 30, 33], l / (ROCK_STEPS - 1)), [0, 0, 0], s * 0.018);
    ROCK[l * 8 + s] = pack(...r);
    BONE[l * 8 + s] = pack(...mix3(r, [214, 206, 192], 0.2 + s * 0.012));
  }
  L(ASH, k => pack(...mix3([122, 120, 122], [178, 174, 170], k)));
  L(STEAM, k => pack(...mix3([186, 196, 212], [226, 232, 242], k), 95 + k * 60));
  L(SMOKE, k => pack(70, 70, 78, k * 150));
  L(FIRE, k => pack(...ramp3([[255, 248, 170], [255, 172, 30], [232, 62, 10]], k)));
  for (let s = 0; s < 16; s++) { const tri = s < 8 ? s / 8 : (16 - s) / 8; EMB[s] = pack(...ramp3([[255, 84, 12], [255, 160, 40], [255, 236, 150]], tri)); }
  L(SEED, k => pack(...mix3([134, 96, 48], [190, 150, 82], k)));
  L(ROOT, k => pack(...mix3([74, 58, 34], [104, 82, 48], k)));
  // stems: 0–7 green, 8–15 the grey-green of lavender
  L(STEM, (k, s) => s < 8 ? pack(...mix3([32, 116, 44], [58, 150, 62], s / 7)) : pack(...mix3([92, 122, 92], [124, 150, 114], (s - 8) / 7)));
  L(LEAF, k => pack(...mix3([48, 152, 54], [96, 200, 80], k)));
  L(TIP, k => pack(...mix3([110, 200, 86], TIP_RGB, k)));
  const SH = [0.86, 0.95, 1, 1.07];
  COLORS.forEach((c, n) => { for (let s = 0; s < 4; s++) PET[n * 4 + s] = pack(c[0] * SH[s], c[1] * SH[s], c[2] * SH[s]); });
  GLOW_C = mono ? [255, 255, 255] : [255, 104, 30];
  WATER_HI = pack(170, 214, 255);
}

// ---- outline: a dotted line of little squares, one cell big, evenly spaced round each piece ----
// Each loop gets a whole number of dots, so the spacing never breaks where it closes. Every dot is turned to its
// edge, so along the mark's 42.8° sides they sit as diamonds, in step with the cells.
let outline = null;
const PIECE_POLYS = logoPolygons({ curveSegments: 16 });
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
function bodyOutline() {
  const pal = lab.palette, s = fit.scale;
  const dot = Math.min(4, Math.max(1.5, cd / dpr));          // CSS px: one cell
  const inset = Math.max(2, cd / dpr + 1) + dot / 2;          // cells stair-step along the edges, so sit a cell plus a bit inside
  const key = [canvas.width, canvas.height, dpr, s, fit.cx, fit.cy, pal.ink, dot].join('|');
  if (outline?.key === key) return outline.c;
  const c = outline?.c || document.createElement('canvas');
  c.width = canvas.width; c.height = canvas.height;
  const o = c.getContext('2d');
  o.setTransform(dpr, 0, 0, dpr, 0, 0);
  o.fillStyle = rgba(pal.ink, 0.5);
  for (const poly of PIECE_POLYS) {
    const pts = poly.map(([x, y]) => [fit.cx + x * s, fit.cy + y * s]), n = pts.length;
    let area = 0;
    for (let i = 0; i < n; i++) { const [ax, ay] = pts[i], [bx, by] = pts[(i + 1) % n]; area += ax * by - bx * ay; }
    const inward = area > 0 ? 1 : -1;
    const seg = pts.map((p, i) => { const q = pts[(i + 1) % n]; return Math.hypot(q[0] - p[0], q[1] - p[1]); });
    const total = seg.reduce((a, b) => a + b, 0), count = Math.max(3, Math.round(total / (dot * OUTLINE_GAP))), step = total / count;
    let i = 0, along = 0;
    for (let k = 0; k < count; k++) {
      const d = k * step;
      while (along + seg[i] < d && i < n - 1) along += seg[i++];
      const [px, py] = pts[i], [qx, qy] = pts[(i + 1) % n], u = (d - along) / seg[i];
      const tx = (qx - px) / seg[i], ty = (qy - py) / seg[i];
      const x = px + (qx - px) * u - ty * inward * inset, y = py + (qy - py) * u + tx * inward * inset;
      o.save(); o.translate(x, y); o.transform(tx, ty, -ty, tx, 0, 0);
      o.fillRect(-dot / 2, -dot / 2, dot, dot);
      o.restore();
    }
  }
  outline = { key, c };
  return c;
}

// ---- render ----
let fr = 0, fade = null;
const counts = new Uint32Array(16);
function render() {
  if (rockWave.length !== W) makeRockWave();
  counts.fill(0); glowA.fill(0);
  const shim = P.shimmer && !lab.calm, f2 = fr >> 2, bite = Math.max(1, P.biteMax);
  for (let y = 0; y < H; y++) {
    const row = y * W, grow = (y >> 2) * gw;
    for (let x = 0; x < W; x++) {
      const i = row + x, t = type[i];
      if (t === EMPTY) { px[i] = 0; continue; }
      if (!(t === STONE && aux[i])) counts[t]++;   // bedrock and fossils are scenery, not counted
      const sh = shade[i];
      let c;
      switch (t) {
        case WATER: c = shim && ((sh * 7 + fr) & 255) < 2 && (y === 0 || type[i - W] === EMPTY) ? WATER_HI : LUT[16 + (sh & 15)]; break;
        case LAVA: c = LUT[32 + ((shim ? sh + f2 : sh) & 15)]; glowA[grow + (x >> 2)] += 2; break;
        case FIRE: c = LUT[FIRE * 16 + ((sh + (shim ? fr * 5 + x * 3 : 0)) & 15)]; glowA[grow + (x >> 2)] += 2; break;
        case WOOD: {
          const l = life[i];
          if (!l) { c = LUT[48 + (sh & 15)]; break; }
          if (!lab.calm && (fr & 3) === 0) life[i] = l - 1;     // heat is only a look: it fades once the lava stops chewing
          const k = Math.min(1, l / bite) * (shim ? 0.85 + 0.15 * Math.sin(fr * 0.4 + sh) : 1), b = WOOD_BASE[sh & 15];
          c = pack(b[0] + (EMBER[0] - b[0]) * k, b[1] + (EMBER[1] - b[1]) * k, b[2] + (EMBER[2] - b[2]) * k); glowA[grow + (x >> 2)] += 1; break;
        }
        case SMOKE:
          if (aux[i] === EMBER_AUX) { c = EMB[(sh + (shim ? fr * 3 : 0) + (life[i] >> 3)) & 15]; glowA[grow + (x >> 2)] += 1; break; }
          c = LUT[SMOKE * 16 + Math.min(15, life[i] >> 2)]; break;
        case STONE: c = aux[i] ? (aux[i] === FOSSIL ? BONE : ROCK)[Math.max(0, Math.min(ROCK_STEPS - 1, ((y + rockWave[x] + ((sh >> 4) & 3) * 0.5 - 0.75) * ROCK_STEPS / H) | 0)) * 8 + (sh & 7)] : LUT[64 + (sh & 15)]; break;
        case STEM: c = LUT[STEM * 16 + (sh & 7) + (SPECIES[aux[i] >> 3]?.grey ? 8 : 0)]; break;
        case PETAL: c = PET[(aux[i] << 2) | (sh & 3)]; break;
        case BUD: {
          const s = SPECIES[aux[i] >> 3], v = s.variants[aux[i] & 7], k = Math.min(1, (life[i] & 63) / BUD_WAIT);
          const q = v.b || v.a, m = k * 0.9;
          c = pack(TIP_RGB[0] + (q[0] - TIP_RGB[0]) * m, TIP_RGB[1] + (q[1] - TIP_RGB[1]) * m, TIP_RGB[2] + (q[2] - TIP_RGB[2]) * m); break;
        }
        default: c = LUT[t * 16 + (sh & 15)];
      }
      px[i] = c;
    }
  }
  gctx.putImageData(img, 0, 0);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (P.outline) ctx.drawImage(bodyOutline(), 0, 0);
  // floor: one crisp line with hatch ticks below, like Knockout's bench
  const lw = Math.max(1, Math.round(dpr)), tick = Math.round(12 * dpr);
  ctx.fillStyle = rgba(lab.palette.ink, 0.22);
  for (let x = 0; x < canvas.width; x += tick) for (let k = 0; k < Math.round(7 * dpr); k += lw) ctx.fillRect(x - k, floorDev + lw + k, lw, lw);
  ctx.fillStyle = rgba(lab.palette.ink, 0.75);
  ctx.fillRect(0, floorDev, canvas.width, lw);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(gcv, offX, offY, W * cd, H * cd);
  if (fade) {
    ctx.globalAlpha = Math.max(0, 1 - fade.t / FADE);
    ctx.drawImage(fadeCv, offX, offY, W * cd, H * cd);
    ctx.globalAlpha = 1;
  }
  if (P.glow && counts[LAVA] + counts[FIRE] > 0) {
    // glow: lava per 4×4 block, box-blurred, upscaled with smoothing, added on top
    for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) {
      let s = 0;
      for (let dy = -1; dy <= 1; dy++) { const yy = y + dy; if (yy < 0 || yy >= gh) continue; for (let dx = -1; dx <= 1; dx++) { const xx = x + dx; if (xx >= 0 && xx < gw) s += glowA[yy * gw + xx]; } }
      glowB[y * gw + x] = s;
    }
    for (let k = 0; k < gw * gh; k++) gpx[k] = glowB[k] ? pack(GLOW_C[0], GLOW_C[1], GLOW_C[2], Math.min(150, glowB[k] * 1.6)) : 0;
    glowCtx.putImageData(glowImg, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(glowCv, offX, offY, gw * 4 * cd, gh * 4 * cd);
    ctx.globalCompositeOperation = 'source-over';
  }
}

// ---- the drain ----
// Starting over doesn't wipe the box: an unseen drain at the bottom of the basin pulls, and everything in it (lava, wood,
// flowers, smoke, fire, all still looking like themselves) runs out like water, sliding toward the hole. When the
// basin is empty, or after DRAIN_MAX seconds, the mark comes back. Reduced motion just resets.
let drain = null, mouth = null, drainX = 0;
function plugAt() {   // CSS px: centre of the plug on the basin's floor and its width
  const cx = fit.cx + ENC.x * fit.scale, cy = fit.cy + ENC.y * fit.scale, R = (ENC.r + P.ringGap * BAR) * fit.scale;
  return { x: cx, y: Math.min(cy + R, floorDev / dpr), w: 2 * R * Math.sin(DRAIN_DEG / 2 * Math.PI / 180) };
}
function startDrain() {
  if (drain) return;
  if (lab.calm || !built) { reset(); return; }
  const pg = plugAt(), x0 = Math.max(0, Math.floor(((pg.x - pg.w / 2) * dpr - offX) / cd)), x1 = Math.min(W - 1, Math.ceil(((pg.x + pg.w / 2) * dpr - offX) / cd));
  mouth = new Uint8Array(N); drainX = Math.round((pg.x * dpr - offX) / cd);
  // the mouth: the two lowest open cells of each column under the plug
  for (let x = x0; x <= x1; x++) {
    let y = H - 1;
    while (y > 0 && fixedAt(y * W + x)) y--;
    mouth[y * W + x] = 1; if (y > 0) mouth[(y - 1) * W + x] = 1;
  }
  hold.fill(0); paint.on = false; rainT = 0;
  drain = { t: 0 };
}
function drainTick() {
  S = S === 255 ? 1 : S + 1;
  T++;
  let left = 0;
  for (let y = H - 1; y >= 0; y--) {
    const ltr = ((y + T) & 1) === 0, row = y * W;
    for (let k = 0; k < W; k++) {
      const x = ltr ? k : W - 1 - k, i = row + x;
      if (type[i] === EMPTY || stamp[i] === S || fixedAt(i)) continue;
      left++;
      if (mouth[i]) { put(i, EMPTY); continue; }                                    // out it goes
      if (y < H - 1 && type[i + W] === EMPTY) { swap(i, i + W); continue; }
      const dir = x < drainX ? 1 : x > drainX ? -1 : rnd() < 0.5 ? -1 : 1;
      if (y < H - 1) {
        let moved = false;
        for (const d of [dir, -dir]) {
          const nx = x + d;
          if (nx >= 0 && nx < W && type[i + W + d] === EMPTY && type[i + d] === EMPTY) { swap(i, i + W + d); moved = true; break; }
        }
        if (moved) continue;
      }
      if (x !== drainX && type[i + dir] === EMPTY) swap(i, i + dir);                // slide toward the hole
    }
  }
  return left;
}

// ---- reset / loop ----
// engaged: someone is playing with it, so every wait before an auto reset doubles; HAND_IDLE s without input ends it
let quietT = 0, actAvg = 10, sinceInput = 0, runT = 0, acc = 0, built = false, engaged = false, handT = 0, marked = false;   // marked: touched since the last reset
function reset({ crossfade = true } = {}) {
  drain = null;
  if (crossfade && built && !lab.calm) { fadeCtx.clearRect(0, 0, W, H); fadeCtx.drawImage(gcv, 0, 0); fade = { t: 0 }; }
  loops++;
  reseed(P.seed * 1000 + loops);
  fillLogo();
  quietT = 0; actAvg = 10; acc = 0; rainT = 0; sinceInput = 0; runT = 0; marked = false;
  render();
}
function clearAll() { type.fill(EMPTY); hold.fill(0); life.fill(0); aux.fill(0); placeRing(); holdUntil = thawDone = T; quietT = 0; render(); }
function rebuild() { geometry(); allocate(); built = false; reset({ crossfade: false }); built = true; layoutTools(); }
function touch() { quietT = 0; sinceInput = 0; runT = 0; handT = 0; engaged = marked = true; }

// ms of sim per frame at most: past it the sim runs slow for a moment, rather than each frame falling further
// behind on a slow phone (at 11 fps it was doing 6 ticks a frame, which made the next frame slow too)
const TICK_BUDGET = 9;
function frame(dt) {
  if (fade) { fade.t += dt; if (fade.t >= FADE) fade = null; }
  if (lab.calm) return;
  sinceInput += dt; handT = paint.on ? 0 : handT + dt;
  if (fade) return;                                   // the mark holds still while the old box fades out
  if (drain) {
    drain.t += dt;
    acc += dt * 60 * P.speed;
    const n = Math.min(acc | 0, P.speed * 3);
    acc = Math.min(acc - n, P.speed);
    let left = 1;
    const t0 = performance.now();
    for (let k = 0; k < n && left; k++) { left = drainTick(); if (performance.now() - t0 > TICK_BUDGET) { acc = 0; break; } }
    if (!left || drain.t > DRAIN_MAX) { drain = null; reset({ crossfade: !!left }); }
    return;
  }
  if (paint.on) paintLine(paint.x, paint.y, paint.x, paint.y);
  if (rainT > 0) rainT -= dt;
  acc += dt * 60 * P.speed;
  const n = Math.min(acc | 0, P.speed * 3);
  acc = Math.min(acc - n, P.speed);
  act = 0; burning = 0;
  const t0 = performance.now();
  let done = 0;
  while (done < n) { tick(); done++; if (performance.now() - t0 > TICK_BUDGET) { acc = 0; break; } }
  if (done) actAvg = actAvg * 0.92 + (act / done) * 0.08;
  const share = actAvg / N, thawed = T > thawDone;
  quietT = thawed && !paint.on && !burning && share < (quietT > 0 ? BUSY_ACT : QUIET_ACT) ? quietT + dt : 0;
  if (thawed) runT += dt;
  // gone: back to the demo, draining their box first unless a reset already cleared it
  if (engaged && handT > HAND_IDLE) { engaged = false; if (P.autoReset && marked) { startDrain(); return; } }
  const wait = engaged ? 2 : 1;
  if (P.autoReset && (quietT > P.quiet * wait || runT > (RUN_CAP + P.quiet) * wait || sinceInput > IDLE_RESET)) startDrain();
}

// ---- painting ----
const paint = { on: false, x: 0, y: 0, id: null };
function toGrid(e) {
  const r = canvas.getBoundingClientRect();
  return { x: Math.floor(((e.clientX - r.left) * dpr - offX) / cd), y: Math.floor(((e.clientY - r.top) * dpr - offY) / cd) };
}
function paintAt(cx, cy) {
  const r = P.brush, el = tool.el;
  for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
    if (dx * dx + dy * dy > r * r + r) continue;
    const x = cx + dx, y = cy + dy;
    if (x < 0 || y < 0 || x >= W || y >= H) continue;
    const i = y * W + x;
    if (el === EMPTY) { if (!fixedAt(i)) put(i, EMPTY); continue; }
    const t = type[i];
    if (!(t === EMPTY || t === STEAM || t === SMOKE)) continue;
    if (rnd() >= tool.density) continue;
    put(i, el); shade[i] = el === WOOD ? woodShade(x, y) : rnd() * 256 | 0;
  }
}
function paintLine(x0, y0, x1, y1) {
  if (drain) return;
  const n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / Math.max(1, P.brush * 0.6)));
  for (let k = 0; k <= n; k++) paintAt(Math.round(x0 + (x1 - x0) * k / n), Math.round(y0 + (y1 - y0) * k / n));
  touch();
}
canvas.addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  const g = toGrid(e);
  if (fade) fade = null;
  paint.on = true; paint.id = e.pointerId; paint.x = g.x; paint.y = g.y;
  canvas.setPointerCapture(e.pointerId);
  paintLine(g.x, g.y, g.x, g.y);
  if (lab.calm) render();
});
canvas.addEventListener('pointermove', e => {
  if (!paint.on || e.pointerId !== paint.id) return;
  const g = toGrid(e);
  paintLine(paint.x, paint.y, g.x, g.y);
  paint.x = g.x; paint.y = g.y;
  if (lab.calm) render();
});
const stop = e => { if (paint.on && e.pointerId === paint.id) paint.on = false; };
canvas.addEventListener('pointerup', stop);
canvas.addEventListener('pointercancel', stop);
addEventListener('keydown', e => {
  if (e.target.closest?.('input, select, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = +e.key;
  if (k >= 1 && k <= TOOLS.length) { pickTool(TOOLS[k - 1]); touch(); }
  else if (e.key === '[') lab.set('brush', Math.max(1, P.brush - 1));
  else if (e.key === ']') lab.set('brush', Math.min(16, P.brush + 1));
});

// ---- wiring ----
lab.on('change', key => {
  if (key === 'res') rebuild();
  else if (key === 'seed' || key === 'thaw' || key === 'hold') reset();
  else if (key === 'ring' || key === 'ringGap' || key === 'fossils') {
    // swap the old bedrock for the new in place; anything it lands on is simply replaced
    for (let i = 0; i < N; i++) if (fixedAt(i)) { type[i] = EMPTY; aux[i] = 0; }
    fossilCache = null;
    placeRing(); render(); layoutTools();
  }
  touch();
});
lab.on('palette', () => { buildColors(); render(); });
lab.on('resize', () => { if (!built) return; if (geometry()) rebuild(); else render(); layoutTools(); });

buildColors();
rebuild();

let hudTick = 0, ms = 0;
function hud() {
  const c = n => counts[n];
  const flowers = c(ROOT), status = drain ? '<b>draining</b>' : T < holdUntil ? `holding <b>${((holdUntil - T) / NOMINAL_HZ).toFixed(1)} s</b>` : T < thawDone ? '<b>thawing</b>' : quietT > 0.5 ? `settled <b>${quietT.toFixed(1)}/${P.quiet * (engaged ? 2 : 1)} s</b>` : engaged ? 'yours' : 'running';
  lab.hud(`water <b>${c(WATER)}</b> · lava <b>${c(LAVA)}</b> · wood <b>${c(WOOD)}</b> · stone <b>${c(STONE)}</b> · ash <b>${c(ASH)}</b> · steam <b>${c(STEAM)}</b>` +
    ` · flowers <b>${flowers}</b>${c(FIRE) ? ` · fire <b>${c(FIRE)}</b>` : ''}<br>${status} · ${W}×${H} cells · <b>${ms.toFixed(2)} ms</b>`);
}
let paused = false;
lab.loop(dt => {
  if (paused) return;
  const t0 = performance.now();
  frame(dt);
  if (!lab.calm) fr++;
  render();
  ms = ms * 0.9 + (performance.now() - t0) * 0.1;
  if (++hudTick % 8 === 0) hud();
});
hud();

// test hooks: advance and draw without requestAnimationFrame
window.__lab = {
  step(n = 1) { for (let k = 0; k < n; k++) { frame(1 / 60); fr++; } render(); hud(); return this.state(); },
  ticks(n = 1) { for (let k = 0; k < n; k++) tick(); render(); hud(); return this.state(); },
  renderOnce() { render(); hud(); },
  reset: () => reset({ crossfade: false }),
  drain: () => startDrain(), draining: () => !!drain,
  paint(el, x, y, r = P.brush) { const t = TOOLS.find(q => q.key === el) || TOOLS[0]; const prev = tool, pb = P.brush; tool = t; P.brush = r; paintAt(x, y); tool = prev; P.brush = pb; render(); },
  state() {
    const c = {}; const n = new Uint32Array(16); const sp = {};
    for (let i = 0; i < N; i++) { n[type[i]]++; if (type[i] === ROOT) { const nm = SPECIES[aux[i] >> 3].name; sp[nm] = (sp[nm] || 0) + 1; } }
    NAMES.forEach((nm, k) => { if (k && n[k]) c[nm] = n[k]; });
    return { T, W, H, cd, held: T < holdUntil, thawed: T > thawDone, quietT: +quietT.toFixed(2), actAvg: +actAvg.toFixed(2), counts: c, species: sp, ms: +ms.toFixed(2) };
  },
  grid: () => ({ W, H, type, aux, life }),
  gridCanvas: () => gcv,
  pause(on = true) { paused = on; },
  measure(frames = 60) { const t0 = performance.now(); for (let k = 0; k < frames; k++) { frame(1 / 60); fr++; render(); } return (performance.now() - t0) / frames; }
};
</script>
