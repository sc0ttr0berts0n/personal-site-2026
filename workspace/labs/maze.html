<meta charset="utf-8">
<title>Maze</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200;300&family=Familjen+Grotesk:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="shared/lab.css">
<style>.lab-group:has(> .palettes) { display: none; }   /* one fixed look: black, white and red */</style>
<script type="module">
import { createLab } from './shared/lab.js';
import { LOGO_PIECES, fitLogo, logoPath2D, logoPolygons } from './shared/logo.js';
import { mix, hex } from './shared/palettes.js';

const ALGS = {
  backtracker: 'Recursive backtracker',
  prim: 'Prim’s',
  kruskal: 'Kruskal’s',
  wilson: 'Wilson’s'
};
// search speed: expansions per second per search (slider 0 = 60/s, each step doubles)
const RATE = v => 60 * 2 ** v;
const HEURISTICS = { manhattan: 'Manhattan', euclidean: 'Euclidean', none: 'None (Dijkstra)' };

// The maze has one look whatever palette is active: black, white, and one red for highlights. Greys are only white
// thinned over black.
const RED = '#ff5050';
const MONO = { key: 'mono', name: 'Mono', bg: '#000000', grid: '#1a1a1a', ink: '#ffffff', colors: ['#ffffff', RED] };

const lab = createLab({
  number: '07',
  title: 'Maze',
  blurb: 'Each chevron holds its own maze, and A* solves all three at once. Change the heuristic and see how much of each maze it has to explore.',
  teaches: 'Plain Canvas 2D on stacked layers (floor, search, walls, overlay), so only what changes gets redrawn. The maze grid is derived from the logo’s own SVG path data, and A* runs live, step by step, with its heuristic and weight as controls.',
  hint: 'tap a maze to move its start',
  feed: { touch: 'tap', hint: 'tap a maze to move its start' },
  palettes: [MONO],
  defaultPalette: 'mono',
  params: {
    hMaze:      { type: 'heading', label: 'Maze' },
    band:       { type: 'range', label: 'Cells across a band', min: 4, max: 12, step: 1, value: 8 },
    algorithm:  { type: 'select', label: 'Generator', value: 'backtracker', options: Object.entries(ALGS) },
    braid:      { type: 'range', label: 'Braid (dead ends opened)', min: 0, max: 100, step: 5, value: 70, unit: '%' },
    hCarve:     { type: 'heading', label: 'Carving' },
    animateGen: { type: 'toggle', label: 'Animate generation', value: true },
    tilt:       { type: 'range', label: 'Tilt while carving', min: 0, max: 60, step: 1, value: 46, unit: '°', when: P => P.animateGen },
    flatten:    { type: 'range', label: 'Tilt back to flat over', min: 0.5, max: 4, step: 0.1, value: 2, unit: ' s', when: P => P.animateGen && P.tilt > 0 },
    zoom:       { type: 'range', label: 'Zoom while carving', min: 1, max: 2.5, step: 0.05, value: 1.5, unit: '×', when: P => P.animateGen && P.tilt > 0 },
    technical:  { type: 'toggle', label: 'Technical drawing while tilted', value: true, when: P => P.animateGen && P.tilt > 0 },
    depth:      { type: 'range', label: 'Slab depth', min: 0.1, max: 1, step: 0.05, value: 0.5, unit: ' bands', when: P => P.animateGen && P.tilt > 0 },
    explode:    { type: 'range', label: 'Exploded gap', min: 0, max: 4, step: 0.1, value: 2.2, unit: ' bands', when: P => P.animateGen && P.tilt > 0 },
    hSearch:    { type: 'heading', label: 'Search' },
    heuristic:  { type: 'select', label: 'Heuristic h', value: 'manhattan', options: Object.entries(HEURISTICS) },
    weight:     { type: 'range', label: 'Weight w in f = g + w·h', min: 1, max: 5, step: 0.1, value: 1.8, unit: '×', when: P => P.heuristic !== 'none' },
    speed:      { type: 'range', label: 'Search speed', min: 0, max: 9, step: 1, value: 0, format: v => String(RATE(v)), unit: ' expansions/s' },
    explored:   { type: 'toggle', label: 'Show open and closed sets', value: true },
    dead:       { type: 'select', label: 'Dead branches', value: 'pulse', options: [['off', 'Keep their color'], ['ash', 'Wilt to ash'], ['pulse', 'Retract pulse, then ash']] },
    placing:    { type: 'select', label: 'Tap places', value: 'start', options: [['start', 'Start'], ['goal', 'Goal']] },
    hEnd:       { type: 'heading', label: 'When solved' },
    finale:     { type: 'toggle', label: 'Invert when solved', value: false },
    loop:       { type: 'toggle', label: 'Loop: dive into the center mark', value: true },
    look:       { type: 'heading', label: 'Look' },
    border:     { type: 'range', label: 'Outer border width', min: 0.5, max: 8, step: 0.1, value: 4, unit: ' px' },
    wall:       { type: 'range', label: 'Wall width', min: 0.5, max: 4, step: 0.25, value: 2, unit: ' device px' },
    gap:        { type: 'range', label: 'Explored cell gap', min: 0, max: 40, step: 1, value: 0, unit: '%', when: P => P.explored },
    shade:      { type: 'range', label: 'Explored cell opacity', min: 10, max: 100, step: 1, value: 40, unit: '%', when: P => P.explored },
    bead:       { type: 'range', label: 'Frontier bead size', min: 15, max: 90, step: 1, value: 56, unit: '%', when: P => P.explored },
    trail:      { type: 'range', label: 'Path width', min: 0.3, max: 2.5, step: 0.05, value: 0.75, unit: '×' },
    glow:       { type: 'range', label: 'Path glow', min: 0, max: 30, step: 1, value: 15, unit: ' px' },
    marker:     { type: 'range', label: 'Dot and flag size', min: 0.5, max: 2, step: 0.05, value: 1, unit: '×' }
  },
  actions: [
    { label: 'Solve', primary: true, action: () => startSearches('solo', !lab.calm) },
    { label: 'Race Dijkstra vs A*', action: () => startSearches('race', !lab.calm) },
    { label: 'New maze', action: () => { seed++; rebuild(true); } }
  ]
});
const P = lab.params;
let clock = 0;                         // seconds; every animation reads this, never the frame count
// The look sliders are eased: drawing reads LV, which follows P smoothly, so dragging a slider never pops.
const LOOK = ['border', 'wall', 'gap', 'shade', 'bead', 'trail', 'glow', 'marker', 'depth', 'explode'];
const LV = Object.fromEntries(LOOK.map(k => [k, P[k]]));

// ---------------------------------------------------------------- canvas layers
// floor (tinted mark + open cells) → search fills → walls → live overlay
const { canvas, ctx: screen } = lab.canvas();
const layer = () => { const c = document.createElement('canvas'); return { c, x: c.getContext('2d') }; };
const floorL = layer(), wallsL = layer(), searchL = [layer(), layer()], sceneL = layer();
const pieceL = LOGO_PIECES.map(layer);   // one chevron of the scene each, for the exploded view
const spinL = layer();                   // a chevron turned with the spin, ready to warp
const ctx = sceneL.x;                  // the flat scene; present() puts it on screen, tilted while carving

// ---------------------------------------------------------------- the mark's own lattice
// Every straight edge of the mark runs along one of two directions (about ±42.8°, 85.6° apart).
// We read both from the path data and use them as the maze's axes, so cells are near-square rhombi
// and the straight walls of the mark are lattice lines. Coordinates: p = s·A + t·B, in logo units.
const LOGO = logoPath2D();
const PIECE_PATHS = LOGO_PIECES.map(piece => {
  const p = new Path2D();
  for (const { cmd, pts } of piece) {
    if (cmd === 'M') p.moveTo(...pts[0]);
    else if (cmd === 'L') p.lineTo(...pts[0]);
    else if (cmd === 'C') p.bezierCurveTo(...pts[0], ...pts[1], ...pts[2]);
    else p.closePath();
  }
  return p;
});
const probe = document.createElement('canvas').getContext('2d');
const PK = 1000, PO = 1000;            // isPointInPath transforms the path, not the point: scale logo units up
probe.setTransform(PK, 0, 0, PK, PO, PO);
const inPiece = (k, x, y) => probe.isPointInPath(PIECE_PATHS[k], x * PK + PO, y * PK + PO);

const MARK = (() => {
  const edges = [], curves = [];
  LOGO_PIECES.forEach((piece, k) => {
    let cur = null, start = null;
    for (const { cmd, pts } of piece) {
      if (cmd === 'M') cur = start = pts[0];
      else if (cmd === 'L') { edges.push({ k, p: cur, q: pts[0] }); cur = pts[0]; }
      else if (cmd === 'C') { curves.push({ k, p: cur, q: pts[2] }); cur = pts[2]; }
      else if (cmd === 'Z') { if (Math.hypot(cur[0] - start[0], cur[1] - start[1]) > 1e-9) edges.push({ k, p: cur, q: start }); cur = start; }
    }
  });
  // two direction families, each axis the length-weighted mean of its edges
  const ang = e => { let a = Math.atan2(e.q[1] - e.p[1], e.q[0] - e.p[0]); return a < 0 ? a + Math.PI : a; };
  const ref = ang(edges[0]);
  const near = a => Math.min(Math.abs(a - ref), Math.PI - Math.abs(a - ref)) < 0.35;
  const sum = [[0, 0], [0, 0]];
  for (const e of edges) {
    e.fam = near(ang(e)) ? 0 : 1;
    let dx = e.q[0] - e.p[0], dy = e.q[1] - e.p[1];
    if (dx < 0) { dx = -dx; dy = -dy; }
    sum[e.fam][0] += dx; sum[e.fam][1] += dy;
  }
  let [A, B] = sum.map(([x, y]) => { const l = Math.hypot(x, y); return [x / l, y / l]; });
  if (A[1] > B[1]) { [A, B] = [B, A]; for (const e of edges) e.fam ^= 1; }   // A runs up-right, B down-right
  const det = A[0] * B[1] - A[1] * B[0];
  const toST = (x, y) => [(x * B[1] - y * B[0]) / det, (A[0] * y - A[1] * x) / det];
  const toXY = (s, t) => [s * A[0] + t * B[0], s * A[1] + t * B[1]];

  // an edge along A has constant t; an edge along B has constant s
  const pieces = LOGO_PIECES.map((_, k) => ({ k, s: [], t: [], segs: [], tips: [] }));
  for (const e of edges) {
    const a = toST(...e.p), b = toST(...e.q), pc = pieces[e.k];
    if (e.fam === 0) { pc.t.push((a[1] + b[1]) / 2); pc.segs.push({ fam: 0, v: (a[1] + b[1]) / 2, lo: Math.min(a[0], b[0]), hi: Math.max(a[0], b[0]) }); }
    else { pc.s.push((a[0] + b[0]) / 2); pc.segs.push({ fam: 1, v: (a[0] + b[0]) / 2, lo: Math.min(a[1], b[1]), hi: Math.max(a[1], b[1]) }); }
  }
  for (const c of curves) pieces[c.k].tips.push(toST(...c.p), toST(...c.q));
  const dedupe = v => v.sort((a, b) => a - b).filter((x, i, a) => i === 0 || x - a[i - 1] > 1e-5);
  let W = Infinity;
  for (const pc of pieces) {
    pc.s = dedupe(pc.s); pc.t = dedupe(pc.t);
    for (const v of [pc.s, pc.t]) for (let i = 1; i < v.length; i++) W = Math.min(W, v[i] - v[i - 1]);
  }
  // caps: short straight edges (collinear pieces merged) at the far ends of each band
  for (const pc of pieces) {
    const groups = new Map();
    for (const g of pc.segs) {
      const key = g.fam + ':' + Math.round(g.v * 1e4);
      const m = groups.get(key);
      if (m) { m.lo = Math.min(m.lo, g.lo); m.hi = Math.max(m.hi, g.hi); } else groups.set(key, { ...g });
    }
    pc.caps = [...groups.values()].filter(g => g.hi - g.lo < 1.5 * W).map(g => {
      const mid = (g.lo + g.hi) / 2;
      return g.fam === 0 ? toXY(mid, g.v) : toXY(g.v, mid);
    }).sort((a, b) => a[1] - b[1]);              // upper cap first
  }
  // names by horizontal position
  const cxOf = pc => { const xs = LOGO_PIECES[pc.k].flatMap(s => s.pts.map(p => p[0])); return (Math.min(...xs) + Math.max(...xs)) / 2; };
  [...pieces].sort((a, b) => cxOf(a) - cxOf(b)).forEach((pc, i) => { pc.name = ['left', 'middle', 'right'][i]; });
  return { A, B, toST, toXY, W, pieces, apexDeg: Math.acos(A[0] * B[0] + A[1] * B[1]) * 180 / Math.PI };
})();

const DI = [1, 0, -1, 0], DJ = [0, 1, 0, -1];   // +s, +t, −s, −t → bits 1, 2, 4, 8

// The centre of the middle maze holds the next maze, drawn small (the loop dives into it). Its bands are exactly one
// cell of this lattice wide, so the small mark's outline runs along this maze's walls. The real gaps between the
// chevrons are narrower than a cell, so in the small copy each outer chevron is pushed out along the lattice diagonal
// to sit one cell from the middle one; they click back together during the dive. The cells it covers become an island
// the maze runs around; the gaps between the small chevrons stay corridors of this maze. Placed as near the mark's
// centre as it fits with every remaining cell of the middle maze still connected. Returns the island, a plate path
// over it, where the small mark's origin sits (logo units), its scale, and each chevron's push (in its own logo units);
// null when the bands are too few cells across for it to fit.
function placeMini(g, cellPiece, K) {
  const W = MARK.W, m = 1 / K;                           // one band of the small mark = W / K = one cell here
  const mid = MARK.pieces.find(pc => pc.name === 'middle'), side = MARK.pieces.filter(pc => pc !== mid);
  let gap = Infinity;                                    // the real gap between neighbouring chevrons, logo units
  for (const pc of side) for (const ax of ['s', 't']) for (const u of pc[ax]) for (const v of mid[ax]) {
    const d = Math.abs(v - u);
    if (d > 1e-6 && d < W * 0.9) gap = Math.min(gap, d);
  }
  const push = W - gap, shift = [];
  for (const pc of MARK.pieces) shift[pc.k] = MARK.toXY((order(pc.k) - 1) * push, (order(pc.k) - 1) * push);
  const own = (i, j) => i >= 0 && j >= 0 && i < g.nS && j < g.nT && cellPiece[g.off + j * g.nS + i] === g.k;
  const total = [];
  for (let j = 0; j < g.nT; j++) for (let i = 0; i < g.nS; i++) if (own(i, j)) total.push(g.off + j * g.nS + i);
  const s0 = mid.s[1], t0 = mid.t[0];                    // the small middle chevron's band edges, pinned to lattice lines
  const cands = [];
  for (let b = 0; b <= g.nT; b++) for (let a = 0; a <= g.nS; a++) {
    const cs = g.S[a] - m * s0, ct = g.T[b] - m * t0, [cx, cy] = MARK.toXY(cs, ct);
    cands.push({ a, b, cx, cy, d: cx * cx + cy * cy });
  }
  cands.sort((p, q) => p.d - q.d);
  const inMini = (x, y, c) => MARK.pieces.some(pc => inPiece(pc.k, (x - c.cx) / m - shift[pc.k][0], (y - c.cy) / m - shift[pc.k][1]));
  // the small mark is about 6 by 8 cells: on a lattice this coarse it cannot fit inside a band
  if (K < 7) return null;
  // cheap first test: the cells down the middle of each small chevron's long band must all be this maze's
  const spine = c => [[0, 0, 4], [-2, -2, 4], [2, 2, 4]].every(([di, dj, n]) => { for (let q = 0; q < n; q++) if (!own(c.a + di, c.b + dj + q)) return false; return true; });
  for (const c of cands.slice(0, 600)) {
    if (!spine(c)) continue;
    const island = new Set();
    let ok = true;
    for (let j = c.b - 6; ok && j <= c.b + 10; j++) for (let i = c.a - 8; ok && i <= c.a + 8; i++) {
      if (i < 0 || j < 0 || i >= g.nS || j >= g.nT) continue;
      let hit = false;
      for (const fs of [0.15, 0.5, 0.85]) for (const ft of [0.15, 0.5, 0.85]) {
        if (hit) break;
        const [x, y] = MARK.toXY(g.S[i] + (g.S[i + 1] - g.S[i]) * fs, g.T[j] + (g.T[j + 1] - g.T[j]) * ft);
        hit = inMini(x, y, c);
      }
      if (!hit) continue;
      if (!own(i, j)) ok = false;
      island.add(g.off + j * g.nS + i);
    }
    if (!ok || !island.size) continue;
    // the rest of the middle maze, corridors between the small chevrons included, must stay one piece
    const rest = total.filter(x => !island.has(x)), seen = new Set([rest[0]]), queue = [rest[0]];
    while (queue.length) {
      const x = queue.pop(), i = (x - g.off) % g.nS, j = Math.floor((x - g.off) / g.nS);
      for (let d = 0; d < 4; d++) {
        const ni = i + DI[d], nj = j + DJ[d], n = g.off + nj * g.nS + ni;
        if (own(ni, nj) && !island.has(n) && !seen.has(n)) { seen.add(n); queue.push(n); }
      }
    }
    if (seen.size !== rest.length) continue;
    const plate = new Path2D();
    for (const x of island) {
      const i = (x - g.off) % g.nS, j = Math.floor((x - g.off) / g.nS);
      [[0, 0], [1, 0], [1, 1], [0, 1]].forEach(([u, v], n) => plate[n ? 'lineTo' : 'moveTo'](...MARK.toXY(g.S[i + u], g.T[j + v])));
      plate.closePath();
    }
    return { island: [...island], k: g.k, plate, x: c.cx, y: c.cy, m, shift };
  }
  return null;
}
const gridCache = new Map();

// K cells across every band. Between consecutive edge lines the span is split into a whole number of
// cells of about W/K each, so every straight edge of the mark lands exactly on a lattice line.
function buildGrid(K) {
  if (gridCache.has(K)) return gridCache.get(K);
  const pitch = MARK.W / K;
  const split = vals => {
    const out = [vals[0]];
    for (let i = 1; i < vals.length; i++) {
      const a = vals[i - 1], b = vals[i], n = Math.max(1, Math.round((b - a) / pitch));
      for (let k = 1; k <= n; k++) out.push(a + (b - a) * k / n);
    }
    return out;
  };
  const pieces = [];
  let T = 0;
  for (const pc of MARK.pieces) {
    const S = split(pc.s), Tl = split(pc.t);
    pieces.push({ k: pc.k, name: pc.name, S, T: Tl, nS: S.length - 1, nT: Tl.length - 1, off: T });
    T += (S.length - 1) * (Tl.length - 1);
  }
  const cellPiece = new Int8Array(T).fill(-1), ci = new Int32Array(T), cj = new Int32Array(T);
  const ccx = new Float64Array(T), ccy = new Float64Array(T);     // centers, logo units
  for (const g of pieces) {
    const tips = MARK.pieces[g.k].tips;
    for (let j = 0; j < g.nT; j++) for (let i = 0; i < g.nS; i++) {
      const c = g.off + j * g.nS + i;
      ci[c] = i; cj[c] = j;
      const s0 = g.S[i], s1 = g.S[i + 1], t0 = g.T[j], t1 = g.T[j + 1];
      const sm = (s0 + s1) / 2, tm = (t0 + t1) / 2;
      [ccx[c], ccy[c]] = MARK.toXY(sm, tm);
      if (!inPiece(g.k, ccx[c], ccy[c])) continue;
      // near a rounded tip the whole cell must be inside: test corners, edge midpoints, center
      let ok = true;
      if (tips.some(([ts, tt]) => Math.hypot(ts - sm, tt - tm) < 2.5 * pitch)) {
        for (const fs of [0.02, 0.5, 0.98]) for (const ft of [0.02, 0.5, 0.98]) {
          if (!ok) break;
          const [x, y] = MARK.toXY(s0 + (s1 - s0) * fs, t0 + (t1 - t0) * ft);
          if (!inPiece(g.k, x, y)) ok = false;
        }
      }
      if (ok) cellPiece[c] = g.k;
    }
  }
  const mini = placeMini(pieces.find(g => g.name === 'middle'), cellPiece, K);
  if (mini) for (const c of mini.island) cellPiece[c] = -1;
  const nbr = new Int32Array(T * 4).fill(-1);
  const cellsOf = g => { const out = []; for (let c = g.off; c < g.off + g.nS * g.nT; c++) if (cellPiece[c] >= 0) out.push(c); return out; };
  for (const g of pieces) for (const c of cellsOf(g)) for (let d = 0; d < 4; d++) {
    const i = ci[c] + DI[d], j = cj[c] + DJ[d];
    if (i < 0 || j < 0 || i >= g.nS || j >= g.nT) continue;
    const n = g.off + j * g.nS + i;
    if (cellPiece[n] >= 0) nbr[c * 4 + d] = n;
  }
  // keep the largest connected part of each chevron (a clipped tip could strand a cell)
  for (const g of pieces) {
    const seen = new Uint8Array(T);
    let best = [];
    for (const c0 of cellsOf(g)) {
      if (seen[c0]) continue;
      const list = [c0]; seen[c0] = 1;
      for (let q = 0; q < list.length; q++) for (let d = 0; d < 4; d++) {
        const n = nbr[list[q] * 4 + d];
        if (n >= 0 && !seen[n]) { seen[n] = 1; list.push(n); }
      }
      if (list.length > best.length) best = list;
    }
    const keep = new Set(best);
    for (const c of cellsOf(g)) if (!keep.has(c)) { cellPiece[c] = -1; for (let d = 0; d < 4; d++) nbr[c * 4 + d] = -1; }
    for (const c of best) for (let d = 0; d < 4; d++) { const n = nbr[c * 4 + d]; if (n >= 0 && cellPiece[n] < 0) nbr[c * 4 + d] = -1; }
    g.cells = Int32Array.from(best).sort();
  }
  const regions = pieces.map(g => g.cells);
  const cells = Int32Array.from(regions.flatMap(r => [...r])).sort();
  const grid = { K, pitch, T, mini, pieces, byK: Object.fromEntries(pieces.map(g => [g.k, g])), cellPiece, ci, cj, ccx, ccy, nbr, regions, cells };
  gridCache.set(K, grid);
  return grid;
}

// ---------------------------------------------------------------- seeded randomness
let seed = 1;
function mulberry(a) {
  return () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffle(arr, rng) {
  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  return arr;
}

// ---------------------------------------------------------------- maze generation
let G = null, pass = null, treePass = null, gen = null, built = {};
let born = new Float64Array(0), carveOrder = [];   // when each cell was first carved, for the carve-in fade

function carve(a, b) {
  if (born[a] < 0) { born[a] = clock; carveOrder.push(a); }
  if (born[b] < 0) { born[b] = clock; carveOrder.push(b); }
  for (let d = 0; d < 4; d++) if (G.nbr[a * 4 + d] === b) { pass[a] |= 1 << d; pass[b] |= 1 << ((d + 2) & 3); return; }

// ---------------------------------------------------------------- ghosts (cross-fades)
// A ghost is a snapshot of what was on screen, faded out over the new state, so a change never pops.
const ghostCanvas = () => { const c = document.createElement('canvas'); c.width = canvas.width; c.height = canvas.height; return c; };

function ghostFrame(dur) {

  ghost = { c, t0: clock, dur };
}

// ---------------------------------------------------------------- trails and markers
function trailPath(x, tr, upTo) {
  const pts = tr.pts;
  x.beginPath();

  for (let i = 1; i < pts.length && tr.cum[i] <= upTo; i++) x.lineTo(dx(pts[i][0]), dy(pts[i][1]));
  const [ex, ey] = pointAt(tr, upTo);

}
function drawTrails(x) {
  const thick = Math.max(2 * geo.dpr, geo.cell * 0.34) * LV.trail * (1 + 0.7 * finAmt()), race = runKind === 'race';
  x.lineJoin = 'round'; x.lineCap = 'round';

    trailPath(x, tr, d);

    x.strokeStyle = race ? C.race[tr.slot] : RED;          // the solved path is red
    if (!race && LV.glow > 0.05) { x.shadowColor = C.glow; x.shadowBlur = LV.glow * geo.dpr; }
    // landed: the line swells as a bright pulse runs along it, start to goal

    if (cel > 0 && cel < 1) x.lineWidth *= 1 + 0.45 * Math.sin(Math.PI * cel);

}
const glyph = () => Math.max(4.5 * geo.dpr, geo.cell * 0.7) * LV.marker;   // base unit for marker sizes

// r plays the part a circle's radius did: the long half-diagonal is a touch longer, the area about the same.
const DQ = 1.15 / Math.max(Math.hypot(MARK.A[0] + MARK.B[0], MARK.A[1] + MARK.B[1]), Math.hypot(MARK.A[0] - MARK.B[0], MARK.A[1] - MARK.B[1]));

// drop-on offset (device px, upward) and alpha for a marker at this moment
function appear(m) {

  if (m.dropAt == null) return { off: 0, a: 1 };

function drawFlag(x, k) {

// ---------------------------------------------------------------- the finale
// The moment the last path lands, the stage inverts: three diamonds, cut along the lattice like the markers, open
// from the three goals and every pixel inside them flips (a 'difference' fill of white over the opaque frame), so
// there is never a grey halfway frame, only a hard edge sweeping out. The snap takes T_SNAP with an ease-out; the
// inverted view holds until the next solve or maze, then the diamonds close back into the goals. Under reduced
// motion it never fires.
const T_SNAP = 0.32, T_UNSNAP = 0.45;

function finAmt() {

  return fin.from + (fin.to - fin.from) * (fin.to > fin.from ? easeOut(u) : easeInOut(u));
}
function snap(to, at = clock) {
  if (fin.to === to) return;
  const from = finAmt();
  if (to) fin.at = MARK.pieces.map(pc => cellXYl(endCells[pc.k].goal));

function applyInvert() {

    hudInv = on;

// ---------------------------------------------------------------- the loop
// After the reveal has held a beat, the camera dives into the small mark until it is exactly the size and place of
// the whole mark. The zoom is exponential (even speed through scales). On the way the small chevrons click together in
// turn from their one-cell spacing to the mark's own. The white flood (the old frame, magnified) has cleared to black
// before they move, and the black mark's outline takes the ink as it goes. The mark is drawn as vectors
// throughout and lands as exactly the first frame of a new maze, which then carves as usual: the lean back into the
// technical drawing, the carve, the pan up, the search.

function presentDive() {
  const x = screen, mn = G.mini, u = easeInOut((clock - dive.t0) / T_DIVE), Z = 1 / mn.m, z = Z ** u, w = (z - 1) / (Z - 1);
  const X = dx(mn.x), Y = dy(mn.y), ox = X + (dx(0) - X) * w, oy = Y + (dy(0) - Y) * w, kp = geo.dpr * geo.f.scale * z;

  x.globalAlpha = 1 - wf;

  x.setTransform(z, 0, 0, z, X * (1 - z) + (dx(0) - X) * w, Y * (1 - z) + (dy(0) - Y) * w);
  x.drawImage(sceneL.c, 0, 0);
  // the vector mark sits exactly over the magnified one; its outline takes the ink as the white goes
  const tc = easeInOut((u - 0.45) / 0.45);
  x.globalAlpha = 1;
  const col = { tint: mix('#000000', C.tint, tc), floor: mix('#000000', C.bg, tc), line: mix('#000000', C.ink, wf) };

  const shift = MARK.pieces.map(pc => {
    const o = order(pc.k), e = o === 1 ? 1 : easeOutBack((u - (o === 0 ? 0.25 : 0.4)) / 0.28);

    return;

    group.dived = true;
    snap(0);
    // too few cells across a band for the mark to fit at the centre: just build the next one
    if (!G.mini) { seed++; rebuild(P.animateGen); return; }

// ---------------------------------------------------------------- frame
let exploredA = 1, clean = 0;   // clean: 0 while working, 1 once solved (only the path remains)
function render() {
  if (!geo) return;
  if (dirty.floor) { drawFloor(); dirty.floor = false; }
  if (dirty.walls || gen || clock < wallsLiveUntil + 0.05) { drawWalls(); dirty.walls = false; }
  if (wallFade && clock - wallFade.t0 > wallFade.dur) { wallFade = null; drawWalls(); }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(floorL.c, 0, 0);
  // freshly carved cells glow briefly in the accent ramp
  if (carvePtr < carveOrder.length) {
    while (carvePtr < carveOrder.length && clock - born[carveOrder[carvePtr]] >= T_CARVE) carvePtr++;
    const groups = new Map();
    for (let i = carvePtr; i < carveOrder.length; i++) {

    if (e >= 1) searchGhost = null;
    else { ctx.globalAlpha = 1 - easeOut(e); ctx.drawImage(searchGhost.c, 0, 0); ctx.globalAlpha = 1; }
  }

    ctx.globalAlpha = exploredA;
    ctx.drawImage(searchL[0].c, 0, 0);
    if (runKind === 'race') ctx.drawImage(searchL[1].c, 0, 0);
    ctx.globalAlpha = 1;

    if (exploredA < 0.999) { const t = ghostCanvas(); drawSearchLive(t.getContext('2d')); ctx.globalAlpha = exploredA; ctx.drawImage(t, 0, 0); ctx.globalAlpha = 1; }
    else drawSearchLive(ctx);

  drawWallFade(ctx);

  for (const pc of MARK.pieces) { drawFlag(ctx, pc.k); drawDot(ctx, pc.k); }

}

// ---------------------------------------------------------------- HUD
const n0 = v => v.toLocaleString('en-US');
const sw = c => `<i style="display:inline-block;width:8px;height:8px;margin-right:6px;background:${c}"></i>`;
const nameOf = k => MARK.pieces[k].name;
function verdict(list) {
  if (list.some(s => !s.done)) return 'searching';
  const off = list.filter(s => !(s.cost <= optimum[s.piece].cost + 1e-9));
  const head = `<b>${list.length - off.length}/${list.length} optimal</b>`;
  return off.length ? head + ' · ' + off.map(s => isFinite(s.cost) ? `${nameOf(s.piece)} <b>+${((s.cost - optimum[s.piece].cost) / optimum[s.piece].cost * 100).toFixed(1)}%</b>` : `${nameOf(s.piece)} no path`).join(' · ') : head;
}
const total = (list, key) => list.reduce((a, s) => a + s[key], 0);

function hud() {
  if (!G) return;
  const maze = `${ALGS[built.alg]} · ${G.K} cells across a band${built.capped ? ' (capped by screen)' : ''} · 3 mazes, ${n0(G.cells.length)} cells · braid ${P.braid}%`;
  if (gen) { lab.hud(`${maze}<br>generating · carved <b>${n0(gen.carved)}</b> of ${n0(gen.total)}`); return; }
  const l = allSearches();
  if (!l.length) return;
  const dij = MARK.pieces.reduce((a, p) => a + (optimum[p.k] ? optimum[p.k].expanded : 0), 0);
  if (runKind === 'solo') {
    lab.hud(`${maze}<br>${l[0].label} · expanded <b>${n0(total(l, 'expanded'))}</b>${l[0].heuristic !== 'none' ? ` (Dijkstra ${n0(dij)})` : ''} · frontier <b>${n0(total(l, 'open'))}</b> · paths <b>${paths(l)}</b> · ${verdict(l)}`);
  } else {
    const d = l.filter(s => s.slot === 0), a = l.filter(s => s.slot === 1);
    const de = total(d, 'expanded'), ae = total(a, 'expanded');
    const saved = d.every(s => s.done) && a.every(s => s.done) ? ` · A* expanded <b>${Math.round((1 - ae / de) * 100)}%</b> fewer` : '';
    lab.hud(`${maze}<br>${sw(C.race[0])}Dijkstra <b>${n0(de)}</b> expanded · paths <b>${paths(d)}</b><br>${sw(C.race[1])}${a[0].label} <b>${n0(ae)}</b> expanded · paths <b>${paths(a)}</b> · ${verdict(a)}${saved}`);
  }
}

// ---------------------------------------------------------------- updates
let carvePtr = 0;
const dirty = { floor: true, walls: true, rebuild: false, braid: false, solve: false, geo: false };
lab.on('change', key => {
  if (key === 'band' || key === 'algorithm') dirty.rebuild = true;
  else if (key === 'braid') dirty.braid = true;
  else if (key === 'heuristic' || key === 'weight') dirty.solve = true;
  else if (key === 'placing') setHint();
  else if (key === 'finale' && !P.finale) snap(0);
  else if (key === 'tilt' && gen && !lab.calm) tiltTo(P.tilt, 0.3);   // live while carving; otherwise next maze
  else if (key === 'dead' && G && geo) { ghostFrame(0.3); clearSearchLayers(); for (const s of allSearches()) repaintBaked(s); }
});
// palette: the old frame cross-fades into the new colours (a per-pixel lerp)
lab.on('palette', p => {
  if (geo && G) ghostFrame(lab.calm ? T_FADE : 0.4);
  makeColors(p); dirty.floor = dirty.walls = true; hudInv = null;
  if (G && geo) { clearSearchLayers(); for (const s of allSearches()) repaintBaked(s); }
});
lab.on('resize', () => { dirty.geo = true; });

function processDirty() {
  if (dirty.geo) {
    dirty.geo = false;
    if (G && effectiveK() !== G.K) dirty.rebuild = true;
    else if (G) { layoutGeo(); dirty.floor = dirty.walls = true; clearSearchLayers(); for (const s of allSearches()) repaintBaked(s); }
  }
  if (dirty.rebuild) {
    dirty.rebuild = false; dirty.braid = dirty.solve = false;
    if (!G || effectiveK() !== built.K || P.algorithm !== built.alg) rebuild(P.animateGen);
  }
  if (dirty.braid) {
    dirty.braid = dirty.solve = false;
    if (!gen && P.braid !== built.braid) { applyBraid(); startSearches(runKind, !lab.calm); }
  }
  if (dirty.solve) {
    dirty.solve = false;
    const l = allSearches(), s = l[l.length - 1];
    const h = runKind === 'race' && P.heuristic === 'none' ? 'manhattan' : P.heuristic;
    if (!gen && (!s || s.heuristic !== h || s.w !== P.weight)) startSearches(runKind, !lab.calm);
  }
}

function update(dt) {
  clock += dt;
  processDirty();
  if (!gen) stepLoop();
  // the technical drawing takes over the border as it comes in
  const tn = techAmt();
  techNow = Math.abs(tn) < 1e-4 ? 0 : tn;
  if (gen) {
    // carve at a steady rate per second; the carve-in fade smooths whatever lands in one frame
    gen.acc += dt * gen.total / T_GEN;
    const budget = Math.floor(gen.acc), t0 = performance.now();
    gen.acc -= budget;
    let carved = 0, k = 0;
    while (carved < budget) {
      const r = gen.it.next();
      if (r.done) { gen.it = [][Symbol.iterator](); finishGen(true); break; }
      carved += r.value; gen.carved += r.value;
      if ((++k & 255) === 0 && performance.now() - t0 > 8) break;
    }
  } else {
    const rate = RATE(P.speed);
    if (group && group.sync && !group.fired && rate !== group.rate) resync(group);
    for (const r of runs) if (r) {
      if (clock < r.searchAt) continue;
      for (const s of r.searches) {
        if (s.done) { addTraveller(r, s, true); continue; }
        s.acc = Math.min(s.acc + dt * rate, rate * 0.1 + 1);
        let n = Math.floor(s.acc);
        s.acc -= n;
        while (n-- > 0 && !s.done) s.step();
        if (s.done) addTraveller(r, s, true);
      }
    }
    // the finish: every search in the group done and every path landed
    if (group && !group.fired) {
      const rs = group.ks.map(k => runs[k]);
      if (rs.every(r => r.searches.every(s => s.done && (!s.path || r.trav.some(t => t.s === s))))) {
        const end = Math.max(group.sync ? group.end : 0, ...rs.flatMap(r => r.trav.map(arrivedAt)));
        if (clock >= end) { group.fired = true; group.at = end; if (P.finale && !lab.calm) snap(1, end); }
      }
    }
    settleSearches();
    const busy = runs.some(r => r && (r.searches.some(s => !s.done) || r.trav.some(t => clock < arrivedAt(t) + T_CELEBRATE)));
    mode = busy ? 'search' : 'idle';
  }
  // once every maze is solved and the dots are home, the scaffolding clears away and only the path line stays
  const solved = mode === 'idle' && !gen && runs.some(Boolean);
  clean += ((solved ? 1 : 0) - clean) * (lab.calm ? 1 : 1 - Math.exp(-dt / (solved ? 0.35 : 0.1)));
  if (Math.abs((solved ? 1 : 0) - clean) < 0.002) clean = solved ? 1 : 0;
  const target = P.explored ? 1 - clean : 0;
  exploredA += (target - exploredA) * (1 - Math.exp(-dt / (solved ? 0.35 : 0.08)));
  if (Math.abs(target - exploredA) < 0.002) exploredA = target;
  // look sliders ease toward their values; the cached layers they affect are redrawn while they move
  let repaint = false;
  for (const k of LOOK) {
    const t = P[k], v = LV[k];
    if (v === t) continue;
    const nv = lab.calm ? t : v + (t - v) * (1 - Math.exp(-dt / 0.09));
    LV[k] = Math.abs(t - nv) < Math.abs(t) * 1e-3 + 1e-3 ? t : nv;
    if (k === 'wall' || k === 'border') dirty.walls = true;
    if (k === 'gap' || k === 'shade') repaint = true;
  }
  if (repaint && G && geo) { makeColors(lab.palette); clearSearchLayers(); for (const s of allSearches()) repaintBaked(s); }
}

// ---------------------------------------------------------------- pointer
function setHint() {
  const el = document.querySelector('.lab-hint');
  const other = P.placing === 'goal' ? 'start' : 'goal';
  if (el) el.textContent = `tap a maze to move its ${P.placing === 'goal' ? 'flag' : 'dot'}` + (matchMedia('(hover: hover)').matches ? ` · shift-click moves the ${other === 'goal' ? 'flag' : 'dot'}` : '');
}
const toLogo = e => {
  const r = canvas.getBoundingClientRect(), f = fitLogo(lab.square()), sx = e.clientX - r.left, sy = e.clientY - r.top;
  const at = h => { const [px, py] = unproject(sx, sy, h); return { x: (px - f.cx) / f.scale, y: (py - f.cy) / f.scale }; };   // taps land on the right cell even mid-tilt
  // exploded, each slab sits at its own height: the highest one under the pointer wins
  const { levels } = slabs(techAmt());
  for (const pc of [...MARK.pieces].sort((p, q) => order(q.k) - order(p.k))) {
    const p = at(levels[pc.k]), c = G ? cellAt(p.x, p.y) : -1;
    if (c >= 0 && G.cellPiece[c] === pc.k) return p;
  }
  return at(0);
};
let drag = null;
// moves the start or goal of whichever maze was hit; taps outside the cells are ignored
function place(e, which) {
  if (!G || gen) return -1;
  const p = toLogo(e), c = cellAt(p.x, p.y);
  if (c < 0) return -1;
  const k = G.cellPiece[c];
  if (drag && drag.piece >= 0 && drag.piece !== k) return -1;     // a drag stays in its own maze
  if (endCells[k][which] === c) return -1;
  ends[k][which] = { x: G.ccx[c], y: G.ccy[c] };
  endCells[k][which] = c;
  return k;
}
canvas.addEventListener('pointerdown', e => {
  if (dive) return;
  drag = { which: (P.placing === 'goal') !== e.shiftKey ? 'goal' : 'start', id: e.pointerId, piece: -1 };
  const k = place(e, drag.which);
  if (k >= 0) { drag.piece = k; startSearches(runKind, !lab.calm, [k]); }
});
canvas.addEventListener('pointermove', e => {
  if (!drag || drag.id !== e.pointerId || !(e.buttons & 1)) return;
  const k = place(e, drag.which);
  if (k >= 0) { drag.piece = k; startSearches(runKind, false, [k]); }   // dragging: solve instantly so the path follows
});
const endDrag = () => { drag = null; };
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

// ---------------------------------------------------------------- boot
G = buildGrid(effectiveK());
layoutGeo();
rebuild(P.animateGen);
setHint();

let tick = 0;
lab.loop(dt => {
  update(dt);
  render();
  if (++tick % 6 === 0 || mode === 'idle' && tick % 30 === 0) hud();
});

// test hooks: the pane may be hidden (rAF paused), so let tooling drive time directly
let prevSample = null;
window.__lab = {
  step(n = 1, dt = 1 / 60) { for (let k = 0; k < n; k++) update(dt); render(); hud(); return this.info(); },
  // advance n frames, rendering each, and return a cheap fingerprint of every frame (for flicker checks)
  // advance n frames, rendering each; per frame returns mean brightness and the share of sampled pixels
  // that jumped by more than `jump` (sum of RGB) since the previous frame. A pop shows up as a spike.
  frames(n = 1, dt = 1 / 60, sample = 6, jump = 120) {
    const out = [], w = canvas.width, h = canvas.height;
    for (let k = 0; k < n; k++) {
      update(dt); render();
      const d = screen.getImageData(0, 0, w, h).data, cur = [];
      let sum = 0, big = 0;
      for (let y = 0; y < h; y += sample) for (let x = 0; x < w; x += sample) { const i = (y * w + x) * 4, v = d[i] + d[i + 1] + d[i + 2]; cur.push(v); sum += v; }
      if (prevSample && prevSample.length === cur.length) for (let i = 0; i < cur.length; i++) if (Math.abs(cur[i] - prevSample[i]) > jump) big++;
      prevSample = cur;
      out.push([+(sum / cur.length).toFixed(2), +(big / cur.length * 1000).toFixed(2)]);
    }
    hud();
    return out;
  },
  renderOnce() { processDirty(); render(); hud(); return this.info(); },
  info: () => ({
    K: G.K, cells: G.cells.length, clock: +clock.toFixed(3),
    mode, runKind, generating: !!gen, seed, tilt: +tiltDeg().toFixed(2), spinDeg: +(spinNow() * 180 / Math.PI).toFixed(1), ends: endCells.map(e => ({ ...e })), apexDeg: +MARK.apexDeg.toFixed(3), W: MARK.W,
    searches: allSearches().map(s => ({ maze: nameOf(s.piece), label: s.label, expanded: s.expanded, open: s.open, cost: s.cost, done: s.done })),
    travellers: runs.filter(Boolean).flatMap(r => r.trav.map(t => ({ maze: nameOf(r.k), moving: t.moving, progress: +travProgress(t).toFixed(3), t0: +t.t0.toFixed(4), arrive: +arrivedAt(t).toFixed(4) }))),
    sync: group && { end: +group.end.toFixed(4), fired: group.fired }, dive: dive && +(clock - dive.t0).toFixed(3), mini: G.mini && { n: G.mini.island.length, x: +G.mini.x.toFixed(4), y: +G.mini.y.toFixed(4), m: +G.mini.m.toFixed(4) }, invert: +finAmt().toFixed(3), tech: +techAmt().toFixed(3),
    optimum: optimum.map(o => o && o.cost)
  }),
  // instant regenerate (no animation) for checks
  regen({ seed: sd = seed, algorithm = P.algorithm, braid = P.braid } = {}) {
    seed = sd; P.algorithm = algorithm; P.braid = braid; rebuild(false); render(); return this.info();
  },
  solve(start, goal, heuristic = 'manhattan', w = 1) {
    const s = runToEnd(makeSearch(start, goal, heuristic, w, -1));
    return { cost: s.cost, expanded: s.expanded, path: s.path };
  },
  cells: k => Array.from(k == null ? G.cells : G.byK[k].cells),
  deadEnds: () => Array.from(G.cells).filter(c => [0, 1, 2, 3].filter(d => pass[c] & (1 << d)).length === 1),
  pieces: () => G.pieces.map(g => g.k),
  miniAt() { const r = canvas.getBoundingClientRect(), f = fitLogo(lab.square()); return G.mini && { x: f.cx + G.mini.x * f.scale, y: f.cy + G.mini.y * f.scale, dpr: geo.dpr }; },
  dive(at = 0) { if (!G.mini) return null; group = group || { fired: true }; dive = { t0: clock - at * T_DIVE }; render(); return this.info(); },
  mark: () => ({ W: MARK.W, A: MARK.A, B: MARK.B, pieces: MARK.pieces.map(pc => ({ k: pc.k, name: pc.name, s: pc.s.map(v => v / MARK.W), t: pc.t.map(v => v / MARK.W), caps: pc.caps.map(c => MARK.toST(...c).map(v => v / MARK.W)), tips: pc.tips.map(c => c.map(v => v / MARK.W)) })), grid: G.pieces.map(g => ({ k: g.k, S: g.S.map(v => +(v / MARK.W).toFixed(4)), T: g.T.map(v => +(v / MARK.W).toFixed(4)) })), centre: MARK.toST(0, 0).map(v => v / MARK.W) }),
  cellXY(c) { const r = canvas.getBoundingClientRect(), f = fitLogo(lab.square()); return { x: r.left + f.cx + G.ccx[c] * f.scale, y: r.top + f.cy + G.ccy[c] * f.scale }; },
  setCalm(v) { lab.calm = v; },     // lets tooling exercise the animated path on a reduced-motion machine
  // checks that consecutive path cells share an open wall, and returns the step count
  pathCost(path) {
    if (!path) return NaN;
    for (let k = 1; k < path.length; k++) {
      const a = path[k - 1], b = path[k];
      let ok = false;
      for (let d = 0; d < 4; d++) if (pass[a] & (1 << d) && G.nbr[a * 4 + d] === b) ok = true;
      if (!ok) return NaN;
    }
    return path.length - 1;
  },
  // largest distance from a straight mark edge to the nearest lattice line (should be ~0)
  edgeFit() {
    let worst = 0;
    for (const pc of MARK.pieces) {
      const g = G.byK[pc.k];
      for (const v of pc.s) worst = Math.max(worst, Math.min(...g.S.map(x => Math.abs(x - v))));
      for (const v of pc.t) worst = Math.max(worst, Math.min(...g.T.map(x => Math.abs(x - v))));
    }
    return worst;
  },
  buildMs(K) { gridCache.delete(K); const t = performance.now(); buildGrid(K); return performance.now() - t; }
};
</script>
