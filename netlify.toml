# Plain static site: no build step. labs/ is committed (made by npm run sync), so Netlify just publishes the repo.
[build]
  publish = "."
  command = ""

# workspace/ is Scott's workspace (lab sources, ideation, brand): in the repo, but not part of the site.
[[redirects]]
  from = "/workspace"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/workspace/*"
  to = "/404.html"
  status = 404
  force = true

# Analytics (site/analytics.js): /plume/* is PostHog's US ingest, proxied so blockers that know PostHog's domain let it through.
[[redirects]]
  from = "/plume/*"
  to = "https://us.i.posthog.com/:splat"
  status = 200
  force = true
