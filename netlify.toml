# Plain static site: no build step. labs/ is committed (made by npm run sync), so Netlify just publishes the repo.
[build]
  publish = "."
  command = ""

# workspace/ is Scott's workspace (lab sources, ideation, brand): in the repo, but not part of the site.
[[redirects]]
  from = "/workspace"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/workspace/*"
  to = "/404.html"
  status = 404
  force = true
