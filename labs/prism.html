// ---- world: the key square is 10 units, the mark is LOGO_FILL of that ----
const SQ = 10, LOGO_W = SQ * LOGO_FILL, BEAM_Y = LOGO_DEPTH * LOGO_W / 2;
const LIFT = 4;   // height of the slab off the bench; Grid refraction scales the same bend

const { canvas } = lab.canvas({ context: 'none' });
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true }); }
catch (e) { lab.hud('WebGL is not available in this browser.'); throw e; }

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-5, 5, 5, -5, 0.1, 100);
camera.position.set(0, 20, 0);
camera.up.set(0, 0, -1);           // screen down = +z, matching the logo's y-down units
camera.lookAt(0, 0, 0);

const markGroup = new THREE.Group();
scene.add(markGroup);

// optics geometry, recomputed when the mark rotates
const BASE = logoPolygons({ curveSegments: 8 }).map(poly => poly.map(([x, y]) => ({ x: x * LOGO_W, z: y * LOGO_W })));

// Signed distance to the mark (negative inside), baked once in the mark's own frame.
// The bench shader rotates into that frame, so the edges stay analytic and antialiased at any angle.
const SDF_N = 640, SDF_L = 3.4;
function buildSdf() {

  const E = segs.length, ax = new Float64Array(E), az = new Float64Array(E), bx = new Float64Array(E), bz = new Float64Array(E), il = new Float64Array(E);
  segs.forEach(([a, b], i) => { ax[i] = a.x; az[i] = a.z; bx[i] = b.x - a.x; bz[i] = b.z - a.z; il[i] = 1 / (bx[i] * bx[i] + bz[i] * bz[i] || 1); });

    for (let i = 0; i < SDF_N; i++) {
      const x = -SDF_L + (i + 0.5) * h;
      while (ci < xs.length && xs[ci] < x) ci++;

      for (let e = 0; e < E; e++) {
        const px = x - ax[e], pz = z - az[e];

}

// The bench: grid plus glass in one pass. Looking straight down, light through the flat top barely moves,
// so the grid only bends where the surface tilts: the rounded rim and the ripples. Each color channel uses
// its own index of refraction, so the rim fringes the way the beam does.
const benchMat = new THREE.ShaderMaterial({
  uniforms: {
    uSdf: { value: buildSdf() }, uL: { value: SDF_L }, uRot: { value: new THREE.Vector2(1, 0) },
    uCell: { value: 0.2 }, uLine: { value: 0.01 },
    uBg: { value: new THREE.Color() }, uGrid: { value: new THREE.Color() }, uInk: { value: new THREE.Color() },
    uEdgeInk: { value: new THREE.Color() }, uSheenInk: { value: new THREE.Color() },
    uBody: { value: 0.05 }, uBevel: { value: 0.12 }, uThick: { value: LOGO_DEPTH * LOGO_W }, uIor: { value: new THREE.Vector3(1.6, 1.62, 1.64) },
    uRipple: { value: 0.3 }, uRippleFreq: { value: 2.2 }, uTexture: { value: 0.3 },
    uEdgeMode: { value: 1 }, uEdgeW: { value: 1.2 }, uGap: { value: 0.03 }, uRimDark: { value: 0.9 }, uLight: { value: new THREE.Vector2(0.7071, -0.7071) }
  },
  vertexShader: `varying vec2 vP; void main() { vec4 w = modelMatrix * vec4(position, 1.0); vP = w.xz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `
    uniform sampler2D uSdf; uniform float uL, uCell, uLine, uBody, uBevel, uThick, uRipple, uRippleFreq, uTexture, uEdgeW, uGap;
    uniform vec2 uRot; uniform vec3 uBg, uGrid, uInk, uEdgeInk, uSheenInk, uIor; uniform int uEdgeMode; uniform float uRimDark; uniform vec2 uLight;
    varying vec2 vP;

    vec3 hash3(vec2 p) { vec3 q = fract(vec3(p.xyx) * vec3(.1031, .1030, .0973)); q += dot(q, q.yxz + 33.33); return fract((q.xxy + q.yzz) * q.zyx); }
    // gradient noise with its analytic derivative: .x value, .yz gradient
    vec3 gnoise(vec2 p) {

      float va = dot(ga, f), vb = dot(gb, f - vec2(1, 0)), vc = dot(gc, f - vec2(0, 1)), vd = dot(gd, f - vec2(1, 1));
      float v = va + u.x * (vb - va) + u.y * (vc - va) + u.x * u.y * (va - vb - vc + vd);
      vec2 g = ga + u.x * (gb - ga) + u.y * (gc - ga) + u.x * u.y * (ga - gb - gc + gd) + du * (u.yx * (va - vb - vc + vd) + vec2(vb, vc) - va);
      return vec3(v, g);
    }

    float sdf(vec2 b) {
      // past the baked square, extend the field by the distance to it so it never jumps
      vec2 c = clamp(b, vec2(-uL * 0.995), vec2(uL * 0.995));

    }
    // one grid axis: a line uLine wide, faded rather than aliased once it shrinks below a pixel
    float gridAxis(float q, float fw) {
      float d = abs(fract(q / uCell + 0.5) - 0.5) * uCell;
      float w = max(uLine, fw);
      return clamp((w * 0.5 - d) / max(fw, 1e-6) + 0.5, 0.0, 1.0) * uLine / w;
    }
    float grid(vec2 q) { vec2 fw = fwidth(q); return max(gridAxis(q.x, fw.x), gridAxis(q.y, fw.y)); }

    void main() {
      vec2 p = vP;
      vec2 b = vec2(p.x * uRot.x + p.y * uRot.y, -p.x * uRot.y + p.y * uRot.x);   // world → mark frame
      float d = sdf(b);
      vec2 fp = fwidth(p);
      float px = max(max(fp.x, fp.y), 1e-5);                 // one device pixel in world units (the field has unit slope)
      float inside = clamp(0.5 - d / px, 0.0, 1.0);

      vec3 outer = mix(uBg, uGrid, grid(p));
      vec3 col = outer;

      {
        // outward normal from the distance field, rotated back to world
        float e = 2.0 * uL / ${SDF_N}.0;
        vec2 gb = normalize(vec2(sdf(b + vec2(e, 0)) - sdf(b - vec2(e, 0)), sdf(b + vec2(0, e)) - sdf(b - vec2(0, e))) + 1e-6);

        float rim = uBevel > 0.0 ? clamp(1.0 + d / uBevel, 0.0, 1.0) : 0.0;
        vec2 tilt = gw * rim;

        vec3 n1 = gnoise(b * uRippleFreq), n2 = gnoise(b * uRippleFreq * 2.3 + 7.1);
        vec2 rg = n1.yz + 0.45 * n2.yz;
        tilt += vec2(rg.x * uRot.x - rg.y * uRot.y, rg.x * uRot.y + rg.y * uRot.x) * uRipple * 0.18;
        float s = min(length(tilt), 0.985);
        vec2 dir = s > 1e-5 ? tilt / length(tilt) : vec2(0.0);
        // Snell at the tilted top face; the ray bends inward and lands on the bench below
        float th = asin(s);
        vec3 shift = uThick * tan(th - asin(s / uIor));
        vec3 under = vec3(
          mix(uBg.r, uGrid.r, grid(p - dir * shift.r)),
          mix(uBg.g, uGrid.g, grid(p - dir * shift.g)),
          mix(uBg.b, uGrid.b, grid(p - dir * shift.b)));
        float c = sqrt(1.0 - s * s);
        float r0 = pow((uIor.g - 1.0) / (uIor.g + 1.0), 2.0);
        float fres = r0 + (1.0 - r0) * pow(1.0 - c, 5.0);
        // fine noise you can see in the body, plus light catching the ripples
        float grain = gnoise(b * 38.0).x * 0.6 + gnoise(b * 91.0).x * 0.4;
        float lit = dot(tilt, normalize(vec2(-0.6, -0.8)));
        vec3 glass = under * (1.0 - fres);
        glass = mix(glass, uInk, clamp(uBody * (1.0 + uTexture * 1.6 * grain), 0.0, 1.0));
        glass += uInk * uTexture * 0.35 * max(lit, 0.0) * (0.5 + uRipple);
        // Black rims: on thick glass the rim bends the view steeply into the side walls, where it is trapped
        // and absorbed, so the edge reads dark. The reflection at the very edge is what stays bright.
        // Studio reflection: the rim mirrors a bright diagonal light and a dark room, so edges facing
        // one way read white and the others black (after https://www.shadertoy.com/view/wccSDf)
        if (uEdgeMode == 6) {
          vec2 rxy = 2.0 * c * tilt;                         // reflect((0,0,-1), n).xy
          float env = clamp(1.4142 * abs(dot(rxy, uLight)), 0.0, 1.0);
          glass = mix(glass, uInk * env, clamp((1.0 - c) * 2.0, 0.0, 1.0) * uRimDark);
        }
        if (uEdgeMode == 4 || uEdgeMode == 5) {
          float band = max(uBevel, uEdgeW * 3.0 * px);
          float r = clamp(1.0 + d / band, 0.0, 1.0);
          glass *= 1.0 - uRimDark * smoothstep(0.2, 0.85, r);
        }
        glass += uSheenInk * fres * fres;
        col = mix(outer, glass, inside);
      }

      // outlines, measured in pixels off the distance field so they stay smooth at every angle
      float dp = abs(d) / px;
      if (uEdgeMode == 5) {
        float band = max(uBevel, uEdgeW * 3.0 * px);
        col = mix(col, uEdgeInk, clamp(uEdgeW * 0.5 - dp + 0.5, 0.0, 1.0));
        col = mix(col, uEdgeInk, 0.35 * clamp(uEdgeW * 0.5 - abs(d + band) / px + 0.5, 0.0, 1.0));
      } else if (uEdgeMode > 0 && uEdgeMode < 4) {
        float a = clamp(uEdgeW * 0.5 - dp + 0.5, 0.0, 1.0);
        if (uEdgeMode == 2) a = max(a, clamp(uEdgeW * 0.5 - abs(d + uGap) / px + 0.5, 0.0, 1.0));
        col = mix(col, uEdgeInk, a);
        if (uEdgeMode == 3) col += uEdgeInk * 0.22 * clamp(uEdgeW * 2.5 - dp + 0.5, 0.0, 1.0);
      }
      gl_FragColor = vec4(col, 1.0);
    }`,
  depthWrite: false
});
const bench = new THREE.Mesh(new THREE.PlaneGeometry(400, 400).rotateX(-Math.PI / 2), benchMat);
bench.position.y = -0.01;
bench.renderOrder = -1;
scene.add(bench);
let edges = [];
function buildEdges(deg) {

  const polys = BASE.map(poly => poly.map(p => ({ x: p.x * c - p.z * s, z: p.x * s + p.z * c })));
  edges = polys.flatMap(poly => poly.map((p, i) => {
    const q = poly[(i + 1) % poly.length];
    let n = norm({ x: q.z - p.z, z: -(q.x - p.x) });
    if (inside(add(mul(add(p, q), 0.5), mul(n, 1e-3)), poly)) n = mul(n, -1);
    return { a: p, b: q, n };
  }));

}

const dot = (a, b) => a.x * b.x + a.z * b.z;
const add = (a, b) => ({ x: a.x + b.x, z: a.z + b.z });
const mul = (a, k) => ({ x: a.x * k, z: a.z * k });

}

const stats = { tir: 0, rays: 0 };
function trace(o, d, ior, color, I, budget, segs) {
  if (I < 0.015 || budget.left-- <= 0) return;
  stats.rays++;
  const h = hit(o, d);
  if (!h) { segs.push(o, toBounds(o, d), color, I); return; }
  const p = add(o, mul(d, h.t));
  segs.push(o, p, color, I);
  const entering = dot(d, h.e.n) < 0;
  const n = entering ? h.e.n : mul(h.e.n, -1);
  const n1 = entering ? 1 : ior, n2 = entering ? ior : 1;
  const r = refract(d, n, n1 / n2);
  if (!r) { stats.tir++; trace(p, reflect(d, n), ior, color, I, budget, segs); return; }
  const R = lab.params.fresnel ? schlick(-dot(n, d), n1, n2) : 0;
  trace(p, r, ior, color, I * (1 - R), budget, segs);
  if (R * I > 0.015) trace(p, reflect(d, n), ior, color, I * R, budget, segs);
}

// beams
// Screen-space "fat" lines: real pixel widths with smooth edges (alpha to coverage under MSAA).
const MAX = 12000;
const beamGeo = new LineSegmentsGeometry();
beamGeo.setPositions(new Float32Array(MAX * 6));
beamGeo.setColors(new Float32Array(MAX * 6));
const beamPos = beamGeo.attributes.instanceStart.data, beamCol = beamGeo.attributes.instanceColorStart.data;
const beamMat = new LineMaterial({ vertexColors: true, linewidth: 1.4, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false, alphaToCoverage: true });
const beams = new LineSegments2(beamGeo, beamMat);
beams.frustumCulled = false;
beams.renderOrder = 2;
scene.add(beams);

const emitter = new THREE.Mesh(new THREE.PlaneGeometry(0.42, 0.14).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffffff }));
emitter.position.y = BEAM_Y;
scene.add(emitter);

// Post-processing renders off screen, so antialiasing has to live on its render target (MSAA samples).
const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.9, 0.35, 0.3);
let composer;
function buildComposer(samples) {
  composer?.dispose();
  const target = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples });
  composer = new EffectComposer(renderer, target);
  composer.addPass(new RenderPass(scene, camera));
  composer.addPass(bloom);
  composer.addPass(new OutputPass());
  composer.addPass(filmPass);
  beamMat.alphaToCoverage = samples > 0; beamMat.needsUpdate = true;
  if (sq) sizeComposer();
}
function sizeComposer() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  composer.setPixelRatio(dpr); composer.setSize(sq.w, sq.h);
  beamMat.resolution.set(sq.w * dpr, sq.h * dpr);
}

// ---- glass look: backlight, film ----
// Backlight: a soft glow under the glass, either the mark's own silhouette blurred or a round pool.
const backMat = new THREE.MeshBasicMaterial({ transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
const back = new THREE.Mesh(new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2), backMat);
back.position.y = -0.005;
markGroup.add(back);
function buildBacklight() {
  const N = 512, c = document.createElement('canvas');
  c.width = c.height = N;
  const g = c.getContext('2d');
  if (lab.params.backShape === 'pool') {
    const r = g.createRadialGradient(N / 2, N / 2, 0, N / 2, N / 2, N / 2);
    r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.45, 'rgba(255,255,255,.35)'); r.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = r; g.fillRect(0, 0, N, N);
  } else {
    // the shape is drawn off canvas and only its blurred shadow lands, which works where ctx.filter doesn't
    const path = logoPath2D(), s = N * LOGO_FILL / 1.3;
    g.shadowColor = '#fff'; g.shadowOffsetX = N * 2;
    for (const blur of [64, 24]) {
      g.shadowBlur = blur;
      g.setTransform(s, 0, 0, s, N / 2 - N * 2, N / 2);
      g.fill(path);
    }
  }
  backMat.map?.dispose();
  backMat.map = new THREE.CanvasTexture(c);
  backMat.map.colorSpace = THREE.SRGBColorSpace;
  backMat.needsUpdate = true;
}

// Film: grain and vignette after tone mapping
const filmPass = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, time: { value: 0 }, grain: { value: 0 }, vignette: { value: 0 } },
  vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float time, grain, vignette; varying vec2 vUv;
    float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main() {
      vec4 c = texture2D(tDiffuse, vUv);
      vec2 q = vUv - 0.5;
      c.rgb *= clamp(1.0 - vignette * dot(q, q) * 2.2, 0.0, 1.0);
      c.rgb += (hash(vUv * vec2(1931.0, 1777.0) + fract(time * 7.13)) - 0.5) * grain;
      gl_FragColor = c;
    }`
});

// Neon: mostly steady, with occasional dropouts and a faint mains hum.
function neon(t, amount) {
  if (!amount) return 1;
  const r = Math.abs(Math.sin(Math.floor(t * 14) * 91.17) * 437.58) % 1;
  const dip = r > 0.93 ? 0.7 : r > 0.88 ? 0.3 : 0;
  return 1 - amount * (dip + 0.04 * (0.5 + 0.5 * Math.sin(t * 120)));
}

// Reveal: pull back from a close-up while the edges strike and the backlight swells.
let revealAt = -1;
function reveal() { revealAt = lab.calm ? -1 : performance.now(); }
const ease = x => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
// damped spring: overshoots ~13% once, rings back under, and is exactly 1 at x = 1
const elastic = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.exp(-6 * x) * Math.cos(3 * Math.PI * x) * (1 - x * x * x * x);

let sq = lab.square(), k = SQ / sq.size;
buildComposer(lab.params.msaa ? 4 : 0);
function resize(s) {
  sq = s; k = SQ / s.size;
  const hw = s.w * k / 2, hh = s.h * k / 2;
  Object.assign(camera, { left: -hw, right: hw, top: hh, bottom: -hh });
  camera.updateProjectionMatrix();
  bounds = { x0: -hw, x1: hw, z0: -hh, z1: hh };
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  renderer.setPixelRatio(dpr); renderer.setSize(s.w, s.h, false);
  sizeComposer();
  benchMat.uniforms.uCell.value = 16 * k;
}
lab.on('resize', resize);
resize(sq);

lab.on('palette', p => {
  renderer.setClearColor(p.bg, 1);
  benchMat.uniforms.uBg.value.set(p.bg);
  benchMat.uniforms.uGrid.value.set(p.grid);
  emitter.material.color.set(p.ink);
});
renderer.setClearColor(lab.palette.bg, 1);
benchMat.uniforms.uBg.value.set(lab.palette.bg);
benchMat.uniforms.uGrid.value.set(lab.palette.grid);
emitter.material.color.set(lab.palette.ink);
lab.on('change', key => {
  if (key === 'rotation') buildEdges(lab.params.rotation);
  if (key === 'msaa') buildComposer(lab.params.msaa ? 4 : 0);
  if (key === 'backShape') buildBacklight();
});
buildBacklight();
buildEdges(lab.params.rotation);

// pointer: the beam aims at the pointer, and dragging the emitter itself moves it.
// A mouse aims by hovering; a finger can't hover, so it aims while dragging and the beam holds that angle after it lifts.
// While the emitter is dragged the aim point stays where it was, so the beam keeps pointing at it from the new spot.
const toWorld = e => {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left - sq.w / 2) * k / camera.zoom, z: (e.clientY - r.top - sq.h / 2) * k / camera.zoom };
};
let aim = null, source = { x: -4.4, z: 1.1 }, moving = null;
// within a fingertip (about 24 px) of the emitter, or 0.6 units, whichever is bigger
const onEmitter = (p, e) => Math.hypot(p.x - source.x, p.z - source.z) < Math.max(0.6, (e.pointerType === 'touch' ? 24 : 12) * k / camera.zoom);
canvas.addEventListener('pointermove', e => {
  const p = toWorld(e);
  if (moving === e.pointerId) { source = p; return; }
  // a mouse reaching for the emitter leaves the aim where it was
  const grab = e.pointerType === 'mouse' && onEmitter(p, e);
  if (!grab) aim = p;
  if (e.pointerType === 'mouse') canvas.style.cursor = grab ? 'grab' : '';
});
// a mouse that leaves lets the sweep resume, unless it only went onto the sweep toggle
canvas.addEventListener('pointerleave', e => {
  if (e.pointerType !== 'touch' && moving === null && !e.relatedTarget?.closest?.('.sweep-toggle')) aim = null;
});
canvas.addEventListener('pointerdown', e => {
  const p = toWorld(e);
  if (onEmitter(p, e)) {
    moving = e.pointerId;
    canvas.setPointerCapture(e.pointerId);
    if (e.pointerType === 'mouse') canvas.style.cursor = 'grabbing';
    return;
  }
  if (e.pointerType === 'touch') canvas.setPointerCapture(e.pointerId);
  aim = p;
});
const stopMoving = e => { if (moving === e.pointerId) { moving = null; if (e.pointerType === 'mouse') canvas.style.cursor = 'grab'; } };
canvas.addEventListener('pointerup', stopMoving);
canvas.addEventListener('pointercancel', stopMoving);

// The ambient sweep: aiming pauses it, holding the beam where it was left. A small bubble beside the emitter,
// drawn in the mark's own hairline style, plays or pauses it.
let beamA = null;                     // the beam's angle, eased so a resumed sweep glides back rather than jumps
const sweeping = () => lab.params.sweep && !aim;
const toggle = document.createElement('div');
toggle.className = 'sweep-toggle';
toggle.setAttribute('role', 'button');
toggle.tabIndex = 0;
toggle.setAttribute('aria-label', 'Resume the sweep');
toggle.innerHTML = `<svg viewBox="0 0 22 22" width="22" height="22" aria-hidden="true"><circle cx="11" cy="11" r="10"/>
  <path class="pause" d="M9 7.5v7M13 7.5v7"/><path class="play" d="M9.25 7.25 14.75 11l-5.5 3.75z"/></svg>`;
lab.stage.appendChild(toggle);
document.head.insertAdjacentHTML('beforeend', `<style>
  .sweep-toggle { position: absolute; left: 0; top: 0; z-index: 1; width: 40px; height: 40px; margin: -20px 0 0 -20px; display: grid; place-items: center;
    color: var(--ink); opacity: 0; cursor: pointer; touch-action: none; -webkit-tap-highlight-color: transparent; transition: opacity .4s; }
  .sweep-toggle.shown { opacity: .25; }
  .sweep-toggle.shown:hover, .sweep-toggle:focus-visible { opacity: .6; outline: none; }
  .sweep-toggle circle { fill: rgb(0 0 0 / .35); stroke: currentColor; stroke-width: 1; }
  .sweep-toggle path { fill: none; stroke: currentColor; stroke-width: 1.2; stroke-linejoin: round; stroke-linecap: round; }
  .sweep-toggle[data-on] .play, .sweep-toggle:not([data-on]) .pause { display: none; }
</style>`);
function toggleSweep() {
  if (sweeping()) {
    // pause: hold the beam at the angle it has now
    aim = { x: source.x + Math.cos(beamA) * 4, z: source.z + Math.sin(beamA) * 4 };
  } else {
    aim = null;
    if (!lab.params.sweep) lab.set('sweep', true);
  }
}
toggle.addEventListener('click', toggleSweep);
toggle.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleSweep(); } });

let hudTick = 0;
function frame(dt, t) {
  const P = lab.params, G = GLASSES[P.glass];
  bloom.strength = P.bloom;
  bloom.radius = P.bloomRadius;

  // reveal timeline in seconds: 0–1.6 spring back from 3.6× (overshooting a touch wide, then settling),
  // edges strike at 0.2, backlight swells 0.3–1.3, beam fires at 0.9. Zoom springs in log space so the
  // overshoot reads the same at every scale.
  const rt = revealAt < 0 ? Infinity : (performance.now() - revealAt) / 1000;
  const zoom = rt < 1.6 ? Math.pow(3.6, 1 - elastic(rt / 1.6)) : 1;
  if (camera.zoom !== zoom) { camera.zoom = zoom; camera.updateProjectionMatrix(); }
  const strike = rt === Infinity ? 1 : rt < 0.2 ? 0 : rt < 0.4 ? (Math.floor(rt * 30) % 2 ? 1 : 0.15) : ease((rt - 0.4) / 0.3);
  const swell = rt === Infinity ? 1 : ease((rt - 0.3) / 1);
  const beamOn = rt === Infinity ? 1 : ease((rt - 0.9) / 0.4);
  const hum = neon(t, P.flicker);

  const ink = new THREE.Color(lab.palette.ink);
  const U = benchMat.uniforms, a = P.rotation * Math.PI / 180, dpr = Math.min(2, window.devicePixelRatio || 1);
  U.uRot.value.set(Math.cos(a), Math.sin(a));
  U.uLine.value = k / dpr / camera.zoom;
  U.uInk.value.copy(ink);
  U.uEdgeInk.value.copy(ink).multiplyScalar(P.edgeGlow * hum * strike);
  U.uSheenInk.value.copy(ink).multiplyScalar(P.sheen * (0.3 + 0.7 * strike));
  U.uEdgeMode.value = { off: 0, hairline: 1, inline: 2, neon: 3, black: 4, blackwhite: 5, studio: 6 }[P.edges];
  const la = P.lightAngle * Math.PI / 180;
  U.uLight.value.set(Math.cos(la), -Math.sin(la));
  U.uRimDark.value = P.rimDark;
  U.uEdgeW.value = P.edgeWidth;
  U.uGap.value = P.gap;
  U.uBody.value = P.body * (0.4 + 0.6 * strike);
  U.uBevel.value = P.bevel;
  // the slab sits LIFT above the bench, so the rim bends the grid further than its own depth would
  U.uThick.value = (LOGO_DEPTH * LOGO_W + LIFT) * P.refraction;
  U.uRipple.value = P.ripple;
  U.uRippleFreq.value = 2.2 * P.rippleScale;
  U.uTexture.value = P.texture;
  // red, green and blue each bend by their own index, the same spread the beam uses
  const sp = G.spread * P.dispersion;
  U.uIor.value.set(G.n, G.n + sp * 0.5, G.n + sp);
  // the glow takes the palette's deepest color, so it reads as colored light rather than white haze
  backMat.color.set(ramp(lab.palette, 1)).multiplyScalar(0.45 * P.backlight * swell * (0.85 + 0.15 * hum));
  back.visible = P.backlight > 0;
  back.scale.set(SQ * P.backSize, 1, SQ * P.backSize);
  filmPass.uniforms.time.value = t;
  filmPass.uniforms.grain.value = P.grain;
  filmPass.uniforms.vignette.value = P.vignette;
  filmPass.enabled = P.grain > 0 || P.vignette > 0;

  // idle sweep aims across the chevron arms, where the colors split hardest
  const toCenter = Math.atan2(-source.z, -source.x);
  const idleA = toCenter + 0.32 * Math.sin(t * 0.3);
  const aimed = aim && Math.hypot(aim.x - source.x, aim.z - source.z) > 0.05;
  const targetA = aimed ? Math.atan2(aim.z - source.z, aim.x - source.x) : P.sweep ? idleA : toCenter;
  if (beamA === null || aimed) beamA = targetA;
  else beamA += (Math.atan2(Math.sin(targetA - beamA), Math.cos(targetA - beamA))) * (1 - Math.exp(-dt * 4));
  const d = { x: Math.cos(beamA), z: Math.sin(beamA) };
  emitter.position.set(source.x, BEAM_Y, source.z);
  emitter.rotation.y = -Math.atan2(d.z, d.x);

  // the toggle sits just under the emitter (over it near the stage's foot), still while the beam moves
  const ex = sq.w / 2 + source.x / k * camera.zoom, ey = sq.h / 2 + source.z / k * camera.zoom;
  const tx = Math.max(20, Math.min(sq.w - 20, ex)), ty = ey + 30 > sq.h - 20 ? ey - 30 : Math.max(20, ey + 30);
  toggle.style.transform = `translate(${tx.toFixed(1)}px, ${ty.toFixed(1)}px)`;
  toggle.classList.toggle('shown', rt > 1.6);
  const on = sweeping();
  if (on !== toggle.hasAttribute('data-on')) {
    toggle.toggleAttribute('data-on', on);
    toggle.setAttribute('aria-label', on ? 'Pause the sweep' : 'Resume the sweep');
  }

  stats.tir = 0; stats.rays = 0;
  const segs = [];
  const h0 = hit(source, d);
  if (!h0) segs.push(source, toBounds(source, d), ink, P.beam);
  else {
    const p = add(source, mul(d, h0.t));
    segs.push(source, p, ink, P.beam);
    const n = h0.e.n;
    if (P.fresnel) segs.push(p, toBounds(p, reflect(d, n)), ink, P.beam * schlick(-dot(n, d), 1, G.n));
    for (let i = 0; i < P.waves; i++) {
      const f = P.waves === 1 ? 0 : i / (P.waves - 1);
      const ior = G.n + G.spread * P.dispersion * f;
      const r = refract(d, n, 1 / ior);
      if (!r) continue;
      const color = new THREE.Color(ramp(lab.palette, f));
      const share = P.beam * 2.2 / Math.sqrt(P.waves);
      trace(p, r, ior, color, share * (P.fresnel ? 1 - schlick(-dot(n, d), 1, ior) : 1), { left: P.bounces * 2 }, segs);
    }
  }

  const pos = beamPos.array, col = beamCol.array;
  let i = 0;
  for (let s = 0; s < segs.length && i < MAX; s += 4, i++) {
    const a = segs[s], b = segs[s + 1], c = segs[s + 2], I = Math.min(1.5, segs[s + 3]) * beamOn;
    pos.set([a.x, BEAM_Y, a.z, b.x, BEAM_Y, b.z], i * 6);
    col.set([c.r * I, c.g * I, c.b * I, c.r * I, c.g * I, c.b * I], i * 6);
  }
  beamGeo.instanceCount = i;
  beamPos.needsUpdate = beamCol.needsUpdate = true;
  beamMat.linewidth = P.width;

  if (++hudTick % 8 === 0) {
    const theta = h0 ? Math.acos(Math.min(1, Math.abs(dot(d, h0.e.n)))) * 180 / Math.PI : null;
    const hi = G.n + G.spread * P.dispersion;
    lab.hud(h0
      ? `θᵢ <b>${theta.toFixed(1)}°</b> · n <b>${G.n.toFixed(3)}–${hi.toFixed(3)}</b> · θc <b>${(Math.asin(1 / G.n) * 180 / Math.PI).toFixed(1)}°</b> · internal reflections <b>${stats.tir}</b> · rays <b>${stats.rays}</b>`
      : `beam misses the mark · move the pointer onto the chevrons`);
  }
  composer.render();
}
lab.loop(frame);
// test hook: draw one frame at time t, optionally a given number of seconds into the reveal
window.__lab = { renderOnce: (t = 0, revealSeconds) => { if (revealSeconds != null) revealAt = performance.now() - revealSeconds * 1000; frame(0.016, t); } };
</script>
