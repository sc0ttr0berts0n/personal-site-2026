  .sand-tools kbd { font: inherit; color: var(--dim); }

</style>
<script type="module">
import { createLab } from './shared/lab.js';
import { LOGO_PIECES, fitLogo, logoPolygons } from './shared/logo.js';

// =====================================================================================
// Knobs that aren't sliders. Everything Scott might want to argue with lives up here.
// Sim time: 1 "sim second" = NOMINAL_HZ ticks. At the default 3 steps per frame and 60 fps,
// sim seconds are real seconds; the Speed slider speeds everything up together.
// =====================================================================================
const NOMINAL_HZ = 180;
const THAW_SPREAD = 1.6;   // sim s from the first cell of the mark released to the last
const BUD_WAIT = 7;        // bloom steps a bud stays closed (swelling green → colour) before it opens
const SAP_MAX = 12;        // water a root can hold for its plant
const ROOT_REACH = 3;      // radius, in cells, a root drinks from
const SEED_REACH = 2;      // a resting seed germinates when water is this close
const MAX_SWAY = 3;        // stems may wander this many cells left or right of their root
const LAVA_REACH = 2;      // lava looks this far sideways for somewhere lower (water uses the Spread slider)
const GROW_P = 0.028;      // chance per tick a stem tip grows (× Growth rate)
const BLOOM_P = 0.045;     // chance per tick a bud takes a bloom step (× Growth rate)
const DRINK_P = 0.07;      // chance per tick a root tries to drink (× Growth rate)
const FADE = 0.8;          // s crossfade back to the mark on reset
const QUIET_ACT = 0.8;     // mean events per tick below which the box counts as settled
const IDLE_RESET = 240;    // s with no input before an auto reset even if it never goes quiet
const OUTLINE_GAP = 3;     // body outline: one dot every this many dot sizes
const FLOOR_PAD = 42;      // CSS px between the sandbox floor and the stage bottom (room for the HUD)

// ---- elements ----
const EMPTY = 0, WATER = 1, LAVA = 2, WOOD = 3, STONE = 4, ASH = 5, STEAM = 6, SMOKE = 7,
  FIRE = 8, SEED = 9, ROOT = 10, STEM = 11, LEAF = 12, TIP = 13, BUD = 14, PETAL = 15;
const NAMES = ['empty', 'water', 'lava', 'wood', 'stone', 'ash', 'steam', 'smoke', 'fire', 'seed', 'root', 'stem', 'leaf', 'tip', 'bud', 'petal'];
const table = (list, v = 1, fill = 0) => { const a = new Uint8Array(16).fill(fill); for (const t of list) a[t] = v; return a; };
// density decides who sinks through whom; 255 = fixed in place
const DENS = new Uint8Array(16).fill(255);
DENS[EMPTY] = 0; DENS[STEAM] = 0; DENS[SMOKE] = 0; DENS[WATER] = 2; DENS[LAVA] = 3; DENS[ASH] = 4; DENS[SEED] = 4; DENS[STONE] = 5;
const PLANT = table([SEED, ROOT, STEM, LEAF, TIP, BUD, PETAL]);   // burns
const FERTILE = table([WOOD, STONE, ASH]);                       // water resting on these can plant a seed (the floor counts too)
const SOFT = table([EMPTY, WATER, STEAM, SMOKE]);                // plants may grow into these
const THIN = table([STEM, LEAF, TIP, BUD, PETAL]);              // water threads through these without moving them

// ---- flowers: grown cell by cell from these patterns ----
// '*' is the bud (the top of the stem). Letters are roles: a petal, b petal shade, c centre, d centre dark, g green.
// Bloom order: green first, then outward from `start` ('origin' = cup opens upward from the stem, 'center' = unfurls).
const GREEN = [58, 150, 62];
const SPECIES = [
  { name: 'tulip', h: [11, 17], sway: 0.03, nLeaves: 2, leaf: [[1, 0], [1, -1], [2, -2], [2, -3]], origin: 'b', start: 'origin',
    rows: ['a.a.a', 'aabaa', 'abbba', '.b*b.'],
    variants: [{ a: [232, 36, 54], b: [170, 18, 40] }, { a: [255, 210, 44], b: [228, 150, 18] }, { a: [255, 124, 176], b: [214, 72, 136] }, { a: [164, 74, 214], b: [112, 42, 164] }] },
  { name: 'rose', h: [12, 18], sway: 0.07, nLeaves: 2, leaf: [[1, 0], [1, -1], [2, -1]], origin: 'g', start: 'center', spiral: true,
    rows: ['.aba.', 'abbaa', 'abcba', 'aabba', '.aaa.', 'g.*.g'],
    variants: [{ a: [200, 20, 46], b: [142, 8, 32], c: [92, 0, 22] }, { a: [240, 100, 142], b: [198, 58, 102], c: [150, 30, 72] }, { a: [244, 236, 228], b: [212, 200, 196], c: [180, 168, 166] }] },
  { name: 'daisy', h: [9, 16], sway: 0.06, nLeaves: 2, leaf: [[1, 0], [2, -1]], origin: 'g', start: 'center',
    rows: ['...a...', '.a.a.a.', '..ccc..', 'aacdcaa', '..ccc..', '.a.g.a.', '...*...'],
    variants: [{ a: [248, 248, 242], c: [255, 206, 32], d: [212, 138, 16] }, { a: [206, 176, 246], c: [255, 206, 32], d: [212, 138, 16] }] },
  { name: 'poppy', h: [10, 18], sway: 0.12, nLeaves: 1, leaf: [[1, 0], [2, -1]], origin: 'g', start: 'center',
    rows: ['.a.a.', 'aabaa', 'abdba', '.aaa.', '..*..'],
    variants: [{ a: [255, 70, 36], b: [212, 36, 24], d: [28, 18, 22] }, { a: [255, 150, 32], b: [238, 108, 18], d: [120, 60, 8] }] },
  { name: 'cornflower', h: [8, 14], sway: 0.12, nLeaves: 1, leaf: [[1, 0], [2, -1]], origin: 'g', start: 'center',
    rows: ['a.a.a', '.aba.', 'aabaa', '.bbb.', '..*..'],
    variants: [{ a: [78, 120, 255], b: [44, 64, 206] }, { a: [120, 176, 255], b: [66, 108, 230] }] },
  { name: 'lavender', h: [6, 11], sway: 0.0, nLeaves: 1, leaf: [[1, 0]], origin: 'g', start: 'origin', grey: true,
    rows: ['.a.', 'aba', '.a.', 'aba', '.b.', 'aba', '.g.', '.*.'],
    variants: [{ a: [178, 130, 238], b: [124, 88, 198] }] },
  { name: 'buttercup', h: [5, 10], sway: 0.15, nLeaves: 1, leaf: [[1, 0]], origin: 'g', start: 'origin',
    rows: ['a.a', 'aba', '.a.', '.*.'],
    variants: [{ a: [255, 228, 50], b: [236, 176, 0] }] },
  // water only: a seed that sprouts under water rises straight to the surface, lays a lily pad on it, and opens a
  // lotus a few cells above (h counts only the stem above the water)
  { name: 'lotus', water: true, h: [3, 4], sway: 0, nLeaves: 0, leaf: [], origin: 'b', start: 'origin',
    rows: ['...a...', 'a..a..a', '.a.b.a.', '.abcba.', 'aabcbaa', '.abbba.', '...*...'],
    variants: [{ a: [255, 170, 204], b: [236, 104, 156], c: [255, 214, 72] }, { a: [250, 246, 240], b: [240, 196, 214], c: [255, 214, 72] }] }
];
const LOTUS = SPECIES.findIndex(s => s.water);
const PAD_R = [4, 6];      // lily pad half-width, cells
const LOTUS_CALM = 1.5;    // mean events per tick under which the pools count as settled enough for a lotus
const MIXES = {
  meadow: [3, 2, 3, 2, 2, 2, 2],
  garden: [3, 2, 3, 0, 0, 0, 0],
  wild:   [0, 0, 1, 3, 3, 2, 3]
};
SPECIES.forEach((s, k) => { if (!s.water) MIXES[s.name] = SPECIES.map((_, j) => j === k ? 1 : 0); });

// colour table for petals (aux of a PETAL cell indexes this)
const COLORS = [];
const cid = rgb => { COLORS.push(rgb); return COLORS.length - 1; };
for (const s of SPECIES) {
  let ox = 0, oy = 0;
  s.rows.forEach((r, y) => [...r].forEach((ch, x) => { if (ch === '*') { ox = x; oy = y; } }));
  const cells = [];
  s.rows.forEach((r, y) => [...r].forEach((ch, x) => { if (ch !== '.' && ch !== '*') cells.push({ dx: x - ox, dy: y - oy, role: ch }); }));
  let sx = 0, sy = 0;
  if (s.start === 'center') {
    const head = cells.filter(c => c.role !== 'g');
    sx = head.reduce((v, c) => v + c.dx, 0) / head.length; sy = head.reduce((v, c) => v + c.dy, 0) / head.length;
  }
  const key = c => {
    const r = Math.hypot(c.dx - sx, c.dy - sy), a = (Math.atan2(c.dy - sy, c.dx - sx) + Math.PI) / (2 * Math.PI);
    return (c.role === 'g' ? -100 : 0) + (s.spiral ? r + a : r + a * 0.01);
  };
  s.cells = cells.sort((p, q) => key(p) - key(q));
  s.cid = s.variants.map(v => {
    const m = {};
    for (const role of 'abcdg') m[role] = cid(role === 'g' ? GREEN : v[role] || v.a);
    return m;
  });
}

// =====================================================================================
const lab = createLab({
  number: '10',
  title: 'Falling Sand',
  blurb: 'The mark as a sandbox. Lava on the left, water on the right, wood in the middle, all in a round basin cut into bedrock. Lava chews through wood a cell at a time, water and lava make stone and steam, and water sitting on wood, stone or ash grows flowers that bloom pixel by pixel.',
  teaches: 'cellular automata: local rules, update order and scan bias, density swaps, conserved budgets (every petal costs water)',
  hint: 'drag to paint · keys 1–7 pick · [ ] brush',
  palettes: [
    { key: 'nature', name: 'Nature', bg: '#000000', grid: '#17171d', ink: '#f4f4f6', colors: ['#2a74ea', '#8a5530', '#ff7a14', '#e8304a', '#3c9a40'] },
    'ember', 'reef', 'aurora', 'ultraviolet', 'gold'
  ],
  defaultPalette: 'nature',
  params: {
    hSim:      { type: 'heading', label: 'Simulation' },
    speed:     { type: 'range', label: 'Steps per frame', min: 1, max: 8, step: 1, value: 2 },
    res:       { type: 'range', label: 'Cells across', min: 120, max: 320, step: 10, value: 200 },
    hold:      { type: 'range', label: 'Hold the mark', min: 0, max: 8, step: 0.1, value: 2, unit: ' s' },
    thaw:      { type: 'select', label: 'Thaw', value: 'top', options: [['melt', 'Melt from the bottom'], ['top', 'Top down'], ['ripple', 'Ripple from centre'], ['all', 'All at once']] },
    seed:      { type: 'range', label: 'Random seed', min: 1, max: 99, step: 1, value: 1 },
    hLava:     { type: 'heading', label: 'Lava' },
    biteMin:   { type: 'range', label: 'Bite time min', min: 1, max: 400, step: 1, value: 10, unit: ' ticks' },
    biteMax:   { type: 'range', label: 'Bite time max', min: 1, max: 600, step: 1, value: 50, unit: ' ticks' },
    lavaFlow:  { type: 'range', label: 'Flow', min: 0.02, max: 1, step: 0.01, value: 0.02 },
    lavaCool:  { type: 'range', label: 'Cools on its own', min: 0, max: 1, step: 0.05, value: 0.1 },
    embers:    { type: 'range', label: 'Embers from burning wood', min: 0, max: 1, step: 0.05, value: 0.75 },
    emberCatch:{ type: 'range', label: 'Ember sets wood alight', min: 0, max: 1, step: 0.05, value: 0.7 },
    hWater:    { type: 'heading', label: 'Water' },
    spread:    { type: 'range', label: 'Spread', min: 1, max: 16, step: 1, value: 16, unit: ' cells' },
    condense:  { type: 'range', label: 'Steam condenses', min: 0.5, max: 10, step: 0.1, value: 1.6, unit: ' s' },
    rainBack:  { type: 'range', label: 'Steam rains back', min: 0, max: 1, step: 0.05, value: 0.4 },
    hFlowers:  { type: 'heading', label: 'Flowers' },
    seeding:   { type: 'range', label: 'Seeding', min: 0, max: 1, step: 0.05, value: 0.3 },
    growth:    { type: 'range', label: 'Growth rate', min: 0.1, max: 4, step: 0.1, value: 2, unit: '×' },
    tall:      { type: 'range', label: 'Height', min: 0.4, max: 2.5, step: 0.1, value: 0.7, unit: '×' },
    spacing:   { type: 'range', label: 'Spacing', min: 2, max: 16, step: 1, value: 11, unit: ' cells' },
    mix:       { type: 'select', label: 'Species', value: 'meadow', options: [['meadow', 'Meadow (all)'], ['garden', 'Garden: tulip, rose, daisy'], ['wild', 'Wildflowers'], ...SPECIES.filter(s => !s.water).map(s => [s.name, s.name[0].toUpperCase() + s.name.slice(1)])] },
    lotus:     { type: 'toggle', label: 'Lily pads and lotus in water', value: true },
    hFire:     { type: 'heading', label: 'Fire' },
    fireSpread:{ type: 'range', label: 'Spread chance', min: 0, max: 1, step: 0.05, value: 0.8 },
    burn:      { type: 'range', label: 'Burn time', min: 5, max: 300, step: 5, value: 90, unit: ' ticks' },
    ash:       { type: 'range', label: 'Ash left behind', min: 0, max: 1, step: 0.05, value: 0.1 },
    ring:      { type: 'toggle', label: 'Bedrock round the mark', value: true },
    ringGap:   { type: 'range', label: 'Bedrock distance', min: 1, max: 3, step: 0.05, value: 1, unit: ' bars' },
    fossils:   { type: 'toggle', label: 'Fossils in the bedrock', value: true },
    hLoop:     { type: 'heading', label: 'Loop' },
    autoReset: { type: 'toggle', label: 'Auto reset when settled', value: true },
    quiet:     { type: 'range', label: 'Settled for', min: 2, max: 30, step: 1, value: 3, unit: ' s' },
    hLook:     { type: 'heading', label: 'Look' },
    outline:   { type: 'toggle', label: 'Body outline', value: true },
    shimmer:   { type: 'toggle', label: 'Shimmer', value: true },
    glow:      { type: 'toggle', label: 'Lava glow', value: true },
    hTools:    { type: 'heading', label: 'Brush' },
    brush:     { type: 'range', label: 'Brush radius', min: 1, max: 16, step: 1, value: 4, unit: ' cells' }
  },
  actions: [
    { label: 'Reset', primary: true, action: () => reset() },
    { label: 'Rain', action: () => { rainT = 1.6; touch(); } },
    { label: 'Clear', action: () => { clearAll(); touch(); } }
  ]
});
const P = lab.params;

// ---- element palette on the stage ----
const TOOLS = [
  { key: 'water', el: WATER, label: 'Water', sw: '#2f7cf0', density: 0.55 },
  { key: 'lava', el: LAVA, label: 'Lava', sw: '#ff7a14', density: 0.55 },
  { key: 'wood', el: WOOD, label: 'Wood', sw: '#8a5530', density: 1 },
  { key: 'ash', el: ASH, label: 'Ash', sw: '#a3a19f', density: 0.45 },
  { key: 'seed', el: SEED, label: 'Seed', sw: '#b08a4a', density: 0.03 },
  { key: 'stone', el: STONE, label: 'Stone', sw: '#5b5a62', density: 0.45 },
  { key: 'erase', el: EMPTY, label: 'Eraser', sw: 'transparent', density: 1 }
];
let tool = TOOLS[0];
const toolBox = document.createElement('div');
toolBox.className = 'sand-tools'; toolBox.setAttribute('role', 'group'); toolBox.setAttribute('aria-label', 'Paint element');
TOOLS.forEach((t, k) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.innerHTML = `<i style="background:${t.sw};${t.el === EMPTY ? 'border:1px dashed var(--dim)' : ''}"></i>${t.label} <kbd>${k + 1}</kbd>`;
  b.addEventListener('click', () => pickTool(t));
  t.btn = b; toolBox.appendChild(b);
});
lab.stage.appendChild(toolBox);
function pickTool(t) { tool = t; TOOLS.forEach(u => u.btn.setAttribute('aria-pressed', u === t ? 'true' : 'false')); }
pickTool(tool);

// ---- canvas, layout, grid ----
const { canvas, ctx } = lab.canvas();
canvas.style.touchAction = 'none';
const PIECE_PATHS = LOGO_PIECES.map(piece => {
  const p = new Path2D();
  for (const { cmd, pts } of piece) {
    if (cmd === 'M') p.moveTo(...pts[0]);
    else if (cmd === 'L') p.lineTo(...pts[0]);
    else if (cmd === 'C') p.bezierCurveTo(...pts[0], ...pts[1], ...pts[2]);
    else p.closePath();
  }
  return p;
});
const PIECE_EL = [LAVA, WATER, WOOD];   // LOGO_PIECES order: left "<", right ">", middle zig

let dpr = 1, sq, fit, floorDev = 0, cd = 1, W = 0, H = 0, N = 0, offX = 0, offY = 0;
let type, shade, aux, life, stamp, hold, holdT;
let gcv, gctx, img, px, fadeCv, fadeCtx, glowCv, glowCtx, glowImg, gpx, glowA, glowB, gw = 0, gh = 0;

function geometry() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  sq = lab.square(); fit = fitLogo(sq);
  const ncd = Math.max(1, Math.round(sq.size * dpr / P.res));
  floorDev = Math.round(canvas.height - FLOOR_PAD * dpr);
  const nW = Math.ceil(canvas.width / ncd), nH = Math.ceil(floorDev / ncd);
  const changed = ncd !== cd || nW !== W || nH !== H;
  cd = ncd; W = nW; H = nH; N = W * H;
  offX = Math.floor((canvas.width - W * cd) / 2);
  offY = floorDev - H * cd;             // the floor row sits exactly on the floor line
  return changed;
}
function allocate() {
  type = new Uint8Array(N); shade = new Uint8Array(N); aux = new Uint8Array(N); life = new Uint16Array(N);
  stamp = new Uint8Array(N); hold = new Uint8Array(N); holdT = new Uint32Array(N);
  gcv = document.createElement('canvas'); gcv.width = W; gcv.height = H; gctx = gcv.getContext('2d');
  img = gctx.createImageData(W, H); px = new Uint32Array(img.data.buffer);
  fadeCv = document.createElement('canvas'); fadeCv.width = W; fadeCv.height = H; fadeCtx = fadeCv.getContext('2d');
  gw = Math.ceil(W / 4); gh = Math.ceil(H / 4);
  glowCv = document.createElement('canvas'); glowCv.width = gw; glowCv.height = gh; glowCtx = glowCv.getContext('2d');
  glowImg = glowCtx.createImageData(gw, gh); gpx = new Uint32Array(glowImg.data.buffer);
  glowA = new Uint16Array(gw * gh); glowB = new Uint16Array(gw * gh);
}

// ---- RNG: xorshift32, seeded per reset so a loop replays exactly (until you paint) ----
let rs = 1;
const rnd = () => { rs ^= rs << 13; rs ^= rs >>> 17; rs ^= rs << 5; return (rs >>> 0) / 4294967296; };
const rint = (a, b) => a + Math.floor(rnd() * (b - a + 1));
function reseed(n) { rs = (Math.imul(n | 0, 2654435761) ^ 0x5bd1e995) | 0 || 1; for (let i = 0; i < 8; i++) rnd(); }

// ---- the mark ----
function rasterLogo() {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const o = c.getContext('2d', { willReadFrequently: true });
  o.setTransform(dpr / cd, 0, 0, dpr / cd, -offX / cd, -offY / cd);
  o.translate(fit.cx, fit.cy); o.scale(fit.scale, fit.scale);
  o.globalCompositeOperation = 'lighter';
  ['#ff0000', '#00ff00', '#0000ff'].forEach((col, k) => { o.fillStyle = col; o.fill(PIECE_PATHS[k]); });
  const d = o.getImageData(0, 0, W, H).data, m = new Int8Array(N).fill(-1);
  for (let i = 0; i < N; i++) m[i] = d[i * 4] > 127 ? 0 : d[i * 4 + 1] > 127 ? 1 : d[i * 4 + 2] > 127 ? 2 : -1;
  return m;
}
// The mark's bar width, in logo units: the narrowest stroke that erases a whole piece is as wide as its bar.
const BAR = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 600;
  const o = c.getContext('2d', { willReadFrequently: true });
  const left = w => {
    o.setTransform(1, 0, 0, 1, 0, 0); o.clearRect(0, 0, 600, 600);
    o.setTransform(500, 0, 0, 500, 300, 300);
    o.fillStyle = '#fff'; o.fill(PIECE_PATHS[0]);
    o.globalCompositeOperation = 'destination-out'; o.lineWidth = w; o.lineJoin = 'round'; o.stroke(PIECE_PATHS[0]);
    o.globalCompositeOperation = 'source-over';
    const d = o.getImageData(0, 0, 600, 600).data;
    for (let i = 3; i < d.length; i += 4) if (d[i] > 127) return true;
    return false;
  };
  let lo = 0, hi = 0.5;
  for (let k = 0; k < 16; k++) { const m = (lo + hi) / 2; if (left(m)) lo = m; else hi = m; }
  return hi;
})();
// The smallest circle round the mark (logo units), by Badoiu–Clarkson: step toward the farthest point, shorter each time
const ENC = (() => {
  const pts = logoPolygons({ curveSegments: 16 }).flat();
  let cx = 0, cy = 0;
  const far = () => pts.reduce((b, q) => { const d = Math.hypot(q[0] - cx, q[1] - cy); return d > b.d ? { q, d } : b; }, { q: null, d: -1 });
  for (let k = 1; k <= 4000; k++) { const { q } = far(); cx += (q[0] - cx) / (k + 1); cy += (q[1] - cy) / (k + 1); }
  return { x: cx, y: cy, r: far().d };
})();
// Bedrock: fixed stone filling the whole box out to its edges, leaving a round basin for the mark. The basin is the
// smallest circle round the mark grown by the bedrock distance, so it never comes closer than a bar. It is STONE marked
// with aux FIXED: it never falls, nothing displaces it, and the eraser leaves it alone.
const FIXED = 1;
function rasterRing() {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const o = c.getContext('2d', { willReadFrequently: true });
  o.setTransform(dpr / cd, 0, 0, dpr / cd, -offX / cd, -offY / cd);
  o.translate(fit.cx, fit.cy); o.scale(fit.scale, fit.scale);
  o.save(); o.setTransform(1, 0, 0, 1, 0, 0); o.fillStyle = '#fff'; o.fillRect(0, 0, W, H); o.restore();
  o.globalCompositeOperation = 'destination-out';
  o.beginPath(); o.arc(ENC.x, ENC.y, ENC.r + P.ringGap * BAR, 0, 2 * Math.PI); o.fill();
  const d = o.getImageData(0, 0, W, H).data, m = new Uint8Array(N);
  for (let i = 0; i < N; i++) m[i] = d[i * 4 + 3] > 127 ? 1 : 0;

}
function paintLine(x0, y0, x1, y1) {
  const n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / Math.max(1, P.brush * 0.6)));
  for (let k = 0; k <= n; k++) paintAt(Math.round(x0 + (x1 - x0) * k / n), Math.round(y0 + (y1 - y0) * k / n));
  touch();
}
canvas.addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  const g = toGrid(e);
  if (fade) fade = null;
  paint.on = true; paint.id = e.pointerId; paint.x = g.x; paint.y = g.y;
  canvas.setPointerCapture(e.pointerId);
  paintLine(g.x, g.y, g.x, g.y);
  if (lab.calm) render();
});
canvas.addEventListener('pointermove', e => {
  if (!paint.on || e.pointerId !== paint.id) return;
  const g = toGrid(e);
  paintLine(paint.x, paint.y, g.x, g.y);
  paint.x = g.x; paint.y = g.y;
  if (lab.calm) render();
});
const stop = e => { if (paint.on && e.pointerId === paint.id) paint.on = false; };
canvas.addEventListener('pointerup', stop);
canvas.addEventListener('pointercancel', stop);
addEventListener('keydown', e => {
  if (e.target.closest?.('input, select, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = +e.key;
  if (k >= 1 && k <= TOOLS.length) pickTool(TOOLS[k - 1]);
  else if (e.key === '[') lab.set('brush', Math.max(1, P.brush - 1));
  else if (e.key === ']') lab.set('brush', Math.min(16, P.brush + 1));
});

// ---- wiring ----
lab.on('change', key => {
  if (key === 'res') rebuild();
  else if (key === 'seed' || key === 'thaw' || key === 'hold') reset();
  else if (key === 'ring' || key === 'ringGap' || key === 'fossils') {
    // swap the old bedrock for the new in place; anything it lands on is simply replaced
    for (let i = 0; i < N; i++) if (fixedAt(i)) { type[i] = EMPTY; aux[i] = 0; }
    fossilCache = null;
    placeRing(); render();
  }
  touch();
});
lab.on('palette', () => { buildColors(); render(); });
lab.on('resize', () => { if (!built) return; if (geometry()) rebuild(); else render(); });

buildColors();
rebuild();

let hudTick = 0, ms = 0;
function hud() {
  const c = n => counts[n];
  const flowers = c(ROOT), status = T < holdUntil ? `holding <b>${((holdUntil - T) / NOMINAL_HZ).toFixed(1)} s</b>` : T < thawDone ? '<b>thawing</b>' : quietT > 0.5 ? `settled <b>${quietT.toFixed(1)}/${P.quiet} s</b>` : 'running';
  lab.hud(`water <b>${c(WATER)}</b> · lava <b>${c(LAVA)}</b> · wood <b>${c(WOOD)}</b> · stone <b>${c(STONE)}</b> · ash <b>${c(ASH)}</b> · steam <b>${c(STEAM)}</b>` +
    ` · flowers <b>${flowers}</b>${c(FIRE) ? ` · fire <b>${c(FIRE)}</b>` : ''}<br>${status} · ${W}×${H} cells · <b>${ms.toFixed(2)} ms</b>`);
}
let paused = false;
lab.loop(dt => {
  if (paused) return;
  const t0 = performance.now();
  frame(dt);
  if (!lab.calm) fr++;
  render();
  ms = ms * 0.9 + (performance.now() - t0) * 0.1;
  if (++hudTick % 8 === 0) hud();
});
hud();

// test hooks: advance and draw without requestAnimationFrame
window.__lab = {
  step(n = 1) { for (let k = 0; k < n; k++) { frame(1 / 60); fr++; } render(); hud(); return this.state(); },
  ticks(n = 1) { for (let k = 0; k < n; k++) tick(); render(); hud(); return this.state(); },
  renderOnce() { render(); hud(); },
  reset: () => reset({ crossfade: false }),
  paint(el, x, y, r = P.brush) { const t = TOOLS.find(q => q.key === el) || TOOLS[0]; const prev = tool, pb = P.brush; tool = t; P.brush = r; paintAt(x, y); tool = prev; P.brush = pb; render(); },
  state() {
    const c = {}; const n = new Uint32Array(16); const sp = {};
    for (let i = 0; i < N; i++) { n[type[i]]++; if (type[i] === ROOT) { const nm = SPECIES[aux[i] >> 3].name; sp[nm] = (sp[nm] || 0) + 1; } }
    NAMES.forEach((nm, k) => { if (k && n[k]) c[nm] = n[k]; });
    return { T, W, H, cd, held: T < holdUntil, thawed: T > thawDone, quietT: +quietT.toFixed(2), actAvg: +actAvg.toFixed(2), counts: c, species: sp, ms: +ms.toFixed(2) };
  },
  grid: () => ({ W, H, type, aux, life }),
  gridCanvas: () => gcv,
  pause(on = true) { paused = on; },
  measure(frames = 60) { const t0 = performance.now(); for (let k = 0; k < frames; k++) { frame(1 / 60); fr++; render(); } return (performance.now() - t0) / frames; }
};
</script>
