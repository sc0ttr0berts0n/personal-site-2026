import { logoPolygons, logoShapes, LOGO_FILL, LOGO_DEPTH } from './shared/logo.js';

// Each palette is a filter set: the ramp runs from the hottest, densest gas to the faintest wisps.
const FILTERS = [
  { key: 'sho',     name: 'Hubble SHO',    bg: '#000000', grid: '#13120c', ink: '#fff7e0', colors: ['#fff4c8', '#ffb800', '#ff3d2e', '#00e0c8', '#0070ff'] },
  { key: 'hoo',     name: 'Hα + OIII',     bg: '#000000', grid: '#190d14', ink: '#ffeef5', colors: ['#ffffff', '#ff3d8b', '#e0002a', '#00e5ff', '#0050ff'] },
  { key: 'webb',    name: 'Webb NIRCam',   bg: '#020100', grid: '#1b120a', ink: '#fff2dc', colors: ['#fff0cc', '#ffa424', '#ff4a14', '#b04dff', '#3355ff'] },
  { key: 'chandra', name: 'Chandra X-ray', bg: '#00010a', grid: '#0b1328', ink: '#eaf6ff', colors: ['#ffffff', '#4df6ff', '#1a78ff', '#c23dff', '#6a00d8'] },
  { key: 'halpha',  name: 'Hydrogen α',    bg: '#040000', grid: '#220a0d', ink: '#fff0f0', colors: ['#fff0ec', '#ff5a3c', '#ff0a3c', '#d4006e', '#6a0070'] },
  { key: 'radio',   name: 'Radio',         bg: '#02000a', grid: '#160a26', ink: '#f6ecff', colors: ['#ffffff', '#fff200', '#ff2d7f', '#8a2cff', '#2a10ff'] }

const QUALITY = { low: [28, 0.45], medium: [40, 0.68], high: [60, 0.85], ultra: [90, 1] };

const lab = createLab({
  number: '05',
  title: 'Big Bang',
  blurb: 'A nebula churns inside the mark. Tap it to set off the bang, then orbit the shell of gas the blast wave lights up.',

  grid: false,
  params: {

    orbit:    { type: 'range', label: 'Orbit speed', min: 0, max: 30, step: 0.5, value: 7, unit: '°/s' },
    tilt:     { type: 'range', label: 'Orbit tilt', min: -45, max: 45, step: 1, value: 16, unit: '°' },
    time:     { type: 'range', label: 'Time scale', min: 0.1, max: 2, step: 0.05, value: 1, unit: '×' },
    quality:  { type: 'select', label: 'Quality (march steps · resolution)', value: 'medium', options: [['low', 'Low · 28 · 45%'], ['medium', 'Medium · 40 · 68%'], ['high', 'High · 60 · 85%'], ['ultra', 'Ultra · 90 · 100%']] },

// ---- world: the key square is 10 units, the mark is LOGO_FILL of that, face-on in the xy plane ----
const SQ = 10, LOGO_W = SQ * LOGO_FILL, DEPTH = LOGO_DEPTH * LOGO_W, FOV = 22;
const SB = 0.9;                 // seconds of build-up before the bang
const ZB = -10;                 // back of the nebula volume

const { canvas } = lab.canvas({ context: 'none' });
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true }); }
catch (e) { lab.hud('WebGL is not available in this browser.'); throw e; }
renderer.outputColorSpace = THREE.SRGBColorSpace;

function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

// ---- 3D noise texture: four independent channels of smooth, tileable value noise ----
function makeNoise(N = 64, L = 16) {
  const rnd = mulberry32(5);
  const lat = [0, 1, 2, 3].map(() => Float32Array.from({ length: L * L * L }, rnd));
  const data = new Uint8Array(N * N * N * 4);
  const q = t => t * t * t * (t * (t * 6 - 15) + 10);
  const at = (g, x, y, z) => g[((z % L) * L + (y % L)) * L + (x % L)];
  for (let z = 0; z < N; z++) for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const fx = x / N * L, fy = y / N * L, fz = z / N * L;
    const ix = Math.floor(fx), iy = Math.floor(fy), iz = Math.floor(fz);
    const u = q(fx - ix), v = q(fy - iy), w = q(fz - iz);
    const o = ((z * N + y) * N + x) * 4;
    for (let c = 0; c < 4; c++) {
      const g = lat[c];
      const a = at(g, ix, iy, iz) + (at(g, ix + 1, iy, iz) - at(g, ix, iy, iz)) * u;
      const b = at(g, ix, iy + 1, iz) + (at(g, ix + 1, iy + 1, iz) - at(g, ix, iy + 1, iz)) * u;
      const cc = at(g, ix, iy, iz + 1) + (at(g, ix + 1, iy, iz + 1) - at(g, ix, iy, iz + 1)) * u;
      const d = at(g, ix, iy + 1, iz + 1) + (at(g, ix + 1, iy + 1, iz + 1) - at(g, ix, iy + 1, iz + 1)) * u;
      const ab = a + (b - a) * v, cd = cc + (d - cc) * v;
      data[o + c] = Math.round((ab + (cd - ab) * w) * 255);
    }
  }
  const tex = new THREE.Data3DTexture(data, N, N, N);
  tex.format = THREE.RGBAFormat; tex.type = THREE.UnsignedByteType;
  tex.minFilter = tex.magFilter = THREE.LinearFilter;
  tex.wrapS = tex.wrapT = tex.wrapR = THREE.RepeatWrapping;
  tex.unpackAlignment = 1; tex.needsUpdate = true;
  return tex;
}
const noiseTex = makeNoise();

// ---- signed distance field of the mark in world units (y up), negative inside ----
const POLYS = logoPolygons({ curveSegments: 10 }).map(p => p.map(([x, y]) => [x * LOGO_W, -y * LOGO_W]));
const SDF_B = 4, SDF_N = 320;
function pip(px, py, poly) {
  let c = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [ax, ay] = poly[i], [bx, by] = poly[j];
    if ((ay > py) !== (by > py) && px < (bx - ax) * (py - ay) / (by - ay) + ax) c = !c;
  }
  return c;
}
const sdfData = new Float32Array(SDF_N * SDF_N);
(function buildSdf() {
  const segs = POLYS.flatMap(p => p.map((a, i) => [a, p[(i + 1) % p.length]]));
  for (let j = 0; j < SDF_N; j++) for (let i = 0; i < SDF_N; i++) {
    const x = -SDF_B + (i + 0.5) / SDF_N * 2 * SDF_B, y = -SDF_B + (j + 0.5) / SDF_N * 2 * SDF_B;
    let m = Infinity;
    for (const [[ax, ay], [bx, by]] of segs) {
      const dx = bx - ax, dy = by - ay;
      const t = Math.max(0, Math.min(1, ((x - ax) * dx + (y - ay) * dy) / (dx * dx + dy * dy)));
      const ex = x - ax - dx * t, ey = y - ay - dy * t, d = ex * ex + ey * ey;
      if (d < m) m = d;
    }
    const inside = POLYS.some(p => pip(x, y, p));
    sdfData[j * SDF_N + i] = (inside ? -1 : 1) * Math.sqrt(m);
  }
})();
const sdfTex = new THREE.DataTexture(Uint16Array.from(sdfData, v => THREE.DataUtils.toHalfFloat(v)), SDF_N, SDF_N, THREE.RedFormat, THREE.HalfFloatType);
sdfTex.minFilter = sdfTex.magFilter = THREE.LinearFilter;
sdfTex.needsUpdate = true;
function sdfAt(x, y) {
  const cx = Math.max(-SDF_B, Math.min(SDF_B, x)), cy = Math.max(-SDF_B, Math.min(SDF_B, y));
  const i = Math.min(SDF_N - 1, Math.floor((cx + SDF_B) / (2 * SDF_B) * SDF_N));
  const j = Math.min(SDF_N - 1, Math.floor((cy + SDF_B) / (2 * SDF_B) * SDF_N));
  return sdfData[j * SDF_N + i] + Math.hypot(x - cx, y - cy);
}

// ---- shared GLSL ----
const GLSL_COMMON = /* glsl */`
precision highp sampler3D;
uniform sampler3D uNoise;
uniform sampler2D uSdf;
uniform float uB;
uniform mat4 uInvVP;
uniform vec3 uCam;
uniform vec3 uC0, uC1, uC2, uC3, uC4;
varying vec2 vUv;
float sdf(vec2 p) {
  vec2 c = clamp(p, -uB, uB);
  return texture2D(uSdf, (c + uB) / (2.0 * uB)).r + length(p - c);
}
vec3 pal(float f) {
  f = clamp(f, 0.0, 1.0) * 4.0;
  if (f < 1.0) return mix(uC0, uC1, f);
  if (f < 2.0) return mix(uC1, uC2, f - 1.0);
  if (f < 3.0) return mix(uC2, uC3, f - 2.0);
  return mix(uC3, uC4, f - 3.0);
}
vec3 rayDir(vec2 uv) {
  vec4 w = uInvVP * vec4(uv * 2.0 - 1.0, 1.0, 1.0);
  return normalize(w.xyz / w.w - uCam);
}`;
const QUAD_VERT = /* glsl */`varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;

const shared = {
  uNoise: { value: noiseTex }, uSdf: { value: sdfTex }, uB: { value: SDF_B },
  uInvVP: { value: new THREE.Matrix4() }, uCam: { value: new THREE.Vector3() },
  uC0: { value: new THREE.Color() }, uC1: { value: new THREE.Color() }, uC2: { value: new THREE.Color() },
  uC3: { value: new THREE.Color() }, uC4: { value: new THREE.Color() },
  uTime: { value: 0 }, uR: { value: 0 }, uA: { value: 1 }
};

// ---- pass 1: raymarched nebula into a reduced-resolution target ----
const rtOpts = { type: THREE.HalfFloatType, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false };
const nebRT = new THREE.WebGLRenderTarget(4, 4, rtOpts);
// Temporal accumulation: each frame marches with a fresh jitter and blends into a short history,
// so the march noise averages out instead of reading as grain. History resets on fast changes.
const hist = [new THREE.WebGLRenderTarget(4, 4, rtOpts), new THREE.WebGLRenderTarget(4, 4, rtOpts)];
let histI = 0, histReset = true;
const accMat = new THREE.ShaderMaterial({
  uniforms: { uCur: { value: nebRT.texture }, uPrev: { value: hist[1].texture }, uK: { value: 1 },
    uInvVP: { value: new THREE.Matrix4() }, uPrevVP: { value: new THREE.Matrix4() }, uCam: { value: new THREE.Vector3() }, uTarget: { value: new THREE.Vector3() } },
  vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  // reproject: find where this pixel's ray crosses the plane through the orbit target, look that
  // point up in last frame's view, and clamp the history to this frame's neighbourhood
  fragmentShader: `uniform sampler2D uCur, uPrev; uniform float uK; uniform mat4 uInvVP, uPrevVP; uniform vec3 uCam, uTarget; varying vec2 vUv;
    void main() {
      vec4 w = uInvVP * vec4(vUv * 2.0 - 1.0, 1.0, 1.0);
      vec3 rd = normalize(w.xyz / w.w - uCam), fwd = normalize(uTarget - uCam);
      vec3 P = uCam + rd * dot(uTarget - uCam, fwd) / max(dot(rd, fwd), 1e-3);
      vec4 c = uPrevVP * vec4(P, 1.0);
      vec2 puv = c.xy / c.w * 0.5 + 0.5;
      vec2 tx = 1.0 / vec2(textureSize(uCur, 0));
      vec4 cur = texture2D(uCur, vUv);
      vec4 a = texture2D(uCur, vUv + vec2(tx.x, 0.0)), b = texture2D(uCur, vUv - vec2(tx.x, 0.0));
      vec4 d = texture2D(uCur, vUv + vec2(0.0, tx.y)), e = texture2D(uCur, vUv - vec2(0.0, tx.y));
      vec4 lo = min(cur, min(min(a, b), min(d, e))), hi = max(cur, max(max(a, b), max(d, e)));
      vec4 prev = clamp(texture2D(uPrev, puv), lo - (hi - lo) * 0.5, hi + (hi - lo) * 0.5);
      bool ok = c.w > 0.0 && all(greaterThan(puv, vec2(0.0))) && all(lessThan(puv, vec2(1.0)));
      gl_FragColor = mix(prev, cur, ok ? uK : 1.0);
    }`
});
const accScene = new THREE.Scene();
const accQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), accMat);
accQuad.frustumCulled = false;
accScene.add(accQuad);
const nebMat = new THREE.ShaderMaterial({
  uniforms: { ...shared, uDensity: { value: 1 }, uWarp: { value: 1 }, uHeat: { value: 0 }, uZF: { value: 0 }, uZB: { value: ZB }, uBoost: { value: 1 }, uOct: { value: 5 }, uSteps: { value: 44 }, uSeed: { value: 0 },
    uCloudW: { value: 1 }, uShellW: { value: 0 }, uRsh: { value: 0 }, uLobe: { value: new THREE.Vector3(0.25, -0.9, 0.35).normalize() } },
  vertexShader: QUAD_VERT,
  fragmentShader: /* glsl */`
${GLSL_COMMON}
uniform float uTime, uR, uA, uDensity, uWarp, uHeat, uZF, uZB, uBoost;
uniform float uCloudW, uShellW, uRsh;
uniform vec3 uLobe;
uniform int uOct, uSteps;
uniform float uSeed;
const mat3 ROT = mat3(0.00, 0.80, 0.60, -0.80, 0.36, -0.48, -0.60, -0.48, 0.64);
// fractional Brownian motion: each octave doubles the frequency and shrinks the amplitude.
// The broad octaves live in comoving space and stretch with a; the fine ones live in
// physical space, so small-scale structure keeps re-forming instead of blurring out.
float fbm(vec3 pc, vec3 pp) {
  float s = 0.0, a = 0.5, n = 0.0;
  for (int i = 0; i < 6; i++) {
    if (i >= uOct - 1) break;
    s += a * (texture(uNoise, i < 1 ? pc : pp).r - 0.5);
    n += a; pc = ROT * pc * 2.03; pp = ROT * pp * 2.03; a *= 0.58;
  }
  return n > 0.0 ? s / n : 0.0;
}
// turbulent cloud: emission (rgb) and extinction (a) at p
vec4 cloud(vec3 p) {
  vec3 drift = vec3(0.013 * uTime, 0.0, 0.006 * uTime);
  vec3 q = p / uA * 0.06 + drift;                 // comoving: dividing by a stretches every feature at once
  vec3 w = texture(uNoise, q * 0.55 + vec3(0.37, 0.11, 0.004 * uTime)).gba - 0.5;
  q += w * uWarp * 0.09;
  vec3 qp = q + (p - p / uA) * 0.06;            // the same point in physical space (equals q at rest)
  float region = texture(uNoise, q * 0.35 + vec3(0.7)).a - 0.5;
  float n0 = texture(uNoise, q).r - 0.5;
  float n = uOct > 1 ? n0 * 0.58 + fbm(ROT * q * 2.03, ROT * qp * 2.03) * 0.42 : n0 * 0.8;
  float env = smoothstep(uZB, uZB + 5.0, p.z) * (1.0 - smoothstep(uZF - 0.8, uZF, p.z));
  env *= smoothstep(0.44, 0.58, texture(uNoise, q * 0.3 + vec3(0.13, 0.71, 0.37)).r + n * 0.25);
  float d = smoothstep(0.09, 0.3, n);
  float fe = (n - 0.1) / 0.035;
  float fil = exp(-fe * fe);                      // ionization fronts
  d = (d * d * (3.0 - 2.0 * d) + fil * 0.55) * env;
  float dn = texture(uNoise, ROT * qp * 2.4 + vec3(0.5)).g + 0.5 * texture(uNoise, ROT * ROT * qp * 5.1 + vec3(0.2)).b - 0.75;
  float lane = dn / 0.03;
  float dust = (exp(-lane * lane) * 0.7 + smoothstep(0.24, 0.4, dn + n * 0.3) * 0.6) * env;
  float sp = smoothstep(-0.06, 0.06, region + 0.07 + (texture(uNoise, q * 1.3).a - 0.5) * 0.25);
  float f = mix(0.32, 0.8, sp) - smoothstep(0.22, 0.36, n) * mix(0.3, 0.7, sp) - uHeat;
  vec3 c = pal(f) * (1.0 + fil * 0.8);

}
float shellTh() { return 0.016 * uRsh + 0.008; }
float lumpR(vec3 n) {
  vec3 sw = vec3(0.0013, 0.0007, 0.001) * uTime;
  float lump = texture(uNoise, n * 0.09 + vec3(0.3, 0.1, 0.6) + sw).r - 0.5;
  float lobe = pow(max(0.0, dot(n, uLobe)), 5.0);                  // a blowout, like the Loop's southern break
  return uRsh * (1.0 + 0.34 * lump + 0.3 * lobe);
}
// how far p is from the band the shell can occupy (negative inside it), for skipping empty space
float shellGap(vec3 p) {
  float r = length(p);
  return abs(r - lumpR(p / max(r, 1e-3))) - uRsh * 0.12 - 3.0 * shellTh();
}
// supernova-remnant shell: a thin, wrinkled, lumpy sphere. A wrinkled sheet seen edge-on at the
// limb stacks into bright braided filaments; seen face-on it is faint and wispy.
vec4 shell(vec3 p) {
  float r = length(p);
  vec3 n = p / max(r, 1e-3);
  vec3 sw = vec3(0.0013, 0.0007, 0.001) * uTime;
  float rr = lumpR(n);
  float wr = texture(uNoise, n * 0.45 + vec3(0.7) + sw).g - 0.5;
  float wr2 = texture(uNoise, n * 1.15 + vec3(1.3, 0.2, 0.5) - sw).b - 0.5;
  rr += uRsh * (0.09 * wr + 0.04 * wr2);                          // wrinkles in the sheet
  float th = shellTh();
  float s = (r - rr) / th;
  float cover = smoothstep(0.42, 0.64, texture(uNoise, n * 0.2 + vec3(0.9, 0.4, 0.1) + sw).a + 0.3 * wr);
  float rn = texture(uNoise, n * 0.6 + vec3(0.2, 0.8, 0.4) + sw * 2.0).r + 0.5 * texture(uNoise, ROT * n * 1.4 + vec3(0.6, 0.1, 0.9)).r - 0.75;
  float ridge = 1.0 - min(1.0, abs(rn) * 3.0);   // ropes where the noise crosses zero
  float r2 = ridge * ridge;
  float fil = cover * (0.1 + 0.9 * r2 * r2);
  // OIII sits just outside the shock front, H-alpha and SII just inside it
  float so = s - 0.8, si = s + 0.8;
  // and the two gases also favour different patches of the sky, so face-on they do not blend to grey
  float side = smoothstep(-0.08, 0.08, texture(uNoise, n * 0.32 + vec3(0.5, 0.9, 0.2) + sw).g - 0.5);
  float cool = exp(-so * so) * fil * (0.2 + 0.8 * side), warm = exp(-si * si) * fil * (1.0 - 0.8 * side);
  float inner = 0.035 * smoothstep(0.55, 0.75, texture(uNoise, p * 0.07 + vec3(0.5)).r) * (1.0 - smoothstep(rr * 0.85, rr, r));
  vec3 e = (pal(0.8 - uHeat) * cool * 1.3 + pal(0.3 - uHeat) * (warm + inner)) * 2.8;
  return vec4(e, (cool + warm) * 0.12);
}
vec2 slab(vec3 ro, vec3 rd) {
  if (abs(rd.z) < 1e-4) return (ro.z > uZB && ro.z < uZF) ? vec2(0.0, 40.0) : vec2(1.0, 0.0);
  float ta = (uZB - ro.z) / rd.z, tb = (uZF - ro.z) / rd.z;
  float t0 = max(0.0, min(ta, tb));
  return vec2(t0, min(max(ta, tb), t0 + 40.0));
}
vec2 sphere(vec3 ro, vec3 rd, float R) {
  float b = dot(ro, rd), c = dot(ro, ro) - R * R, h = b * b - c;
  if (h < 0.0) return vec2(1.0, 0.0);
  h = sqrt(h);
  return vec2(max(0.0, -b - h), -b + h);
}
void main() {
  vec3 ro = uCam, rd = rayDir(vUv);
  // the mark is a window at z = 0: skip rays that cannot see through it yet
  float th = -ro.z / rd.z;
  if (uR < 30.0 && th > 0.0 && sdf(ro.xy + rd.xy * th) - uR > 0.3 + uR * 0.4) { gl_FragColor = vec4(0.0); return; }
  vec2 iv = vec2(1e9, -1e9);

      col.set([r * 0.3, g * 0.3, b * 0.3, r, g, b], n * 6);
      n++;
    }
  }
  sparkGeo.instanceCount = n;
  sparkPos.needsUpdate = sparkCol.needsUpdate = true;
}
function smooth(e0, e1, x) { const t = Math.max(0, Math.min(1, (x - e0) / (e1 - e0))); return t * t * (3 - 2 * t); }

let lastS = 0;
const prevVP = new THREE.Matrix4();
function render() {
  renderer.setRenderTarget(nebRT);
  renderer.render(nebScene, nebCam);
  // no history through the eruption, during rewind, or after a jump in time
  const fast = histReset || mode === 'rewind' || Math.abs(S - lastS) > 0.25 || (state.tau > -0.2 && state.tau < 1.6);
  lastS = S; histReset = false;
  const au = accMat.uniforms;
  au.uK.value = fast ? 1 : 0.3;
  au.uInvVP.value.copy(shared.uInvVP.value); au.uCam.value.copy(camera.position); au.uTarget.value.copy(orbitTarget);
  au.uPrevVP.value.copy(prevVP);
  prevVP.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  accMat.uniforms.uPrev.value = hist[histI ^ 1].texture;
  renderer.setRenderTarget(hist[histI]);
  renderer.render(accScene, nebCam);
  compMat.uniforms.uNeb.value = hist[histI].texture;
  histI ^= 1;
  renderer.setRenderTarget(null);
  composer.render();
}

let hudTick = 0;
function hud() {
  const { a, tau, Rs } = state;
  const T = (1 / a).toFixed(2);
  if (mode === 'rest') lab.hud(`at rest · scale factor a <b>1.00</b> · ${lab.params.octaves} octaves of fBm · tap the mark`);
  else if (tau < 0) lab.hud(`t <b>${tau.toFixed(2)} s</b> · pressure building`);
  else if (state.isShell) {
    // chord through a shell of radius R and thickness w: grazing 2√(2Rw), face-on 2w, so the rim is √(2R/w) times brighter
    const w = 2 * (0.016 * state.Rsh + 0.008) * 2.5, limb = Math.sqrt(2 * state.Rsh / w);
    lab.hud(`${mode === 'rewind' ? 'rewinding · ' : ''}t <b>+${tau.toFixed(2)} s</b> · shell r <b>${state.Rsh.toFixed(2)} u</b> · grazing path ≈ <b>${limb.toFixed(1)}×</b> face-on · scale factor a <b>${a.toFixed(2)}</b>`);
  } else lab.hud(`${mode === 'rewind' ? 'rewinding · ' : ''}t <b>+${tau.toFixed(2)} s</b> · scale factor a <b>${a.toFixed(2)}</b> · temperature ∝ 1/a <b>${T}</b> · star spacing <b>×${a.toFixed(2)}</b> · shock r <b>${Rs.toFixed(1)} u</b>`);
}

window.__lab = {
  renderOnce(t) { if (t !== undefined) churn = t; update(0); render(); hud(); },
  // seek(seconds since the tap, yawDegrees?) puts the orbit where auto-play would have it, or at yawDegrees
  seek(seconds, yawDeg) {
    S = Math.max(0, seconds); mode = S > 0 ? 'play' : 'rest'; idle = 0; resetOrbit();
    if (yawDeg !== undefined) dragYaw = yawDeg * Math.PI / 180;
    else if (!lab.calm) { let g = 0; for (let x = 0; x < S - SB; x += 0.01) g += smooth(0.5, 3.5, x) * 0.01; yaw = g * lab.params.orbit * Math.PI / 180; }
    update(0); render(); hud();
  },
  state: () => ({ mode, S, ...state })
};

lab.loop(dt => {
  update(dt);
  render();
  if (++hudTick % 6 === 0) hud();
});
</script>
