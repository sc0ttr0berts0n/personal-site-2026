<script type="module">
import * as pl from 'https://cdn.jsdelivr.net/npm/planck@1.4.3/dist/planck.mjs';
import { createLab } from './shared/lab.js';
import { LOGO_PIECES, LOGO_FILL, logoPolygons, fitLogo } from './shared/logo.js';
import { ramp, hex } from './shared/palettes.js';

const Vec2 = pl.Vec2;

// ---- units: logo units (1 = one logo width, y down). The board is the key square, ±HS around the mark. ----
const MM = 400;                 // the mark is 40 cm wide, so 1 logo unit = 400 mm
const S = 40;                   // solver units per logo unit: a 5 mm ball is 0.5 solver units, which Box2D likes
const H = 1 / 120;              // fixed physics step, s
const HS = 0.5 / LOGO_FILL;     // half the key square, logo units
const DROP_Y = -HS + 0.03;      // balls enter here
const PEG_TOP = -HS + 0.075;    // no pegs above this, so the drop line stays clear
const BIN_H = 0.16;             // bins along the bottom, about this tall
const IDLE = 2.2;               // s of no input before the board feeds itself

// ---- the mark's lattice (derivation shared with maze.html) ----
// Every straight edge of the mark runs along one of two directions (±42.8°, an 85.6° apex).
// Read both from the path data; lattice point = s·A + t·B. An edge along A has constant t, along B constant s.
const MARK = (() => {
  const edges = [];
  LOGO_PIECES.forEach((piece, k) => {
    let cur = null, start = null;
    for (const { cmd, pts } of piece) {
      if (cmd === 'M') cur = start = pts[0];
      else if (cmd === 'L') { edges.push({ k, p: cur, q: pts[0] }); cur = pts[0]; }
      else if (cmd === 'C') cur = pts[2];
      else if (cmd === 'Z') { if (Math.hypot(cur[0] - start[0], cur[1] - start[1]) > 1e-9) edges.push({ k, p: cur, q: start }); cur = start; }
    }
  });
  // two direction families, each axis the length-weighted mean of its edges
  const ang = e => { let a = Math.atan2(e.q[1] - e.p[1], e.q[0] - e.p[0]); return a < 0 ? a + Math.PI : a; };
  const ref = ang(edges[0]);
  const near = a => Math.min(Math.abs(a - ref), Math.PI - Math.abs(a - ref)) < 0.35;
  const sum = [[0, 0], [0, 0]];
  for (const e of edges) {
    e.fam = near(ang(e)) ? 0 : 1;
    let dx = e.q[0] - e.p[0], dy = e.q[1] - e.p[1];
    if (dx < 0) { dx = -dx; dy = -dy; }
    sum[e.fam][0] += dx; sum[e.fam][1] += dy;
  }
  let [A, B] = sum.map(([x, y]) => { const l = Math.hypot(x, y); return [x / l, y / l]; });
  if (A[1] > B[1]) { [A, B] = [B, A]; for (const e of edges) e.fam ^= 1; }   // A runs up-right, B down-right
  const det = A[0] * B[1] - A[1] * B[0];
  const toST = (x, y) => [(x * B[1] - y * B[0]) / det, (A[0] * y - A[1] * x) / det];
  const toXY = (s, t) => [s * A[0] + t * B[0], s * A[1] + t * B[1]];
  // where the edges sit in lattice coordinates
  const sv = [], tv = [];
  for (const e of edges) {
    const a = toST(...e.p), b = toST(...e.q);
    e.pos = e.fam === 0 ? (a[1] + b[1]) / 2 : (a[0] + b[0]) / 2;
    (e.fam === 0 ? tv : sv).push(e.pos);
  }
  const dedupe = v => v.sort((a, b) => a - b).filter((x, i, a) => i === 0 || x - a[i - 1] > 1e-5);
  const s = dedupe(sv), t = dedupe(tv);
  // the bands repeat as band, gap, band, gap…: the gap is the smallest spacing, the band the next size up
  const diffs = [s, t].flatMap(v => v.slice(1).map((x, i) => x - v[i])).sort((a, b) => a - b);
  const gap = diffs[0], band = diffs.find(x => x > 2 * gap), period = gap + band;
  // Band centre lines: each arm is a pair of long edges one band apart (short caps ignored).
  const len = e => Math.hypot(e.q[0] - e.p[0], e.q[1] - e.p[1]);
  const centres = fam => {
    const v = dedupe(edges.filter(e => e.fam === fam && len(e) > 1.5 * band).map(e => e.pos));
    return v.filter(a => v.some(b => Math.abs(b - a - band) < 1e-3)).map(a => a + band / 2);
  };
  const sc = centres(1), tc = centres(0);
  // The mark is drawn on a grid of period/9 (7.7 mm: 7 per band, 2 per gap). Along s the bands repeat every period,
  // but along t the zig's lower arm sits a third of a period out of step with its upper arm. So the largest lattice
  // step that holds every band centre in the same phase is a third of a period: the cell (23.2 mm).
  const fits = Q => [sc, tc].every(c => c.every(x => { const r = (x - c[0]) / Q; return Math.abs(r - Math.round(r)) * Q < 0.004; }));
  let steps = 1;
  while (steps < 12 && !fits(period / steps)) steps++;
  return { A, B, toST, toXY, s0: s[0], t0: t[0], gap, band, period, sc: sc[0], tc: tc[0], steps, cell: period / steps, sin: Math.abs(det),
    apexDeg: Math.acos(A[0] * B[0] + A[1] * B[1]) * 180 / Math.PI, slopeDeg: Math.atan2(-A[1], A[0]) * 180 / Math.PI };
})();

const lab = createLab({
  number: '08',
  title: 'Pachinko',
  blurb: 'A Galton board everywhere the mark isn’t, cut along the mark’s own angles. Tap to drop a ball or hold to pour, and watch the bins lean toward a bell curve.',
  teaches: 'Canvas 2D with planck.js physics for the balls. Every peg is placed from the logo’s geometry, so the board fits the mark exactly. Pour enough balls and the bins lean toward a bell curve, with a dent where the mark casts its shadow.',
  hint: 'tap to drop at that x · hold to pour<br>mark = 40 cm wide',
  feed: { touch: 'hold', hint: 'tap to drop · hold to pour' },
  palettes: ['cmy', 'spectrum', 'synthwave', 'ember', 'reef', 'aurora', 'ultraviolet', 'gold'],
  defaultPalette: 'cmy',
  grid: false,                      // the pegs are the grid here; the bench grid behind a 45° dot screen only beats against it
  params: {
    board:      { type: 'heading', label: 'Board' },
    pitch:      { type: 'range', label: 'Peg pitch', min: MARK.steps, max: 3 * MARK.steps, step: MARK.steps, value: 2 * MARK.steps, format: v => `${(MARK.period / v * MM).toFixed(1)} mm · ${v} per band`, unit: '' },
    pegRadius:  { type: 'range', label: 'Peg radius', min: 0.8, max: 4, step: 0.1, value: 1.2, unit: ' mm' },
    clearance:  { type: 'range', label: 'Clearance from the mark', min: 0, max: 30, step: 0.5, value: 12, unit: ' mm' },
    incline:    { type: 'range', label: 'Board incline θ', min: 5, max: 90, step: 1, value: 30, unit: '°' },
    ballsHead:  { type: 'heading', label: 'Balls' },
    ballRadius: { type: 'range', label: 'Ball radius', min: 3, max: 9, step: 0.25, value: 4, unit: ' mm' },
    restitution:{ type: 'range', label: 'Restitution', min: 0, max: 0.95, step: 0.05, value: 0.5 },
    friction:   { type: 'range', label: 'Friction μ', min: 0, max: 1, step: 0.05, value: 0.1 },
    rate:       { type: 'range', label: 'Drop rate', min: 1, max: 30, step: 1, value: 6, unit: ' balls/s' },
    cap:        { type: 'range', label: 'Balls in play, max', min: 20, max: 400, step: 10, value: 200 },
    look:       { type: 'heading', label: 'Look' },
    glow:       { type: 'range', label: 'Halftone glow', min: 0, max: 1, step: 0.05, value: 0.85 },
    reach:      { type: 'range', label: 'Glow reach', min: 20, max: 200, step: 5, value: 70, unit: ' mm' },
    ballLight:  { type: 'range', label: 'Ball light', min: 0, max: 1, step: 0.05, value: 0.6 },
    flash:      { type: 'range', label: 'Peg flash', min: 0, max: 1.5, step: 0.05, value: 0.5, unit: ' s' },
    trails:     { type: 'toggle', label: 'Motion trails', value: true },
    tint:       { type: 'toggle', label: 'Tint balls by drop point', value: true },
    lattice:    { type: 'toggle', label: 'Show lattice lines', value: false },
    counts:     { type: 'toggle', label: 'Bin counts', value: true }
  },
  actions: [
    { label: 'Clear', primary: true, action: () => clear() },
    { label: 'Drop ball', action: () => drop(gauss() * 0.15) },
    { label: 'Pour 100', action: () => { burst += 100; idleT = 0; } }
  ]
});
const P = lab.params;

// ---- the mark: drawing paths, physics parts, distance field for the pegs ----
const PIECE_PATHS = LOGO_PIECES.map(piece => {
  const p = new Path2D();
  for (const { cmd, pts } of piece) {
    if (cmd === 'M') p.moveTo(...pts[0]);
    else if (cmd === 'L') p.lineTo(...pts[0]);
    else if (cmd === 'C') p.bezierCurveTo(...pts[0], ...pts[1], ...pts[2]);
    else p.closePath();
  }
  return p;
});
const PIECE_T = [0.08, 0.92, 0.5];   // left "<", right ">", middle zig: coloured left to right, as in Knockout

// convex decomposition (from knockout.html): ear clipping, then Hertel–Mehlhorn merging
const turn = (a, b, c) => (b[0] - a[0]) * (c[1] - b[1]) - (b[1] - a[1]) * (c[0] - b[0]);
const edgeFn = (a, b, p) => (b[0] - a[0]) * (p[1] - a[1]) - (b[1] - a[1]) * (p[0] - a[0]);
const signedArea = p => p.reduce((s, a, i) => { const b = p[(i + 1) % p.length]; return s + a[0] * b[1] - b[0] * a[1]; }, 0) / 2;
function cleanPoly(poly) {
  const p = poly.slice();
  for (let changed = true; changed;) {
    changed = false;
    for (let i = 0; i < p.length; i++) {
      const a = p[(i + p.length - 1) % p.length], b = p[i], c = p[(i + 1) % p.length];
      if (Math.abs(turn(a, b, c)) < 1e-10 || Math.hypot(b[0] - a[0], b[1] - a[1]) < 1e-5) { p.splice(i, 1); changed = true; break; }
    }
  }
  return p;
}
function decompose(input) {
  const poly = cleanPoly(input), sg = Math.sign(signedArea(poly));
  const idx = poly.map((_, i) => i), tris = [];
  const angle = (a, b, c) => { const u = [a[0] - b[0], a[1] - b[1]], v = [c[0] - b[0], c[1] - b[1]]; return Math.acos(Math.max(-1, Math.min(1, (u[0] * v[0] + u[1] * v[1]) / Math.hypot(...u) / Math.hypot(...v)))); };
  while (idx.length > 3) {
    let best = -1, bestQ = -1;
    for (let i = 0; i < idx.length; i++) {
      const ia = idx[(i + idx.length - 1) % idx.length], ib = idx[i], ic = idx[(i + 1) % idx.length];
      const a = poly[ia], b = poly[ib], c = poly[ic];
      if (sg * turn(a, b, c) <= 1e-12) continue;
      let ok = true;
      for (const j of idx) {
        if (j === ia || j === ib || j === ic) continue;
        const p = poly[j];
        if (sg * edgeFn(a, b, p) >= -1e-12 && sg * edgeFn(b, c, p) >= -1e-12 && sg * edgeFn(c, a, p) >= -1e-12) { ok = false; break; }
      }
      if (!ok) continue;
      const q = Math.min(angle(c, a, b), angle(a, b, c), angle(b, c, a));
      if (q > bestQ) { bestQ = q; best = i; }
    }
    if (best < 0) best = 0;
    const n = idx.length;
    tris.push([idx[(best + n - 1) % n], idx[best], idx[(best + 1) % n]]);
    idx.splice(best, 1);
  }
  tris.push(idx.slice());
  const parts = tris;
  const convex = ix => ix.every((v, i) => sg * turn(poly[ix[(i + ix.length - 1) % ix.length]], poly[v], poly[ix[(i + 1) % ix.length]]) >= -1e-12);
  for (let again = true; again;) {
    again = false;
    for (let i = 0; i < parts.length && !again; i++) for (let j = i + 1; j < parts.length && !again; j++) {
      const A = parts[i], B = parts[j];
      for (let k = 0; k < A.length && !again; k++) {
        const u = A[k], v = A[(k + 1) % A.length];
        const m = B.findIndex((x, q) => x === v && B[(q + 1) % B.length] === u);
        if (m < 0) continue;
        const a2 = A.map((_, s) => A[(k + 1 + s) % A.length]);
        const b2 = B.map((_, s) => B[(m + 1 + s) % B.length]);
        const M = a2.concat(b2.slice(1, -1));
        if (M.length <= 8 && convex(M)) { parts[i] = M; parts.splice(j, 1); again = true; }
      }
    }
  }
  return parts.map(ix => ix.map(n => poly[n]));
}
const CONVEX = logoPolygons({ curveSegments: 3 }).map(decompose);

// distance from a point to a set of polygons (0 inside) and which polygon is nearest; the mark uses finely split outlines
const OUTLINES = logoPolygons({ curveSegments: 10 });
function polyDist(polys, x, y) {
  let best = Infinity, piece = -1;
  polys.forEach((poly, k) => {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const [ax, ay] = poly[i], [bx, by] = poly[j];
      if ((ay > y) !== (by > y) && x < (bx - ax) * (y - ay) / (by - ay) + ax) inside = !inside;
      const dx = bx - ax, dy = by - ay, u = Math.max(0, Math.min(1, ((x - ax) * dx + (y - ay) * dy) / (dx * dx + dy * dy)));
      const d = Math.hypot(x - ax - u * dx, y - ay - u * dy);
      if (d < best) { best = d; piece = k; }
    }
    if (inside) { best = -1; piece = k; }
  });
  return { d: Math.max(0, best), k: piece };
}

// ---- world ----
let world, boardBody = null, balls = [];
let pegs = [], dividers = [], edges = [], counts = [], shown = [], rowH = 0, binY = 0, pitchD = 0, minPegGap = 0;
let sOrg = 0, tOrg = 0, walls = [], wallL = -HS, wallR = HS;     // lattice origin; wall outlines and innermost x
let pegFlash = new Float32Array(0), pegCol = [], lit = new Set();
const g = () => 9.81 * Math.sin(P.incline * Math.PI / 180) / (MM / 1000);   // along the board, logo units/s²

function buildWorld() {
  world = new pl.World({ gravity: Vec2(0, g() * S), allowSleep: true });
  const frame = world.createBody({ type: 'static' });
  const fd = { friction: P.friction, restitution: P.restitution };
  frame.createFixture({ shape: pl.Box(4 * HS * S, 0.5 * S, Vec2(0, (HS + 0.5) * S), 0), ...fd, userData: { kind: 'floor' } });
  const mark = world.createBody({ type: 'static' });
  CONVEX.forEach((parts, i) => { for (const part of parts) mark.createFixture({ shape: pl.Polygon(part.map(([x, y]) => Vec2(x * S, y * S))), ...fd, userData: { kind: 'mark', i } }); });

  world.on('begin-contact', c => {
    const a = c.getFixtureA().getUserData(), b = c.getFixtureB().getUserData();
    const [ball, other, bf] = a.kind === 'ball' ? [a, b, c.getFixtureA()] : b.kind === 'ball' ? [b, a, c.getFixtureB()] : [];
    if (!ball) return;
    const u = bf.getBody().getUserData();
    if (other.kind === 'peg' && P.flash > 0) { pegFlash[other.i] = 1; pegCol[other.i] = u.col; lit.add(other.i); }
    else if (other.kind === 'mark') {
      u.mark = other.i;
      const v = bf.getBody().getLinearVelocity().length() / S;
      if (v > 0.5 && rings.length < 60) {
        const wm = c.getWorldManifold(null);
        if (wm && wm.pointCount) rings.push({ x: wm.points[0].x / S, y: wm.points[0].y / S, t: 0, dur: 0.35, col: pieceColor(other.i), R: 0.004 + Math.min(0.012, v * 0.004) });
      }
    }
  });
}

// Walls: a zigzag on the mark's own edge lines. Every face lies on a lattice line in the phase of a band edge, with
// the solid on the same side as the band's, so a peg beside a wall sits exactly as a peg beside the mark does, and the
// rows never leave a ball-wide slot or a wedge at the wall. Teeth run TOOTH cells along each face. The lowest tip sits
// at the divider row; below it the wall drops straight to the floor, so the outer bins are plain boxes.
const TOOTH = 2;
function buildWalls(d) {
  const T = TOOTH * MARK.cell, Ax = (MARK.A[0] + MARK.B[0]) / 2, By = MARK.B[1], F = HS + 0.3, h = MARK.band / 2;
  return [-1, 1].map(side => {
    // left: upper faces on s-lines, undersides on t-lines, in the phase of a band's upper edges (centre + band/2);
    // right: the mirror, in the phase of its lower edges (centre − band/2). p = s + t sets a tip's x, q = t − s its y.
    const p0 = MARK.sc + MARK.tc - side * 2 * h, q0 = MARK.tc - MARK.sc;
    const a = side < 0 ? Math.ceil((-HS / Ax + T - p0) / d) : Math.floor((HS / Ax - T - p0) / d);   // outer notches inside the square
    let b = Math.floor((binY / By - q0) / d);                                                       // lowest tip at or above the divider row
    if ((a - b) & 1) b--;                                                                           // s and t both on the lattice
    const p = p0 + a * d, q = q0 + b * d, s = (p - q) / 2, t = (p + q) / 2;
    const polys = [], line = [];
    for (let k = 0; ; k++) {
      const si = s + k * T, ti = t - k * T, tip = MARK.toXY(si, ti);
      const top = side < 0 ? MARK.toXY(si, ti - T) : MARK.toXY(si + T, ti), bot = side < 0 ? MARK.toXY(si - T, ti) : MARK.toXY(si, ti + T);
      const low = k ? bot : [tip[0], HS + 0.5];
      polys.push([top, tip, low, [side * F, low[1]], [side * F, top[1]]]);
      line.unshift(top, tip);
      if (top[1] < -HS - 0.1) break;
    }
    line.push([line[line.length - 1][0], HS + 0.5]);
    return { side, polys, line, x: MARK.toXY(s, t)[0] };
  });
}

// Pegs: lattice points sOrg + i·d along A, tOrg + j·d along B. The step d is the mark's cell over a whole number, so
// every band of the mark meets the lattice in the same phase; the origin sits on a band's centre line or half a step
// off it, whichever brings the first row outside every edge closest to the clearance. So the rows run parallel to
// each edge at one fixed distance, on all three chevrons. Row k = j − i is horizontal (the two axes mirror each other).
// A point keeps its peg if it lies on the board, below the drop line, and clears both the mark and the walls.
// The row nearest BIN_H above the floor becomes the divider tops, so the bins sit under the last row's gaps.
function buildBoard() {
  if (boardBody) world.destroyBody(boardBody);
  const per = MARK.steps * Math.max(1, Math.round(P.pitch / MARK.steps));   // pegs per band period, kept in step with the cell
  const d = MARK.period / per, pr = P.pegRadius / MM, keep = pr + P.clearance / MM;
  pitchD = d;
  rowH = (MARK.B[1] - MARK.A[1]) / 2 * d;
  const need = keep / MARK.sin, half = MARK.band / 2;
  const first = ph => (Math.ceil((need + half) / d - ph - 1e-9) + ph) * d - half;
  const ph = first(0) <= first(0.5) ? 0 : 0.5;
  sOrg = MARK.sc + ph * d; tOrg = MARK.tc + ph * d;
  const st = [[-HS, -HS], [HS, -HS], [HS, HS], [-HS, HS]].map(([x, y]) => MARK.toST(x, y));
  const i0 = Math.floor((Math.min(...st.map(p => p[0])) - sOrg) / d) - 1, i1 = Math.ceil((Math.max(...st.map(p => p[0])) - sOrg) / d) + 1;
  const j0 = Math.floor((Math.min(...st.map(p => p[1])) - tOrg) / d) - 1, j1 = Math.ceil((Math.max(...st.map(p => p[1])) - tOrg) / d) + 1;
  const rowY = k => MARK.toXY(sOrg, tOrg + k * d)[1];
  const k00 = Math.round((0 - rowY(0)) / rowH);
  const kb = k00 + Math.round((HS - BIN_H - rowY(k00)) / rowH);
  binY = rowY(kb);
  walls = buildWalls(d);
  wallL = walls[0].x; wallR = walls[1].x;
  const wallPolys = walls.flatMap(w => w.polys);
  const hw = Math.max(pr, 0.0012), binKeep = hw + 2.2 * ballR();   // the outer bins stay wide enough for a ball
  pegs = []; dividers = []; pegAt = new Map();
  let gap = Infinity;
  for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) {
    const k = j - i, [x, y] = MARK.toXY(sOrg + i * d, tOrg + j * d);
    if (k > kb || y < PEG_TOP || Math.abs(x) > HS) continue;
    if (k === kb) { if (x > wallL + binKeep && x < wallR - binKeep) dividers.push(x); continue; }
    const dw = polyDist(wallPolys, x, y).d;
    if (dw < keep - 1e-7) continue;
    const { d: dm, k: piece } = polyDist(OUTLINES, x, y);
    if (dm < keep - 1e-7) continue;
    gap = Math.min(gap, dm - pr, dw - pr);
    pegAt.set(latKey(i, j), pegs.length);
    pegs.push({ x, y, k, i, j, r: pr, dm: dm - keep, piece });
  }
  minPegGap = gap;
  dividers.sort((a, b) => a - b);

  boardBody = world.createBody({ type: 'static' });
  const fd = { friction: P.friction, restitution: P.restitution };
  pegs.forEach((p, i) => boardBody.createFixture({ shape: pl.Circle(Vec2(p.x * S, p.y * S), p.r * S), ...fd, userData: { kind: 'peg', i } }));
  for (const poly of wallPolys) boardBody.createFixture({ shape: pl.Polygon(poly.map(([x, y]) => Vec2(x * S, y * S))), ...fd, userData: { kind: 'wall' } });
  for (const x of dividers) {
    boardBody.createFixture({ shape: pl.Box(hw * S, (HS - binY) / 2 * S, Vec2(x * S, (binY + HS) / 2 * S), 0), ...fd, userData: { kind: 'divider' } });
    boardBody.createFixture({ shape: pl.Circle(Vec2(x * S, binY * S), hw * S), ...fd, userData: { kind: 'divider' } });
  }
  const nb = dividers.length + 1;
  edges = [wallL, ...dividers, wallR];
  if (counts.length !== nb) { counts = new Array(nb).fill(0); shown = new Array(nb).fill(0); }
  pegFlash = new Float32Array(pegs.length); pegCol = new Array(pegs.length); lit = new Set();
  const n = pegs.length;
  glowW = new Float32Array(n); glowC = new Float32Array(n); glowRGB = new Float32Array(3 * n); glowAcc = new Float32Array(3 * n);

// ---- canvas & layout ----
const { canvas, ctx } = lab.canvas();
canvas.style.touchAction = 'none';
let sq = lab.square(), fit = fitLogo(sq), dpr = Math.min(2, window.devicePixelRatio || 1);
lab.on('resize', s => { sq = s; fit = fitLogo(s); dpr = Math.min(2, window.devicePixelRatio || 1); boardLayer = null; prevLayer = null; markLayer = null; sprites.clear(); render(); });
const X = lx => fit.cx + lx * fit.scale, Y = ly => fit.cy + ly * fit.scale;

// ---- state ----

// ---- balls ----

function clear() {

const binOf = x => { let i = 0; while (i < edges.length - 2 && x > edges[i + 1]) i++; return i; };

// ---- params ----
let boardTimer = 0;
lab.on('change', key => {

  if (key === 'pitch' && P.pitch % MARK.steps) { lab.set('pitch', MARK.steps * Math.max(1, Math.round(P.pitch / MARK.steps))); return; }
  if (key === 'pitch' || key === 'pegRadius' || key === 'clearance' || key === 'ballRadius') {

    if (boardLayer && !lab.calm) { prevLayer = boardLayer; fadeK = 0; }
    boardLayer = null; markLayer = null;

  }
  if (key === 'lattice' || key === 'glow' || key === 'reach') boardLayer = null;
  if (key === 'incline') { world.setGravity(Vec2(0, g() * S)); for (const b of balls) b.setAwake(true); }

    for (let b = world.getBodyList(); b; b = b.getNext()) for (let f = b.getFixtureList(); f; f = f.getNext()) { f.setFriction(P.friction); f.setRestitution(P.restitution); }

});
lab.on('palette', () => {

  for (const b of balls) { const u = b.getUserData(); u.col = P.tint && vivid() ? ramp(lab.palette, (u.x0 + HS) / (2 * HS)) : lab.palette.ink; }

// ---- pointer: tap drops, hold pours ----
const toLogo = e => { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left - fit.cx) / fit.scale, y: (e.clientY - r.top - fit.cy) / fit.scale }; };
canvas.addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  const p = toLogo(e);
  if (Math.abs(p.x) > HS + 0.05) return;

canvas.addEventListener('pointermove', e => {
  const p = toLogo(e);

const release = e => { if (pour && e.pointerId === pour.id) { pour = null; idleT = 0; } };

// ---- simulation ----
function physicsStep() {

  world.step(H, 8, 3);
}

function update(dt) {
  clock += dt;
  // feeding: a held pointer pours at the drop rate; idle boards feed themselves along a slow wander
  if (pour) {
    pour.t += dt;
    if (pour.t > 0.25) { pour.acc = Math.min(3, pour.acc + dt * P.rate); while (pour.acc >= 1 && drop(pour.x)) pour.acc--; }
  } else if (!lab.calm) idleT += dt;

    autoAcc = Math.min(3, autoAcc + dt * P.rate);
    while (autoAcc >= 1) {
      const x = HS * 0.8 * Math.sin(clock * 0.21 + 1.6 * Math.sin(clock * 0.067)) + gauss() * 0.04;
      if (!drop(x)) break;

  }

    u.age += dt;

    if (y > HS + 0.1 || Math.abs(x) > HS + 0.1) { retire(b, 'lost'); continue; }
    const v = b.getLinearVelocity().length() / S;

// ---- drawing ----
const vivid = () => lab.palette.key !== 'bench';
const pieceColor = i => vivid() ? ramp(lab.palette, PIECE_T[i]) : lab.palette.ink;

// ---- halftone ----

// Static board, in two layers so ball light can redraw pegs between them: the pegs at their mark-lit tones, then the

let boardLayer = null, prevLayer = null, markLayer = null;
function drawBoard() {
  tones();

// The mark with its glow, over a faint keep-out band as wide as the clearance.

  if (prevLayer && fadeK < 1) {
    const k = fadeK * fadeK * (3 - 2 * fadeK);
    ctx.globalAlpha = 1 - k; ctx.drawImage(prevLayer.pegs, 0, 0); ctx.drawImage(prevLayer.frame, 0, 0);
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = k; ctx.drawImage(boardLayer.pegs, 0, 0); ctx.drawImage(boardLayer.frame, 0, 0);
    ctx.restore();
  } else {
    ctx.drawImage(boardLayer.pegs, 0, 0);
    ctx.restore();
    drawBallLight();
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(boardLayer.frame, 0, 0); ctx.restore();
  }

  // bin counts
  if (P.counts) {
    const bw = (X(edges[1]) - X(edges[0]));
    if (bw > 14) {
      ctx.font = `400 ${bw > 24 ? 10 : 9}px "JetBrains Mono", monospace`; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      for (let i = 0; i < counts.length; i++) {
        if (!counts[i]) continue;
        ctx.fillStyle = rgba(pal.ink, 0.6);
        ctx.fillText(String(counts[i]), (X(edges[i]) + X(edges[i + 1])) / 2, Y(binY) + 6);
      }
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    }
  }

  // the mark
  if (!markLayer) markLayer = drawMark();
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(markLayer, 0, 0); ctx.restore();

  // lit pegs, additive
  if (lit.size) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const rp = Math.max(0.75, pr * s);
    for (const i of lit) {
      const f = pegFlash[i], p = pegs[i], col = pegCol[i] || pal.ink, x = dot(X(p.x)), y = dot(Y(p.y)), rp = Math.max(0.75, p.r * s);
      ctx.fillStyle = rgba(col, 0.35 * f);
      ctx.beginPath(); ctx.arc(x, y, rp + 5 * f, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = rgba(col, f);
      ctx.beginPath(); ctx.arc(x, y, rp + 0.8, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  // trails, in three fading chunks per ball
  if (P.trails) {
    ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (const b of balls) {
      const u = b.getUserData(), tr = u.trail;
      if (tr.length < 3) continue;
      const n = tr.length, w = Math.max(1, u.r * s * 1.1);
      for (let c = 0; c < 3; c++) {
        const a = Math.floor(c * (n - 1) / 3), z = Math.floor((c + 1) * (n - 1) / 3);
        if (z <= a) continue;
        ctx.strokeStyle = rgba(u.col, 0.07 + 0.08 * c); ctx.lineWidth = w * (0.5 + 0.25 * c);
        ctx.beginPath(); ctx.moveTo(X(tr[a].x), Y(tr[a].y));
        for (let q = a + 1; q <= z; q++) ctx.lineTo(X(tr[q].x), Y(tr[q].y));
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  // balls, interpolated between physics steps
  for (const b of balls) {
    const u = b.getUserData(), p = b.getPosition(), q = u.prev;
    drawBall(q.x + (p.x / S - q.x) * alpha, q.y + (p.y / S - q.y) * alpha, u.r, u.col);
  }
  for (const f of fading) drawBall(f.x, f.y, f.r, f.col, Math.max(0, f.life), f.sink ? 0.6 + 0.4 * f.life : 1 + (1 - f.life) * 0.6);

  // rings where balls strike or are caught by the mark
  if (rings.length) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineWidth = 1.2;
    for (const r of rings) {
      const k = r.t / r.dur;
      ctx.strokeStyle = rgba(r.col, 0.85 * (1 - k));
      ctx.beginPath(); ctx.arc(X(r.x), Y(r.y), r.R * s * (0.5 + k), 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
  }

  // the spout under a hovering mouse
  const sx = pour ? pour.x : hoverX;
  if (sx !== null && sx !== undefined) {
    const x = crisp(X(Math.max(-HS, Math.min(HS, sx)))), y = Y(DROP_Y), r = ballR() * s;
    ctx.strokeStyle = rgba(pal.ink, 0.55); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(x, y, r + 0.5, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, Y(-HS) + 2); ctx.lineTo(x, y - r - 3); ctx.stroke();
  }
}

let hudTick = 0;
function hud() {
  lab.hud(
    `${ballR() < P.ballRadius / MM - 1e-9 ? `ball ⌀ <b>${(2 * ballR() * MM).toFixed(1)} mm</b> (pitch-limited) · ` : ''}balls <b>${balls.length}</b> · binned <b>${binned}</b> · caught <b>${caught}</b>` +
    ` · lattice <b>±${MARK.slopeDeg.toFixed(1)}°</b> · g·sin θ <b>${(9.81 * Math.sin(P.incline * Math.PI / 180)).toFixed(2)} m/s²</b>`);
}

buildWorld();
buildBoard();
render();
hud();

lab.loop(dt => {
  update(dt);
  render();
  if (++hudTick % 6 === 0) hud();
});

// test hooks: advance and draw without requestAnimationFrame
window.__lab = {
  step(n = 1) { for (let i = 0; i < n; i++) update(1 / 60); render(); hud(); return this.state(); },
  drop: x => drop(x ?? 0, { force: true }), clear, reset: clear,
  pour(n = 100) { burst += n; },
  state: () => ({
    balls: balls.length, dropped, binned, caught, pegs: pegs.length, bins: counts.length, counts: counts.slice(),
    axesDeg: [MARK.A, MARK.B].map(v => +(Math.atan2(v[1], v[0]) * 180 / Math.PI).toFixed(3)), apexDeg: +MARK.apexDeg.toFixed(3),
    pitchMM: +(pitchD * MM).toFixed(2), minPegGapMM: +(minPegGap * MM).toFixed(2), lit: lit.size,
    cellMM: +(MARK.cell * MM).toFixed(2), steps: MARK.steps, walls: [wallL, wallR].map(x => +x.toFixed(4)),
    ballLit: Array.from(glowC).filter(v => v > 0.002).length
  }),
  world: () => world, MARK
};
</script>
