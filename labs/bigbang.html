<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { createLab } from './shared/lab.js';
import { logoPolygons, logoShapes, LOGO_FILL, LOGO_DEPTH } from './shared/logo.js';
import { ramp } from './shared/palettes.js';

// Each palette is a filter set: the ramp runs from the hottest, densest gas to the faintest, coldest wisps.
const FILTERS = [
  { key: 'sho',     name: 'Hubble SHO',    bg: '#000000', grid: '#13120c', ink: '#fff7e0', colors: ['#fff4c8', '#ffb800', '#ff3d2e', '#00e0c8', '#0070ff'] },
  { key: 'hoo',     name: 'Hα + OIII',     bg: '#000000', grid: '#190d14', ink: '#ffeef5', colors: ['#ffffff', '#ff3d8b', '#e0002a', '#00e5ff', '#0050ff'] },
  { key: 'webb',    name: 'Webb NIRCam',   bg: '#020100', grid: '#1b120a', ink: '#fff2dc', colors: ['#fff0cc', '#ffa424', '#ff4a14', '#b04dff', '#3355ff'] },
  { key: 'chandra', name: 'Chandra X-ray', bg: '#00010a', grid: '#0b1328', ink: '#eaf6ff', colors: ['#ffffff', '#4df6ff', '#1a78ff', '#c23dff', '#6a00d8'] },
  { key: 'halpha',  name: 'Hydrogen α',    bg: '#040000', grid: '#220a0d', ink: '#fff0f0', colors: ['#fff0ec', '#ff5a3c', '#ff0a3c', '#d4006e', '#6a0070'] },
  { key: 'radio',   name: 'Radio',         bg: '#02000a', grid: '#160a26', ink: '#f6ecff', colors: ['#ffffff', '#fff200', '#ff2d7f', '#8a2cff', '#2a10ff'] }
];

const QUALITY = { low: [28, 0.45], medium: [40, 0.68], high: [60, 0.85], ultra: [90, 1] };

const lab = createLab({
  number: '05',
  title: 'Big Bang',
  blurb: 'A cold dust cloud collapses into the mark.',
  teaches: 'A volumetric cloud in three.js, raymarched at reduced resolution and smoothed over several frames by temporal reprojection, the trick games use to make expensive effects affordable. A pull field shaped like the logo draws the gas in, and it spins up as it shrinks, like a real collapsing cloud.',
  hint: 'drag to orbit · tap to replay',
  palettes: FILTERS,
  defaultPalette: 'sho',
  grid: false,
  params: {
    hCloud:   { type: 'heading', label: 'Cloud' },
    density:  { type: 'range', label: 'Gas density', min: 0.2, max: 2.5, step: 0.05, value: 0.6 },
    octaves:  { type: 'range', label: 'fBm octaves', min: 1, max: 6, step: 1, value: 6 },
    warp:     { type: 'range', label: 'Turbulence (domain warp)', min: 0, max: 2, step: 0.05, value: 2 },
    flow:     { type: 'range', label: 'Churn speed', min: 0, max: 3, step: 0.05, value: 3, unit: '×' },
    stars:    { type: 'range', label: 'Star density', min: 0, max: 1, step: 0.01, value: 0.17 },
    hCollapse:{ type: 'heading', label: 'Collapse' },
    collapse: { type: 'range', label: 'Collapse time', min: 3, max: 16, step: 0.5, value: 3, unit: ' s' },
    swirl:    { type: 'range', label: 'Angular momentum (swirl)', min: 0, max: 3, step: 0.05, value: 0.55 },
    heat:     { type: 'range', label: 'Heating (compression → color)', min: 0, max: 2, step: 0.05, value: 2 },
    wobble:   { type: 'range', label: 'Clumping', min: 0, max: 1, step: 0.01, value: 1 },
    streaks:  { type: 'range', label: 'Accretion streaks', min: 0, max: 1, step: 0.01, value: 0.73 },
    hIgnite:  { type: 'heading', label: 'Ignition' },
    flash:    { type: 'range', label: 'Flash intensity', min: 0, max: 2, step: 0.05, value: 0.45 },
    pulse:    { type: 'range', label: 'Afterglow pulse', min: 0, max: 0.2, step: 0.005, value: 0.04 },
    pulseRate:{ type: 'range', label: 'Pulse rate', min: 0.2, max: 2, step: 0.05, value: 0.2, unit: '/s' },
    hold:     { type: 'range', label: 'Hold before replay', min: 2, max: 30, step: 1, value: 8, unit: ' s' },
    force:    { type: 'range', label: 'Replay blast force', min: 0.3, max: 2, step: 0.05, value: 2, unit: '×' },
    loop:     { type: 'toggle', label: 'Auto replay', value: true },
    hCamera:  { type: 'heading', label: 'Camera' },
    orbit:    { type: 'range', label: 'Orbit speed', min: 0, max: 30, step: 0.5, value: 3, unit: '°/s' },
    tilt:     { type: 'range', label: 'Orbit tilt', min: -45, max: 45, step: 1, value: 19, unit: '°' },
    time:     { type: 'range', label: 'Time scale', min: 0.1, max: 2, step: 0.05, value: 0.7, unit: '×' },
    quality:  { type: 'select', label: 'Quality (march steps · resolution)', value: 'medium', options: [['low', 'Low · 28 · 45%'], ['medium', 'Medium · 40 · 68%'], ['high', 'High · 60 · 85%'], ['ultra', 'Ultra · 90 · 100%']] }
  },
  actions: [
    { label: 'Replay', primary: true, action: () => replay() }
  ]
});

// ---- world: the key square is 10 units, the mark is LOGO_FILL of that, face-on in the xy plane ----
const SQ = 10, LOGO_W = SQ * LOGO_FILL, DEPTH = LOGO_DEPTH * LOGO_W, FOV = 22;
const ZC = -DEPTH / 2, HZ = DEPTH / 2;  // the mark's slab: front face at z = 0
const T0 = 1.2;                         // seconds of quiet cloud before gravity wins
const LMAX = Math.log(40);              // the cloud ends 40× smaller than it starts
const SETTLE = 3;                       // seconds after ignition before the hold timer counts
const TB = 2.4;                         // seconds the replay blast takes to scatter back into cloud

const { canvas } = lab.canvas({ context: 'none' });
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true }); }
catch (e) { lab.hud('WebGL is not available in this browser.'); throw e; }
renderer.outputColorSpace = THREE.SRGBColorSpace;

function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

// ---- 3D noise texture: four independent channels of smooth, tileable value noise ----
function makeNoise(N = 64, L = 16) {
  const rnd = mulberry32(5);
  const lat = [0, 1, 2, 3].map(() => Float32Array.from({ length: L * L * L }, rnd));
  const data = new Uint8Array(N * N * N * 4);
  const q = t => t * t * t * (t * (t * 6 - 15) + 10);
  const at = (g, x, y, z) => g[((z % L) * L + (y % L)) * L + (x % L)];
  for (let z = 0; z < N; z++) for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const fx = x / N * L, fy = y / N * L, fz = z / N * L;
    const ix = Math.floor(fx), iy = Math.floor(fy), iz = Math.floor(fz);
    const u = q(fx - ix), v = q(fy - iy), w = q(fz - iz);
    const o = ((z * N + y) * N + x) * 4;
    for (let c = 0; c < 4; c++) {
      const g = lat[c];
      const a = at(g, ix, iy, iz) + (at(g, ix + 1, iy, iz) - at(g, ix, iy, iz)) * u;
      const b = at(g, ix, iy + 1, iz) + (at(g, ix + 1, iy + 1, iz) - at(g, ix, iy + 1, iz)) * u;
      const cc = at(g, ix, iy, iz + 1) + (at(g, ix + 1, iy, iz + 1) - at(g, ix, iy, iz + 1)) * u;
      const d = at(g, ix, iy + 1, iz + 1) + (at(g, ix + 1, iy + 1, iz + 1) - at(g, ix, iy + 1, iz + 1)) * u;
      const ab = a + (b - a) * v, cd = cc + (d - cc) * v;
      data[o + c] = Math.round((ab + (cd - ab) * w) * 255);
    }
  }
  const tex = new THREE.Data3DTexture(data, N, N, N);
  tex.format = THREE.RGBAFormat; tex.type = THREE.UnsignedByteType;
  tex.minFilter = tex.magFilter = THREE.LinearFilter;
  tex.wrapS = tex.wrapT = tex.wrapR = THREE.RepeatWrapping;
  tex.unpackAlignment = 1; tex.needsUpdate = true;
  return tex;
}
const noiseTex = makeNoise();

// ---- the attractor: the mark's signed distance field in world units (y up), negative inside ----
// r: exact distance (for the glowing proto-mark and the halo)
// g: the same field blurred, so its creases between the chevrons are rounded off
// ba: the gradient of the blurred field, i.e. which way gravity pulls the gas toward the mark
const POLYS = logoPolygons({ curveSegments: 10 }).map(p => p.map(([x, y]) => [x * LOGO_W, -y * LOGO_W]));
const SDF_B = 6, SDF_N = 320, TEXEL = 2 * SDF_B / SDF_N;
const sdfData = new Float32Array(SDF_N * SDF_N);
function buildSdf() {
  const N = SDF_N;
  // Same sums as a per-texel pip() and segment loop, but on flat arrays, with each polygon's edge crossings found
  // once per row (sorted, then walked left to right): ~135 ms instead of ~420 ms on every load, same texture.
  const segs = POLYS.flatMap(p => p.map((a, i) => [a, p[(i + 1) % p.length]]));
  const E = segs.length, SA = new Float64Array(E * 4);
  segs.forEach(([[ax, ay], [bx, by]], e) => SA.set([ax, ay, bx - ax, by - ay], e * 4));
  for (let j = 0; j < N; j++) {
    const y = -SDF_B + (j + 0.5) * TEXEL;
    const rows = POLYS.map(poly => {
      const xs = [];
      for (let i = 0, k = poly.length - 1; i < poly.length; k = i++) {
        const [ax, ay] = poly[i], [bx, by] = poly[k];
        if ((ay > y) !== (by > y)) xs.push((bx - ax) * (y - ay) / (by - ay) + ax);
      }
      return xs.sort((a, b) => a - b);
    });
    const at = rows.map(() => 0);
    for (let i = 0; i < N; i++) {
      const x = -SDF_B + (i + 0.5) * TEXEL;
      let m = Infinity;
      for (let e = 0; e < E * 4; e += 4) {
        const ax = SA[e], ay = SA[e + 1], dx = SA[e + 2], dy = SA[e + 3];
        const t = Math.max(0, Math.min(1, ((x - ax) * dx + (y - ay) * dy) / (dx * dx + dy * dy)));
        const ex = x - ax - dx * t, ey = y - ay - dy * t, d = ex * ex + ey * ey;
        if (d < m) m = d;
      }
      let inside = false;
      for (let r = 0; r < rows.length; r++) { const xs = rows[r]; while (at[r] < xs.length && xs[at[r]] <= x) at[r]++; if ((xs.length - at[r]) & 1) inside = true; }
      sdfData[j * N + i] = (inside ? -1 : 1) * Math.sqrt(m);
    }
  }
  // separable gaussian blur, sigma 0.4 world units
  const R = Math.ceil(1.2 / TEXEL), sig = 0.4 / TEXEL;
  const w = Array.from({ length: 2 * R + 1 }, (_, k) => Math.exp(-((k - R) ** 2) / (2 * sig * sig)));
  const ws = w.reduce((a, b) => a + b, 0);
  const tmp = new Float32Array(N * N), blur = new Float32Array(N * N);
  const cl = v => v < 0 ? 0 : v >= N ? N - 1 : v;
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    let s = 0;
    for (let k = -R; k <= R; k++) s += w[k + R] * sdfData[j * N + cl(i + k)];
    tmp[j * N + i] = s / ws;
  }
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    let s = 0;
    for (let k = -R; k <= R; k++) s += w[k + R] * tmp[cl(j + k) * N + i];
    blur[j * N + i] = s / ws;
  }
  const out = new Uint16Array(N * N * 4), h = THREE.DataUtils.toHalfFloat;
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const o = j * N + i;
    const gx = (blur[j * N + cl(i + 1)] - blur[j * N + cl(i - 1)]) / (2 * TEXEL);
    const gy = (blur[cl(j + 1) * N + i] - blur[cl(j - 1) * N + i]) / (2 * TEXEL);
    out[o * 4] = h(sdfData[o]); out[o * 4 + 1] = h(blur[o]); out[o * 4 + 2] = h(gx); out[o * 4 + 3] = h(gy);
  }
  const tex = new THREE.DataTexture(out, N, N, THREE.RGBAFormat, THREE.HalfFloatType);
  tex.minFilter = tex.magFilter = THREE.LinearFilter;
  tex.needsUpdate = true;
  return tex;
}
const sdfTex = buildSdf();
function sdfAt(x, y) {
  const cx = Math.max(-SDF_B, Math.min(SDF_B, x)), cy = Math.max(-SDF_B, Math.min(SDF_B, y));
  const i = Math.min(SDF_N - 1, Math.floor((cx + SDF_B) / (2 * SDF_B) * SDF_N));
  const j = Math.min(SDF_N - 1, Math.floor((cy + SDF_B) / (2 * SDF_B) * SDF_N));
  return sdfData[j * SDF_N + i] + Math.hypot(x - cx, y - cy);
}

// ---- shared GLSL ----
const GLSL_COMMON = /* glsl */`
precision highp sampler3D;
uniform sampler3D uNoise;
uniform sampler2D uSdf;
uniform float uB;
uniform mat4 uInvVP;
uniform vec3 uCam;
uniform vec3 uC0, uC1, uC2, uC3, uC4;
varying vec2 vUv;
float sdf(vec2 p) {
  vec2 c = clamp(p, -uB, uB);
  return texture2D(uSdf, (c + uB) / (2.0 * uB)).r + length(p - c);
}
// all four channels, carried on past the baked square as plain distance from it
vec4 field(vec2 p) {
  vec2 c = clamp(p, -uB, uB);
  vec4 s = texture2D(uSdf, (c + uB) / (2.0 * uB));
  vec2 o = p - c; float l = length(o);
  if (l > 0.0) { s.rg += l; s.ba = normalize(s.ba + o / l * min(1.0, l)); }
  return s;
}
vec3 pal(float f) {
  f = clamp(f, 0.0, 1.0) * 4.0;
  if (f < 1.0) return mix(uC0, uC1, f);
  if (f < 2.0) return mix(uC1, uC2, f - 1.0);
  if (f < 3.0) return mix(uC2, uC3, f - 2.0);
  return mix(uC3, uC4, f - 3.0);
}
vec3 rayDir(vec2 uv) {
  vec4 w = uInvVP * vec4(uv * 2.0 - 1.0, 1.0, 1.0);
  return normalize(w.xyz / w.w - uCam);
}`;
const QUAD_VERT = /* glsl */`varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;

const shared = {
  uNoise: { value: noiseTex }, uSdf: { value: sdfTex }, uB: { value: SDF_B },
  uInvVP: { value: new THREE.Matrix4() }, uCam: { value: new THREE.Vector3() },
  uC0: { value: new THREE.Color() }, uC1: { value: new THREE.Color() }, uC2: { value: new THREE.Color() },
  uC3: { value: new THREE.Color() }, uC4: { value: new THREE.Color() },
  uTime: { value: 0 }
};

// ---- pass 1: raymarched cloud into a reduced-resolution target ----
const rtOpts = { type: THREE.HalfFloatType, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false };
const nebRT = new THREE.WebGLRenderTarget(4, 4, rtOpts);
// Temporal accumulation: each frame marches with a fresh jitter and blends into a short history,
// so the march noise averages out instead of reading as grain. History resets on fast changes.
const hist = [new THREE.WebGLRenderTarget(4, 4, rtOpts), new THREE.WebGLRenderTarget(4, 4, rtOpts)];
let histI = 0, histReset = true;
const accMat = new THREE.ShaderMaterial({
  uniforms: { uCur: { value: nebRT.texture }, uPrev: { value: hist[1].texture }, uK: { value: 1 },
    uInvVP: { value: new THREE.Matrix4() }, uPrevVP: { value: new THREE.Matrix4() }, uCam: { value: new THREE.Vector3() }, uTarget: { value: new THREE.Vector3() } },
  vertexShader: QUAD_VERT,
  // reproject: find where this pixel's ray crosses the plane through the orbit target, look that
  // point up in last frame's view, and clamp the history to this frame's neighbourhood
  fragmentShader: `uniform sampler2D uCur, uPrev; uniform float uK; uniform mat4 uInvVP, uPrevVP; uniform vec3 uCam, uTarget; varying vec2 vUv;
    void main() {
      vec4 w = uInvVP * vec4(vUv * 2.0 - 1.0, 1.0, 1.0);
      vec3 rd = normalize(w.xyz / w.w - uCam), fwd = normalize(uTarget - uCam);
      vec3 P = uCam + rd * dot(uTarget - uCam, fwd) / max(dot(rd, fwd), 1e-3);
      vec4 c = uPrevVP * vec4(P, 1.0);
      vec2 puv = c.xy / c.w * 0.5 + 0.5;
      vec2 tx = 1.0 / vec2(textureSize(uCur, 0));
      vec4 cur = texture2D(uCur, vUv);
      vec4 a = texture2D(uCur, vUv + vec2(tx.x, 0.0)), b = texture2D(uCur, vUv - vec2(tx.x, 0.0));
      vec4 d = texture2D(uCur, vUv + vec2(0.0, tx.y)), e = texture2D(uCur, vUv - vec2(0.0, tx.y));
      vec4 lo = min(cur, min(min(a, b), min(d, e))), hi = max(cur, max(max(a, b), max(d, e)));
      vec4 prev = clamp(texture2D(uPrev, puv), lo - (hi - lo) * 0.5, hi + (hi - lo) * 0.5);
      bool ok = c.w > 0.0 && all(greaterThan(puv, vec2(0.0))) && all(lessThan(puv, vec2(1.0)));
      gl_FragColor = mix(prev, cur, ok ? uK : 1.0);
    }`
});
const accScene = new THREE.Scene();
const accQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), accMat);
accQuad.frustumCulled = false;
accScene.add(accQuad);
const nebMat = new THREE.ShaderMaterial({
  uniforms: { ...shared, uDensity: { value: 1 }, uWarp: { value: 1 }, uOct: { value: 5 }, uSteps: { value: 40 }, uSeed: { value: 0 }, uBoost: { value: 1 },
    uL: { value: 0 }, uLs: { value: 0 }, uFlat: { value: 1 }, uEat: { value: 0 }, uSwirl: { value: 1 }, uSpin: { value: 0 }, uHeat: { value: 0 }, uHeatK: { value: 1 }, uCloudW: { value: 1 }, uClear: { value: 0 },
    uAccW: { value: 0 }, uAccWid: { value: 1 }, uClump: { value: 1 }, uBox: { value: new THREE.Vector3(14, 14, 8) } },
  vertexShader: QUAD_VERT,
  fragmentShader: /* glsl */`
${GLSL_COMMON}
uniform float uTime, uDensity, uWarp, uBoost, uSeed;
uniform float uL, uLs, uFlat, uEat, uSwirl, uSpin, uHeat, uHeatK, uCloudW, uClear, uAccW, uAccWid, uClump;
uniform vec3 uBox;
uniform int uOct, uSteps;
const float ZC = ${ZC.toFixed(5)}, HZ = ${HZ.toFixed(5)};
const mat3 ROT = mat3(0.00, 0.80, 0.60, -0.80, 0.36, -0.48, -0.60, -0.48, 0.64);
// fractional Brownian motion: each octave doubles the frequency and shrinks the amplitude
float fbm(vec3 p) {
  float s = 0.0, a = 0.5, n = 0.0;
  for (int i = 0; i < 6; i++) {
    if (i >= uOct - 1) break;
    s += a * (texture(uNoise, p).r - 0.5);
    n += a; p = ROT * p * 2.03; a *= 0.58;
  }
  return n > 0.0 ? s / n : 0.0;
}
// the turbulent cloud as it was before the collapse: emission (rgb) and extinction (a) at q.
// hp is how far compression has heated this parcel, which slides it down the palette toward white.
vec4 cloud(vec3 q, float hp) {
  vec3 s = q * 0.06 + vec3(0.013 * uTime, 0.0, 0.006 * uTime);
  vec3 w = texture(uNoise, s * 0.55 + vec3(0.37, 0.11, 0.004 * uTime)).gba - 0.5;
  s += w * uWarp * 0.09;
  float region = texture(uNoise, s * 0.35 + vec3(0.7)).a - 0.5;
  float n0 = texture(uNoise, s).r - 0.5;
  float n = uOct > 1 ? n0 * 0.58 + fbm(ROT * s * 2.03) * 0.42 : n0 * 0.8;
  // a big soft ball of gas, broken up into continents
  float env = 1.0 - smoothstep(0.4, 1.0, length(q / vec3(12.0, 12.0, 7.0)));
  env *= smoothstep(0.38, 0.56, texture(uNoise, s * 0.3 + vec3(0.13, 0.71, 0.37)).r + n * 0.25);
  float d = smoothstep(0.09, 0.3, n);
  float fe = (n - 0.1) / 0.035;
  float fil = exp(-fe * fe);                      // ionization fronts
  d = (d * d * (3.0 - 2.0 * d) + fil * 0.55) * env;
  float dn = texture(uNoise, ROT * s * 2.4 + vec3(0.5)).g + 0.5 * texture(uNoise, ROT * ROT * s * 5.1 + vec3(0.2)).b - 0.75;
  float lane = dn / 0.03;
  float dust = (exp(-lane * lane) * 0.7 + smoothstep(0.24, 0.4, dn + n * 0.3) * 0.6) * env;
  float sp = smoothstep(-0.06, 0.06, region + 0.07 + (texture(uNoise, s * 1.3).a - 0.5) * 0.25);
  // cold gas sits at the faint end of the ramp; compression drags it toward the hot end
  float f = mix(0.32, 0.8, sp) - smoothstep(0.22, 0.36, n) * mix(0.3, 0.7, sp) + 0.22 * (1.0 - uHeat) - hp;
  vec3 c = pal(f) * (1.0 + fil * 0.8) * (0.45 + 0.55 * uHeat + hp);
  return vec4(c * d * (0.08 + 2.2 * d), d + dust * 2.4);
}
void main() {
  vec3 ro = uCam, rd = rayDir(vUv);
  // only march the box the gas can still occupy; it shrinks around the mark as the cloud falls in
  vec3 inv = 1.0 / (rd + sign(rd) * 1e-6 + vec3(equal(rd, vec3(0.0))) * 1e-6);
  vec3 bc = vec3(0.0, 0.0, ZC);

    if (press.drag) {
      dragYaw -= dx * 0.008;
      dragPitch = Math.max(-1.1, Math.min(1.1, dragPitch + dy * 0.006));
      press.x = e.clientX; press.y = e.clientY;
    }
  }
  canvas.style.cursor = press?.drag ? 'grabbing' : lab.calm ? '' : 'pointer';
});
canvas.addEventListener('pointerup', e => {
  if (!press || press.id !== e.pointerId) return;
  const wasDrag = press.drag; press = null;
  if (!wasDrag) replay();
});
canvas.addEventListener('pointercancel', () => { press = null; });

let st = seqState(0);
const orbitTarget = new THREE.Vector3(), camFwd = new THREE.Vector3(0, 0, -1), _v = new THREE.Vector3();
const ahead = p => _v.subVectors(p, camera.position).dot(camFwd) > 0.5;
if (lab.calm) S = endS() + 4;    // reduced motion: the condensed mark, still

function update(dt) {
  const P = lab.params, calm = lab.calm;
  if (!calm) {
    churn += dt * P.time * P.flow / 3;
    beatT += dt * P.time * P.pulseRate;
    if (!press) { const r = Math.exp(-dt * 1.6); dragYaw *= r; dragPitch *= r; }
    if (mode === 'seq') {
      S += dt * P.time;
      yaw += dt * P.time * P.orbit * Math.PI / 180;
      if (P.loop && S > T0 + P.collapse + SETTLE + P.hold) replay();
    } else {
      B += dt * P.time;
      if (B >= TB) { mode = 'seq'; S = 0; yaw = 0; }
    }
  }
  st = mode === 'blast' ? blastState(B) : seqState(S);

  // camera: a slow tilted orbit around the cloud that unwinds to face-on as the mark condenses
  const front = st.front;
  const az = mode === 'blast' ? st.az : yaw * (1 - front);
  const el = P.tilt * Math.PI / 180 * (1 - front);
  curAz = az; curEl = el;
  const shake = calm ? 0 : st.flash * P.flash * 0.05;
  const dist = D0 * (1 + 0.12 * (1 - front));
  const A = az + dragYaw, E = el + dragPitch;
  camera.position.set(
    dist * Math.sin(A) * Math.cos(E) + shake * Math.sin(S * 91 + B * 83),
    dist * Math.sin(E) + shake * Math.sin(S * 77 + B * 61 + 1),
    dist * Math.cos(A) * Math.cos(E)
  );
  camera.lookAt(orbitTarget);
  camera.updateMatrixWorld();
  camera.getWorldDirection(camFwd);
  shared.uInvVP.value.multiplyMatrices(camera.matrixWorld, camera.projectionMatrixInverse);
  shared.uCam.value.copy(camera.position);
  shared.uTime.value = churn * 3;

  const nu = nebMat.uniforms;
  nu.uDensity.value = P.density;
  nu.uWarp.value = P.warp;
  nu.uOct.value = P.octaves;
  nu.uSteps.value = (QUALITY[P.quality] || QUALITY.medium)[0];
  nu.uSeed.value = (nu.uSeed.value + 17.13) % 1000;   // fresh jitter each frame, averaged by the history
  nu.uL.value = st.L; nu.uLs.value = st.Ls; nu.uFlat.value = st.flat; nu.uEat.value = st.eat;
  nu.uSwirl.value = P.swirl;
  nu.uSpin.value = st.spin * P.swirl;
  nu.uHeat.value = st.heat;
  nu.uHeatK.value = P.heat;
  nu.uCloudW.value = st.cloud;
  nu.uClear.value = st.clear;
  nu.uAccW.value = st.acc;
  nu.uAccWid.value = st.wid;
  nu.uClump.value = P.wobble;
  nu.uBoost.value = st.boost;
  // the gas can only be within (start radius / contraction) of the mark
  const C = Math.exp(st.L);
  nu.uBox.value.set(3.2 + 13 / C, 3.2 + 13 / C, HZ + 8 / C / st.flat + 0.3);

  const beat = heartbeat(beatT) * st.halo;
  const cu = compMat.uniforms;
  cu.uStars.value = P.stars;
  cu.uHalo.value = st.halo * 0.6 * (1 + P.pulse * 8 * beat);
  cu.uRs.value = mode === 'blast' ? P.force * 4 * B ** 0.8 : 0;
  cu.uShock.value = mode === 'blast' ? smooth(0, 0.06, B) * Math.exp(-B * 1.1) * from.mesh : 0;
  const flash = st.flash * P.flash * (calm ? 0 : 1);
  flashQuad.material.uniforms.uF.value = Math.min(1.2, flash * 0.95);
  bloom.strength = 0.32 + flash * 1.6 + 0.25 * st.hot * st.mesh;

  // the solid mark
  markU.uAlpha.value = st.mesh;
  markU.uHot.value = st.hot;
  markU.uGlow.value = 0.02 + P.pulse * 1.5 * beat;
  markMat.depthWrite = st.mesh > 0.99;
  for (const pc of pieces) {
    pose(pc.mesh, pc, st.b, P.force);
    pc.mesh.visible = st.mesh > 0.002 && ahead(pc.mesh.position);
    pc.ghosts.forEach((g, j) => {
      const bj = st.b - (j + 1) * 0.016;
      g.visible = mode === 'blast' && bj > 0 && st.mesh > 0.02 && !lab.calm;
      if (g.visible) { pose(g, pc, bj, P.force); g.visible = ahead(g.position); }
    });
  }
  ghostMats.forEach((m, j) => { m.opacity = ghostOp(j) * (from ? from.mesh : 0); });

  // streaks
  const pos = streakPos.array, col = streakCol.array;
  let n = 0;
  const shown = P.streaks;
  if (mode === 'seq' && st.u > 0 && st.tau < 0) {
    // infall: r shrinks as (1 - e²) so the parcel accelerates, and it winds round as it falls
    const at = (sp, e, out) => {
      const r = sp.r0 * (1 - e * e), ph = sp.phi0 - P.swirl * 2.4 * e * e * e, z = sp.z0 * (1 - e * e);
      out[0] = sp.T.x + r * Math.cos(ph); out[1] = sp.T.y + r * Math.sin(ph) * 0.9; out[2] = sp.T.z + z;
    };
    // each streak is two short segments (tail, mid, head) so it bends along its spiral
    const a = [0, 0, 0], m = [0, 0, 0], b = [0, 0, 0];
    for (const sp of streaks) {
      if (sp.pick > shown) continue;
      const e = clamp01((st.u - sp.s) / sp.dur);
      if (e <= 0 || e >= 1) continue;
      const len = 0.02 + 0.035 * e;
      at(sp, Math.max(0, e - len), a); at(sp, Math.max(0, e - len / 2), m); at(sp, e, b);
      const fade = smooth(0, 0.25, e) * (1 - smooth(0.85, 1, e)) * (0.15 + 1.1 * e * e);
      const c = lut(mix(0.8, 0.05, e ** 1.5)), f0 = fade * 0.1, f1 = fade * 0.5;
      pos.set([...a, ...m, ...m, ...b], n * 6);
      col.set([c.r * f0, c.g * f0, c.b * f0, c.r * f1, c.g * f1, c.b * f1, c.r * f1, c.g * f1, c.b * f1, c.r * fade, c.g * fade, c.b * fade], n * 6);
      n += 2;
    }
  } else if (mode === 'blast' && from.mesh > 0.05) {
    // replay: sparks thrown off the mark's outline
    const t1 = st.b, reach = tt => (1 - Math.exp(-1.3 * tt)) / 1.3;
    for (const sp of streaks) {
      if (sp.pick > Math.max(shown, 0.4)) continue;
      const fade = Math.exp(-t1 / sp.life) * (1 + 3 * Math.exp(-t1 * 6)) * smooth(0, 0.03, t1) * from.mesh;
      if (fade < 0.01) continue;
      const v = sp.speed * P.force;
      const h1 = reach(t1) * v, h0 = reach(Math.max(0, t1 - 0.07)) * v;
      pos.set([sp.o.x + sp.d.x * h0, sp.o.y + sp.d.y * h0, sp.o.z + sp.d.z * h0, sp.o.x + sp.d.x * h1, sp.o.y + sp.d.y * h1, sp.o.z + sp.d.z * h1], n * 6);
      const c = lut(sp.hue * 0.5);
      col.set([c.r * fade * 0.3, c.g * fade * 0.3, c.b * fade * 0.3, c.r * fade, c.g * fade, c.b * fade], n * 6);
      n++;
    }
  }
  streakGeo.instanceCount = n;
  streakPos.needsUpdate = streakCol.needsUpdate = true;
}

const prevVP = new THREE.Matrix4();
function render() {
  renderer.setRenderTarget(nebRT);
  renderer.render(nebScene, nebCam);
  // the history averages out march noise; let it follow faster while the gas is racing inward
  const busy = mode === 'blast' || (st.u > 0.6 && st.tau < 1.2);
  const au = accMat.uniforms;
  au.uK.value = histReset ? 1 : busy ? 0.55 : 0.3;
  histReset = false;
  au.uInvVP.value.copy(shared.uInvVP.value); au.uCam.value.copy(camera.position); au.uTarget.value.copy(orbitTarget);
  au.uPrevVP.value.copy(prevVP);
  prevVP.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  accMat.uniforms.uPrev.value = hist[histI ^ 1].texture;
  renderer.setRenderTarget(hist[histI]);
  renderer.render(accScene, nebCam);
  compMat.uniforms.uNeb.value = hist[histI].texture;
  histI ^= 1;
  renderer.setRenderTarget(null);
  composer.render();
}

let hudTick = 0;
const sci = x => { const e = Math.floor(Math.log10(x)); return `${(x / 10 ** e).toFixed(1)}×10<sup>${e}</sup>`; };
function hud() {
  const C = Math.exp(st.L), r = 1 / C;
  if (mode === 'blast') lab.hud(`replay · blast wave r <b>${compMat.uniforms.uRs.value.toFixed(1)} u</b> · the gas spreads back out to radius <b>${r.toFixed(2)}</b>`);
  else if (st.u <= 0) lab.hud(`cold molecular cloud · T <b>10 K</b> · radius <b>1.00</b> · ${lab.params.octaves} octaves of fBm`);
  else if (st.tau < 0) lab.hud(`free fall · radius <b>${r.toFixed(2)}</b> · spin ∝ 1/r² <b>${(C * C).toFixed(C < 3 ? 1 : 0)}×</b> · T ∝ 1/r <b>${Math.round(10 * C)} K</b>`);
  else if (st.tau < SETTLE) lab.hud(`ignition · core T ≈ <b>${sci(1.5e7 * (0.4 + 0.6 * st.hot))} K</b> · the mark condenses`);
  else lab.hud(`condensed · radius <b>${r.toFixed(3)}</b> · the leftover disc disperses${lab.params.loop && !lab.calm ? ` · replay in <b>${Math.max(0, T0 + lab.params.collapse + SETTLE + lab.params.hold - S).toFixed(0)} s</b>` : ''}`);
}

window.__lab = {
  renderOnce(t) { if (t !== undefined) churn = t; update(0); render(); hud(); },
  // seek(seconds into the sequence): 0 is the quiet cloud, T0 + collapse is ignition
  seek(seconds, yawDeg) {
    mode = 'seq'; S = Math.max(0, seconds); histReset = true;
    yaw = yawDeg !== undefined ? yawDeg * Math.PI / 180 : S * lab.params.orbit * Math.PI / 180;
    update(0); render(); hud();
  },
  // blastAt(seconds into a replay started from the condensed mark)
  blastAt(b) {
    mode = 'seq'; S = endS(); update(0); replay(); B = b; histReset = true;
    update(0); render(); hud();
  },
  ignition: () => T0 + lab.params.collapse,
  state: () => ({ mode, S, B, ...st })
};

lab.loop(dt => {
  if (lab.calm && dirty <= 0) return;
  if (lab.calm) dirty--;
  update(dt);
  render();
  if (++hudTick % 6 === 0 || lab.calm) hud();
});
</script>
